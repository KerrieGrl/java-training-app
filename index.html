function activeWork(){const rows=[];state.exercises.forEach(e=>{if(e.status==='Parked'||e.status==='Complete')return;e.components.forEach(c=>{if(c.status==='Parked'||c.status==='Complete'||!c.currentStepId)return;const s=c.steps.find(z=>z.id===c.currentStepId);const g=displayGoalForExercise(e);if(s&&g)rows.push({g,e,c,s})})});return rows}
function weekStart(d=new Date()){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x}

function targetSessions(e,c){return state.sessions.filter(s=>s.exerciseId===e.id&&(!c||s.componentId===c.id)&&s.savedAt)}

function coverageRows(){const rows=[];state.goals.slice().sort((a,b)=>goalWeight(b.priority)-goalWeight(a.priority)).forEach(g=>{(g.exerciseIds||[]).map(id=>exercise(id)).filter(Boolean).forEach(e=>{if(e.components.length)e.components.forEach(c=>rows.push({g,e,c,stats:statsFor(e,c)}));else rows.push({g,e,c:null,stats:statsFor(e,null)})})});return rows}

function planWeekStart(){

}
function planDateKey(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function planWeekLabel(){

function planSetup(){
 state.weeklyPlan=state.weeklyPlan||{weekKey:weekKey(),entries:[],setup:{days:{},notes:''}};
 state.weeklyPlan.setup=state.weeklyPlan.setup||{days:{},notes:''};state.weeklyPlan.setup.days=state.weeklyPlan.setup.days||{};
 return state.weeklyPlan.setup
}
function planDays(){
 const start=planWeekStart(),setup=planSetup();
 return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const key=planDateKey(d),saved=setup.days[key]||{};

function planningFrequency(c){
 const f=c?.frequency;
 if(f&&typeof f==='object'){
  const v=Math.max(1,Number(f.value)||1);
  if(f.mode==='days')return Math.max(1,Math.round(7/v));
  return v;
 }
 return Math.max(1,Number(c?.desiredFrequency||c?.weeklyTarget||c?.targetPerWeek||f||1)||1)
}
function planningGoalWeight(e){
 const rank={Primary:3,Secondary:2,Development:1,Parked:0};
 const linked=(state.goals||[]).filter(g=>(e.goalIds||[]).includes(g.id));
 if(!linked.length)return 1;
 return Math.max(...linked.map(g=>rank[g.priority]??1))
}
function planComponentRows(){
 const now=new Date(),wk=weekStart(),rows=[];
 (state.exercises||[]).forEach(e=>{
  // Exercise status is an eligibility gate. Not Started / Parked / Complete never auto-schedule.
  if(!['Building','Maintenance'].includes(e.status))return;
  if(e.status==='Maintenance'&&state.settings?.planningIncludeMaintenance===false)return;
  (e.components||[]).forEach(c=>{
   // Component status is also an absolute gate.
   if(!['Building','Maintenance'].includes(c.status))return;
   if(c.status==='Maintenance'&&state.settings?.planningIncludeMaintenance===false)return;
   const ss=(state.sessions||[]).filter(s=>s.exerciseId===e.id&&s.componentId===c.id).sort((a,b)=>new Date(b.startedAt||b.sessionDate||0)-new Date(a.startedAt||a.sessionDate||0));
   const ld=ss[0]?new Date(ss[0].startedAt||ss[0].sessionDate):null;
   const days=ld&&isFinite(ld)?Math.max(0,Math.floor((now-ld)/86400000)):999;
   const r21=ss.filter(s=>{const d=new Date(s.startedAt||s.sessionDate||0);return isFinite(d)&&(now-d)/86400000<=21}).length;
   const tw=ss.filter(s=>{const d=new Date(s.startedAt||s.sessionDate||0);return isFinite(d)&&d>=wk}).length;
   const freq=planningFrequency(c);
   const building=c.status==='Building'&&e.status==='Building';
   const maintenance=!building;
   const high=building&&(c.priority==='High'||e.priority==='High');
   const goalWeight=planningGoalWeight(e);
   if(goalWeight===0)return; // An exercise linked only to Parked goals stays out of automatic planning.
   // Status + priority establish the lane. Neglect and frequency rank work INSIDE that lane.
   // Maintenance is intentionally capped below Building so stale maintenance cannot swamp active development.
   const neglect=days===999?42:Math.min(days,42);
   const lane=high?300:building?200:100;
   const score=lane+goalWeight*10+neglect*2+freq*5-r21*5-tw*10;
   rows.push({e,c,days,freq,score,lane,goalWeight,building,maintenance,high,r21,tw});
  });
 });
 return rows.sort((a,b)=>b.lane-a.lane||b.goalWeight-a.goalWeight||b.score-a.score||String(a.e.name).localeCompare(String(b.e.name))||String(a.c.name).localeCompare(String(b.c.name)))
}

  const dayFood=new Set((p.days[d.key]||[]).filter(x=>x.foodTraining).map(x=>x.exerciseId+'|'+x.componentId));

   const choices=foodRows.filter(r=>!dayFood.has(r.e.id+'|'+r.c.id)).map(r=>{
    const key=r.e.id+'|'+r.c.id,count=foodCounts.get(key)||0,exposures=plannedDays.get(key)||[];

',javaSetbacks,total)}${pObservationCard('👤 HANDLER · HELPED',handlerHelped,total)}${pObservationCard('👤 HANDLER · HURT',handlerHurt,total)}</div><div class="pCard"><div class="pHead">WHAT SEEMS RELATED TO PROGRESSION?</div>${[...sessionHandler,...handler,...place,...ints,...vr,...javaProgress,...javaSetbacks,...handlerHelped,...handlerHurt].sort((a,b)=>b.a-a.a||b.n-a.n).slice(0,8).map(r=>`<div class="barRow"><span>${esc(r.name)}</span><div class="barTrack"><div class="barFill" style="width:${r.n?Math.round(r.a/r.n*100):0}%"></div></div><b>${r.n?Math.round(r.a/r.n*100):0}%</b></div>`).join('')||'<div class="pEmptyChart">No advancement relationship data yet.</div>'}</div>${handlerTrendPanel(ss)}<div class="consider"><b>💡 THINGS TO CONSIDER</b><br>${ss.length<4?'Early data only. Keep logging sessions and FIELDWORK will compare what repeatedly appears around stronger results, stalls, advances, and setbacks.':`FIELDWORK is comparing ${ss.length} sessions. Presence percentages show how often a factor was logged. Beautiful/Good percentages show the outcome rate when that factor was present. These are associations, not proof of cause.`}</div>`}function deleteTrainingSession(id){const ss=state.sessions||[],idx=ss.findIndex(x=>x.id===id);if(idx<0)return;const x=ss[idx],e=exercise(x.exerciseId),c=component(x.exerciseId,x.componentId),label=`${e?.name||x.exerciseName||'Training'}${c?' → '+c.name:(x.componentName?' → '+x.componentName:'')}`;if(!confirm(`Delete this training session?\n\n${label}\n\nThis removes this saved session from Today, History, and Progress. It does not delete the exercise, component, or weekly plan.`))return;ss.splice(idx,1);save();toast('Training session deleted ✓');if(document.getElementById('progressScreen')?.classList.contains('active'))renderProgress();else if(document.getElementById('planScreen')?.classList.contains('active'))renderPlan();else renderHome()}
function pHistory(i){const ss=[...i.recent].reverse();return `<div class="pCard"><div class="pHead">SESSIONS · ${ss.length}</div>${ss.map(x=>`<div class="sessionRow"><span>${pDate(x).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span><div><b>Step ${pIdx(x)+1} → ${pIdx(x,true)+1}</b><div class="tiny muted">${esc(x.handlerState||'')}${x.location?' · '+esc(x.location):''}</div></div><div style="display:flex;align-items:center;gap:7px"><span class="coffeePill ${sessionCoffee(x)||''}">${esc(sessionCoffee(x)||'—')}</span><button class="btn small secondary" style="padding:6px 8px" onclick="event.stopPropagation();deleteTrainingSession('${x.id}')">DELETE</button></div></div>`).join('')||'<div class="pEmpty">No sessions in this window.</div>'}</div>`}

function renderMore(){const rp=state.settings.rewardPositions||[];document.getElementById('moreScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">MORE</div><div class="title">FIELDWORK</div></div></div><div class="card"><h3>Task Analysis / Curriculum</h3><p class="muted">Goals link to shared exercises. Exercises contain independent components and progressions.</p><button class="btn full" onclick="openCurriculumBuilder()">OPEN CURRICULUM BUILDER</button></div><div class="card"><h3>Libraries</h3><p class="muted">Reusable training information you define once and use across FIELDWORK.</p><button class="btn full secondary" onclick="openLibraryManager('places')">PLACES <span class="pill" style="float:right">${libraryItems('places').length}</span></button><button class="btn full secondary" style="margin-top:8px" onclick="openLibraryManager('articles')">ARTICLES <span class="pill" style="float:right">${libraryItems('articles').length}</span></button><button class="btn full secondary" style="margin-top:8px" onclick="openLibraryManager('reinforcers')">REINFORCERS <span class="pill" style="float:right">${libraryItems('reinforcers').length}</span></button><button class="btn full secondary" style="margin-top:8px" onclick="openRewardPositionManager()">REWARD POSITIONS <span class="pill" style="float:right">${(state.settings.rewardPositions||[]).length}</span></button><button class="btn full secondary" style="margin-top:8px" onclick="openLibraryManager('handlerStates')">HANDLER STATES <span class="pill" style="float:right">${libraryItems('handlerStates').length}</span></button><button class="btn full secondary" style="margin-top:8px" onclick="openInterferenceManager()">INTERFERENCES <span class="pill" style="float:right">${interferenceItems().length}</span></button><button class="btn full secondary" style="margin-top:8px" onclick="openLibraryManager('trainingObservations')">JAVA PROGRESS / SETBACK <span class="pill" style="float:right">${libraryItems('trainingObservations').length}</span></button><button class="btn full secondary" style="margin-top:8px" onclick="openLibraryManager('handlerObservations')">HANDLER HELPED / HURT <span class="pill" style="float:right">${libraryItems('handlerObservations').length}</span></button><button class="btn full secondary" style="margin-top:8px" onclick="openTemplateManager('tools')">TRAINING TOOL TEMPLATES <span class="pill" style="float:right">${templateItems('tools').length}</span></button><button class="btn full secondary" style="margin-top:8px" onclick="openTemplateManager('variables')">TRACKABLE VARIABLE TEMPLATES <span class="pill" style="float:right">${templateItems('variables').length}</span></button></div><div class="card"><h3>Training Settings</h3><div class="kicker">REWARD POSITIONS</div><p class="muted">Enter your own positions once. FIELDWORK will offer only your saved positions during Session Setup.</p>${rp.length?rp.map((x,i)=>`<div class="listrow"><div class="grow"><b>${esc(x)}</b></div><div class="moveBtns"><button class="btn small ghost" onclick="moveRewardPosition(${i},-1)">↑</button><button class="btn small ghost" onclick="moveRewardPosition(${i},1)">↓</button><button class="btn small secondary" onclick="editRewardPosition(${i})">EDIT</button><button class="btn small danger" onclick="deleteRewardPosition(${i})">DELETE</button></div></div>`).join(''):`<div class="empty">No reward positions saved yet.</div>`}<button class="btn full" onclick="addRewardPosition()">+ ADD REWARD POSITION</button></div><div class="card"><h3>Data safety</h3><p class="muted">Local-first. Export a backup before clearing browser data or moving devices.</p><div class="backupRow"><button class="btn secondary" onclick="exportBackup()">EXPORT BACKUP</button><button class="btn secondary" onclick="document.getElementById('restoreInput').click()">RESTORE BACKUP</button></div></div><div class="footerNote">FIELDWORK · Dashboard + Today Queue · Reward Positions</div>`}
function rewardPositionForm(index=null){const current=index===null?'':(state.settings.rewardPositions||[])[index]||'';sheet(`<h2>${index===null?'Add':'Edit'} Reward Position</h2><div class="field"><label>Reward Position</label><input id="rewardPositionName" value="${esc(current)}" placeholder="Enter your reward position"></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveRewardPosition(${index===null?'null':index})">SAVE</button></div>`)}
function addRewardPosition(){rewardPositionForm(null)}
function editRewardPosition(i){rewardPositionForm(i)}
function saveRewardPosition(i){const name=val('rewardPositionName');if(!name){alert('Enter a reward position.');return}state.settings.rewardPositions=state.settings.rewardPositions||[];const duplicate=state.settings.rewardPositions.some((x,n)=>n!==i&&x.trim().toLowerCase()===name.toLowerCase());if(duplicate){alert('That reward position is already saved.');return}if(i===null)state.settings.rewardPositions.push(name);else state.settings.rewardPositions[i]=name;save();closeSheet();renderMore();toast('Reward position saved ✓')}
function deleteRewardPosition(i){const a=state.settings.rewardPositions||[],name=a[i];if(name===undefined)return;if(!confirm(`Delete ${name} from your saved Reward Positions?`))return;a.splice(i,1);save();renderMore();toast('Reward position deleted ✓')}
function moveRewardPosition(i,d){const a=state.settings.rewardPositions||[],j=i+d;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderMore()}
function openRewardPositionManager(returnToSetup=false){const a=state.settings.rewardPositions||[];sheet(`<h2>Reward Positions</h2><p class="muted">Your reusable reward positions. Select as many as you actually use in a session.</p>${a.length?a.map((x,i)=>`<div class="listrow"><div class="grow"><b>${esc(x)}</b></div><button class="btn small secondary" onclick="editRewardPosition(${i})">EDIT</button><button class="btn small danger" onclick="deleteRewardPosition(${i})">DELETE</button></div>`).join(''):'<div class="empty">No reward positions saved yet.</div>'}<button class="btn full" onclick="addRewardPosition()">+ ADD REWARD POSITION</button><button class="btn secondary full" style="margin-top:8px" onclick="closeSheet();if(nav.session)renderLive();else if(nav.training)renderSetup()">DONE</button>`)}

function selectedSetupMulti(key){return [...document.querySelectorAll(`[data-multi="${key}"].selected`)].map(x=>x.dataset.value)}
function addRewardFromSetup(){sheet(`<h2>Add Reward Position</h2><p class="muted">Save it once and it will be available in future sessions.</p><div class="field"><label>Reward Position</label><input id="rewardPositionName" placeholder="Enter your reward position"></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveRewardFromSetup()">SAVE & USE</button></div>`)}
function saveRewardFromSetup(){const name=val('rewardPositionName');if(!name){alert('Enter a reward position.');return}state.settings.rewardPositions=state.settings.rewardPositions||[];if(!state.settings.rewardPositions.some(x=>x.trim().toLowerCase()===name.toLowerCase()))state.settings.rewardPositions.push(name);save();closeSheet();renderSetup();const sel=document.getElementById('setupReward');if(sel)sel.value=name;toast('Reward position saved ✓')}

if(nav.builder.level==='exercise'){const e=exercise(nav.builder.exerciseId);html+=`<div class="crumb">${esc(e.name)}</div><div class="card"><div class="kicker">LINKED GOALS</div><div>${goalsForExercise(e).map(g=>esc(g.name)).join(' · ')||'None'}</div><div class="hr"></div><div class="kicker">OVERALL EXERCISE / TRIAL CRITERIA</div><div style="white-space:pre-wrap">${esc(e.criteria||'Not entered')}</div><div class="hr"></div><div class="kicker">NOTES</div><div style="white-space:pre-wrap">${esc(e.notes||'Not entered')}</div><div class="hr"></div><div class="tiny muted">${esc(e.status)} · ${esc(e.priority)} · ${esc(freqText(e))}</div><div class="hr"></div><button class="btn small secondary" onclick="openExerciseForm('${e.id}')">EDIT EXERCISE</button></div><div class="sectionHead"><h2>Troubleshoot</h2></div>${builderTroubleshootSection(e,'exercise',e.id,'')}<div class="sectionHead"><h2>Components</h2></div>${e.components.map(c=>`<div class="listrow"><div class="grow"><b>${esc(c.name)}</b><div class="tiny muted">${esc(c.status)} · ${esc(c.priority)} · ${esc(freqText(c))} · ${esc(currentStepText(c))}</div></div><button class="btn small secondary js-open-component" data-component-id="${c.id}">OPEN</button></div>`).join('')}<button class="btn full" onclick="openComponentForm()">+ ADD COMPONENT</button>`}

dary" onclick="openStepForm('${s.id}')">•••</button></div></div>`).join('')}<button class="btn full" onclick="openStepForm()">+ ADD STEP</button>`}el.innerHTML=html}
function builderTroubleshootSection(x,scope,eid,cid){const items=troubleshootItems(x);return `<div class="card">${items.length?items.map((v,i)=>`<div class="listrow" style="align-items:flex-start"><div class="grow" style="white-space:pre-wrap">• ${esc(v)}</div><div class="moveBtns"><button class="btn small secondary" onclick="editBuilderTroubleshootBullet('${scope}','${eid}','${cid}',${i})">EDIT</button><button class="btn small danger" onclick="deleteBuilderTroubleshootBullet('${scope}','${eid}','${cid}',${i})">DELETE</button></div></div>`).join(''):`<div class="tiny muted" style="margin:8px 0">No troubleshooting reminders yet.</div>`}<button class="btn secondary full" style="margin-top:8px" onclick="addBuilderTroubleshootBullet('${scope}','${eid}','${cid}')">+ ADD BULLET</button></div>`}
function builderTroubleshootTarget(scope,eid,cid){return scope==='exercise'?exercise(eid):component(eid,cid)}
function addBuilderTroubleshootBullet(scope,eid,cid){const x=builderTroubleshootTarget(scope,eid,cid);if(!x)return;const v=prompt('Add troubleshooting bullet:');if(v==null||!v.trim())return;x.troubleshoot=troubleshootItems(x);x.troubleshoot.push(v.trim());save();renderBuilder();toast('Troubleshooting bullet added ✓')}
function editBuilderTroubleshootBullet(scope,eid,cid,i){const x=builderTroubleshootTarget(scope,eid,cid),a=troubleshootItems(x);if(!x||!a[i])return;const v=prompt('Edit troubleshooting bullet:',a[i]);if(v==null)return;if(!v.trim()){if(confirm('Delete this troubleshooting bullet?'))a.splice(i,1)}else a[i]=v.trim();x.troubleshoot=a;save();renderBuilder();toast('Troubleshooting updated ✓')}
function deleteBuilderTroubleshootBullet(scope,eid,cid,i){const x=builderTroubleshootTarget(scope,eid,cid),a=troubleshootItems(x);if(!x||!a[i])return;if(!confirm('Delete this troubleshooting bullet?'))return;a.splice(i,1);x.troubleshoot=a;save();renderBuilder();toast('Troubleshooting bullet deleted')}
function builderBack(){if(nav.builder.level==='component')nav.builder.level='exercise';else if(nav.builder.level==='exercise')nav.builder={level:'goal',goalId:nav.builder.goalId,exerciseId:null,componentId:null};else if(nav.builder.level==='goal')nav.builder={level:'root',goalId:null,exerciseId:null,componentId:null};else{show('moreScreen');return}renderBuilder()}
function openGoal(id){nav.builder={level:'goal',goalId:id,exerciseId:null,componentId:null};renderBuilder()}
function openExercise(id){nav.builder={level:'exercise',goalId:nav.builder.goalId,exerciseId:id,componentId:null};renderBuilder()}
function openComponent(id){nav.builder.level='component';nav.builder.componentId=id;renderBuilder()}
function openMoveComponent(componentId){const from=exercise(nav.builder.exerciseId),c=component(from.id,componentId),others=state.exercises.filter(e=>e.id!==from.id);if(!others.length){alert('Create the destination Exercise first.');return}sheet(`<h2>Move ${esc(c.name)}</h2><p class="muted">Move this entire Component — including its progression steps, current step, tools, and saved settings — to another Exercise. Nothing is retyped.</p><div class="field"><label>Move to Exercise</label><select id="moveDestination">${others.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="moveComponentNow('${componentId}')">MOVE</button></div>`)}

function promoteComponentNow(componentId){try{const from=exercise(nav.builder.exerciseId),idx=from?.components?.findIndex(c=>c.id===componentId);if(!from||idx<0)throw new Error('Original component was not found. Nothing changed.');const original=from.components[idx];const name=val('promoteName').trim()||original.name;const goalIds=[...document.querySelectorAll('.promoteGoal:checked')].map(x=>x.value);if(!goalIds.length)throw new Error('Choose at least one Goal for the new Exercise.');const snapshot=JSON.stringify(state);const preserved=JSON.parse(JSON.stringify(original));const innerComponent={...preserved,id:uid()};const newExercise={id:uid(),name,icon:'🐕',criteria:preserved.finishedPicture||'',notes:'',goalIds:[...goalIds],components:[innerComponent],status:original.status||'Not Started',priority:original.priority||'Normal',frequency:JSON.parse(JSON.stringify(original.frequency||{mode:'weekly',value:1}))};state.exercises.push(newExercise);state.goals.forEach(g=>{g.exerciseIds=g.exerciseIds||[];if(goalIds.includes(g.id)&&!g.exerciseIds.includes(newExercise.id))g.exerciseIds.push(newExercise.id)});save();const persisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));const pe=persisted.exercises.find(e=>e.id===newExercise.id),pc=pe?.components?.find(c=>c.id===innerComponent.id);if(!pe||!pc){state=JSON.parse(snapshot);save();throw new Error('FIELDWORK could not verify the new Exercise. The original Component is still untouched.');}const liveFrom=state.exercises.find(e=>e.id===from.id);const liveIdx=liveFrom?.components?.findIndex(c=>c.id===componentId)??-1;if(liveIdx<0){state=JSON.parse(snapshot);save();throw new Error('FIELDWORK could not find the original Component for the final move. Nothing was removed.');}liveFrom.components.splice(liveIdx,1);save();const finalPersisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));const finalExercise=finalPersisted.exercises.find(e=>e.id===newExercise.id);const finalGoalLinks=goalIds.every(gid=>finalPersisted.go function deleteComponent(id){
  const e=exercise(nav.builder.exerciseId),c=component(e?.id,id);
  if(!e||!c){alert('Component not found. Nothing changed.');return}
  const separate=state.exercises.find(x=>x.id!==e.id&&x.name.trim().toLowerCase()===c.name.trim().toLowerCase());
  const msg=separate
    ? `Delete ${c.name} ONLY as a Component from ${e.name}?\n\nThe separate ${separate.name} Exercise will NOT be deleted.\n\nThis removes this Component and its progression/tools from ${e.name}.`
    : `Delete ${c.name} from ${e.name}?\n\nThis permanently removes this Component and its progression/tools. No separate Exercise with the same name was found.`;
  if(!confirm(msg))return;
  const snapshot=JSON.stringify(state);
  e.components=e.components.filter(x=>x.id!==id);
  try{
    save();
    const persisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));
    const pe=persisted.exercises.find(x=>x.id===e.id);
    if(!pe||pe.components.some(x=>x.id===id))throw new Error('Delete could not be verified.');
    if(separate&&!persisted.exercises.some(x=>x.id===separate.id))throw new Error('Separate Exercise verification failed.');
    nav.builder={level:'exercise',goalId:nav.builder.goalId,exerciseId:e.id,componentId:null};
    render();toast(`${c.name} removed from ${e.name} ✓`);
  }catch(err){state=JSON.parse(snapshot);save();alert('FIELDWORK restored your data because the delete could not be verified. '+err.message)}
}

function refreshVariableOptions(existing=null){const type=document.getElementById('varType')?.value,box=document.getElementById('varOptions');if(!box)return;if(type==='choice')box.innerHTML=`<div class="field"><label>Choices — one per line</label><textarea id="varChoices">${esc((existing?.choices||[]).join('\n'))}</textarea></div>`;else if(type==='library')box.innerHTML=`<div class="field"><label>Library</label><select id="varLibrary"><option value="articles" ${existing?.libraryKey!=='places'?'selected':''}>Articles</option><option value="places" ${existing?.libraryKey==='places'?'selected':''}>Places</option><option value="reinforcers" ${existing?.libraryKey==='reinforcers'?'selected':''}>Reinforcers</option><option value="handlerStates" ${existing?.libraryKey==='handlerStates'?'selected':''}>Handler States</option></select></div>`;else box.innerHTML=''}
function saveVariable(id){const c=component(nav.builder.exerciseId,nav.builder.componentId);c.trackableVariables=c.trackableVariables||[];const name=val('varName'),type=document.getElementById('varType').value;if(!name){alert('Enter a variable name.');return}const obj={id:id||uid(),name,type,repeatable:document.getElementById('varRepeatable').checked,multiSelect:document.getElementById('varMultiSelect').checked};if(type==='choice')obj.choices=(document.getElementById('varChoices')?.value||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(type==='library')obj.libraryKey=document.getElementById('varLibrary').value;const i=c.trackableVariables.findIndex(x=>x.id===id);if(i>=0)c.trackableVariables[i]=obj;else c.trackableVariables.push(obj);save();closeSheet();render();toast('Trackable variable saved ✓')}
function deleteVariable(id){const c=component(nav.builder.exerciseId,nav.builder.componentId);if(!confirm('Delete this trackable variable? Existing curriculum and training tools will not be changed.'))return;c.trackableVariables=(c.trackableVariables||[]).filter(x=>x.id!==id);save();closeSheet();render();toast('Trackable variable deleted ✓')}
function componentToolsBuilder(c){c.tools=c.tools||[];return c.tools.length?c.tools.map(t=>`<div class="listrow"><div class="grow"><b>${esc(t.name)}</b><div class="tiny muted">${t.type==='timer'?`Random Timer · ${t.min}–${t.max} ${t.units}`:`Random ${esc(t.numberName)}${t.secondName?' + '+esc(t.secondName):''}`}</div></div><button class="btn small secondary" onclick="openToolForm('${t.type}','${t.id}')">EDIT</button></div>`).join(''):`<div class="card empty">No tools attached yet.</div>`}

function templateItems(kind){state.libraries=state.libraries||{};const key=kind==='tools'?'toolTemplates':'variableTemplates';state.libraries[key]=Array.isArray(state.libraries[key])?state.libraries[key]:[];return state.libraries[key]}
function cloneForComponent(obj){const x=JSON.parse(JSON.stringify(obj));x.id=uid();delete x.templateId;return x}
function chooseToolSource(){const a=templateItems('tools');sheet(`<h2>Add Training Tool</h2><p class="muted">Tools stay Component-specific. Start from a reusable template or create one just for this Component.</p>${a.length?`<button class="btn full" onclick="chooseExistingTemplate('tools')">CHOOSE EXISTING TEMPLATE</button>`:''}<button class="btn full secondary" style="margin-top:10px" onclick="chooseToolType()">CREATE NEW</button>`)}
function chooseVariableSource(){const a=templateItems('variables');sheet(`<h2>Add Trackable Variable</h2><p class="muted">Variables stay Component-specific. Start from a reusable template or create one just for this Component.</p>${a.length?`<button class="btn full" onclick="chooseExistingTemplate('variables')">CHOOSE EXISTING TEMPLATE</button>`:''}<button class="btn full secondary" style="margin-top:10px" onclick="openVariableForm()">CREATE NEW</button>`)}
function templateSummary(kind,x){if(kind==='tools')return x.type==='timer'?`${x.min}–${x.max} ${x.units||'seconds'}`:`${x.numberName||'Number'} ${x.min}–${x.max}${x.secondName?' + '+x.secondName:''}`;return `${variableTypeLabel(x)}${x.repeatable?' · Repeatable':''}`}
function chooseExistingTemplate(kind){const a=templateItems(kind);sheet(`<h2>Choose ${kind==='tools'?'Training Tool':'Trackable Variable'} Template</h2><p class="muted">This adds a Component-specific copy. You can edit this Component without changing the reusable template.</p>${a.map(x=>`<button class="btn full secondary" style="margin-top:8px;text-align:left" onclick="attachTemplate('${kind}','${x.id}')"><b>${esc(x.name)}</b><div class="tiny muted">${esc(templateSummary(kind,x))}</div></button>`).join('')}<button class="btn ghost full" style="margin-top:10px" onclick="${kind==='tools'?'chooseToolSource()':'chooseVariableSource()'}">BACK</button>`)}
function attachTemplate(kind,id){const t=templateItems(kind).find(x=>x.id===id);if(!t)return;const c=component(nav.builder.exerciseId,nav.builder.componentId);if(kind==='tools'){c.tools=c.tools||[];c.tools.push(cloneForComponent(t))}else{c.trackableVariables=c.trackableVariables||[];c.trackableVariables.push(cloneForComponent(t))}save();closeSheet();render();toast(`${kind==='tools'?'Training tool':'Trackable variable'} attached ✓`)}
function saveCurrentAsTemplate(kind,id){const c=component(nav.builder.exerciseId,nav.builder.componentId),src=kind==='tools'?(c.tools||[]).find(x=>x.id===id):(c.trackableVariables||[]).find(x=>x.id===id);if(!src)return;const a=templateItems(kind);if(a.some(x=>x.name.trim().toLowerCase()===src.name.trim().toLowerCase())){alert('A reusable template with that name already exists.');return}const t=JSON.parse(JSON.stringify(src));t.id=uid();a.push(t);save();toast('Saved as reusable template ✓')}
function openTemplateManager(kind){const a=templateItems(kind);sheet(`<h2>${kind==='tools'?'Training Tool':'Trackable Variable'} Templates</h2><p class="muted">Reusable starting points. Components still keep their own attached copies and settings.</p>${a.length?a.map(x=>`<div class="listrow"><div class="grow"><b>${esc(x.name)}</b><div class="tiny muted">${esc(templateSummary(kind,x))}</div></div><button class="btn small danger" onclick="deleteTemplate('${kind}','${x.id}')">DELETE</button></div>`).join(''):'<div class="empty">No reusable templates saved yet.</div>'}<button class="btn secondary full" style="margin-top:8px" onclick="closeSheet()">DONE</button>`)}
function deleteTemplate(kind,id){const a=templateItems(kind),i=a.findIndex(x=>x.id===id);if(i<0)return;if(!confirm('Delete this reusable template? Components already using it will not change.'))return;a.splice(i,1);save();openTemplateManager(kind)}

function chooseToolType(){sheet(`<h2>Add training tool</h2><button class="btn full" onclick="openToolForm('timer')">⏱ RANDOM TIMER</button><button class="btn full secondary" style="margin-top:10px" onclick="openToolForm('random')">🎲 RANDOM NUMBER + CUSTOM VARIABLE</button>`)}
function openToolForm(type,id){const c=component(nav.builder.exerciseId,nav.builder.componentId),t=id?(c.tools||[]).find(x=>x.id===id):null;if(type==='timer')sheet(`<h2>Random Timer</h2><div class="field"><label>Tool Name</label><input id="toolName" value="${esc(t?.name||'')}"></div><div class="field"><label>Minimum</label><input id="toolMin" type="number" value="${t?.min??60}"></div><div class="field"><label>Maximum</label><input id="toolMax" type="number" value="${t?.max??180}"></div><div class="field"><label>Units</label><select id="toolUnits"><option ${t?.units!=='minutes'?'selected':''}>seconds</option><option ${t?.units==='minutes'?'selected':''}>minutes</option></select></div><button class="btn full" onclick="saveTool('timer','${id||''}')">SAVE TOOL</button>${t?`<button class="btn secondary full" style="margin-top:10px" onclick="saveCurrentAsTemplate('tools','${t.id}')">SAVE AS REUSABLE TEMPLATE</button>`:''}`);else sheet(`<h2>Random Number + Custom Variable</h2><div class="field"><label>Tool Name</label><input id="toolName" value="${esc(t?.name||'')}"></div><div class="field"><label>Number variable name</label><input id="numberName" value="${esc(t?.numberName||'Steps')}"></div><div class="field"><label>Minimum</label><input id="toolMin" type="number" value="${t?.min??1}"></div><div class="field"><label>Maximum</label><input id="toolMax" type="number" value="${t?.max??10}"></div><div class="field"><label>How many results</label><input id="toolCount" type="number" value="${t?.count??3}"></div><div class="field"><label>Second variable name (optional)</label><input id="secondName" value="${esc(t?.secondName||'')}" placeholder="Leave blank to randomize only the number"></div><div class="field"><label>Possible values — one per line (optional)</label><textarea id="secondValues">${esc((t?.values||[]).join('\n'))}</textarea></div><div class="field"><label>Second variable selection</label><select id="randomValueMode"><option value="random" ${t?.valueMode!=='noRepeat'?'selected':''}>Random — repeats allowed</option><option value="noRepeat" ${t?.valueMode==='noRepeat'?'selected':''}>No repeats — use each once before reshuffling</option></select></div><button class="btn full" onclick="saveTool('random','${id||''}')">SAVE TOOL</button>${t?`<button class="btn secondary full" style="margin-top:10px" onclick="saveCurrentAsTemplate('tools','${t.id}')">SAVE AS REUSABLE TEMPLATE</button>`:''}`)}
function saveTool(type,id){try{const c=component(nav.builder.exerciseId,nav.builder.componentId);c.tools=c.tools||[];const name=val('toolName'),min=Number(val('toolMin')),max=Number(val('toolMax'));if(!name||max<min)throw new Error('Check tool values');let obj={id:id||uid(),type,name,min,max};if(type==='timer')obj.units=document.getElementById('toolUnits').value;else{obj.numberName=val('numberName');obj.count=Math.max(1,Number(val('toolCount'))||1);obj.secondName=val('secondName');obj.values=(document.getElementById('secondValues').value||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);obj.valueMode=document.getElementById('randomValueMode')?.value||'random'}const i=c.tools.findIndex(x=>x.id===id);if(i>=0)c.tools[i]=obj;else c.tools.push(obj);save();closeSheet();render();toast('Training tool saved ✓')}catch(e){alert(e.message)}}
function beginTraining(gid,eid,cid,sid){nav.training={gid,eid,cid,sid};nav.recordingMode='rep';show('setupScreen')}
function pickStepForTrain(gid,eid,cid){const c=component(eid,cid);sheet(`<h2>Choose ${esc(c.name)} step</h2>${c.steps.map((s,i)=>`<div class="listrow ${c.currentStepId===s.id?'current':''}"><div class="num">${i+1}</div><div class="grow"><b>${esc(s.name)}</b></div><button class="btn small" onclick="closeSheet();beginTraining('${gid}','${eid}','${cid}','${s.id}')">TRAIN</button></div>`).join('')}`)}
function selectField(label,id,opts,custom=false){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(x=>`<option>${esc(x)}</option>`).join('')}${custom?'<option>Custom / Other</option>':''}</select></div>`}
function setupLibraryField(label,id,key){const a=libraryItems(key);return a.length?selectField(label,id,a):`<div class="card"><div class="kicker">${label.toUpperCase()}</div><div class="muted tiny" style="margin:6px 0 10px">No ${libraryLabel(key).toLowerCase()} saved.</div><button class="btn secondary full" onclick="openLibraryManager('${key}')">+ ADD ${label.toUpperCase()}</button></div>`}
function defaultSessionTime(){const d=new Date(),m=Math.round(d.getMinutes()/5)*5;if(m===60){d.setHours(d.getHours()+1);d.setMinutes(0)}else d.setMinutes(m);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function localDateKey(value){const d=value instanceof Date?value:new Date(value||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function renderSetup(){if(!nav.training)return;const {gid,eid,cid,sid}=nav.training,g=goal(gid)||displayGoalForExercise(exercise(eid)),e=exercise(eid),c=component(eid,cid),s=step(eid,cid,sid),f=c.sessionFields||{place:true,reinforcer:true,rewardPosition:false,handlerState:true};document.getElementById('setupScreen').innerHTML=`<div class="topbar"><button class="btn small ghost" onclick="show('trainScreen')">‹ Back</button><div class="grow"><div class="eyebrow">SESSION SETUP</div><div class="title" style="font-size:21px">${esc(e.name)} — ${esc(c.name)}</div><div class="subtitle">${esc(s.name)}</div></div></div><div class="sessionContext"><span class="tiny muted">TODAY'S JOB</span><strong>${esc(s.todayJob||s.actions||'No Today’s Job entered')}</strong><button class="btn secondary full" style="margin-top:10px" onclick="openStepDetails('${e.id}','${c.id}','${s.id}','setup')">STEP DETAILS</button></div>${f.place?setupLibraryField('Place','setupLocation','places'):''}${f.reinforcer?multiChoiceField('Reinforcers','reinforcers',libraryItems('reinforcers'),state.settings.lastSetup?.reinforcers||[]):''}${f.rewardPosition?multiChoiceField('Reward Positions','rewardPositions',state.settings.rewardPositions||[],state.settings.lastSetup?.rewardPositions||[]):''}${f.handlerState?setupLibraryField('Handler State','setupHandler','handlerStates'):''}<div class="field"><label>TRAINING DATE</label><input id="setupSessionDate" type="date" value="${localDateKey()}"><div class="tiny muted">For entering an earlier training session.</div></div><div class="field"><label>SESSION TIME</label><input id="setupSessionTime" type="time" step="300" value="${defaultSessionTime()}"><div class="tiny muted" style="margin-top:5px">Defaults to now. Change it in 5-minute increments if you trained earlier or later.</div></div><div class="field"><label>SETUP NOTES (OPTIONAL)</label><textarea id="setupNotes" style="min-height:220px;width:100%;box-sizing:border-box" placeholder="Anything about setup, conditions, or what you plan to do..."></textarea></div><button class="btn full" onclick="startSession()">START TRAINING</button>`;const last=state.settings.lastSetup||{};[['setupLocation','place','rememberPlace'],['setupReinforcer','reinforcer','rememberReinforcer'],['setupReward','rewardPosition','rememberRewardPosition'],['setupHandler','handlerState','rememberHandlerState']].forEach(([id,k,t])=>{const el=document.getElementById(id);if(el&&state.settings[t]!==false&&last[k]&&[...el.options].some(o=>o.value===last[k]))el.value=last[k]})}
function setMode(m){nav.recordingMode=m;document.getElementById('modeRep').className='btn '+(m==='rep'?'':'secondary');document.getElementById('modeOverview').className='btn '+(m==='overview'?'':'secondary')}
function setMode(m){nav.recordingMode=m;document.getElementById('modeRep').className='btn '+(m==='rep'?'':'secondary');document.getElementById('modeOverview').className='btn '+(m==='overview'?'':'secondary')}
const outcomes=[['beautiful','☕','Beautiful'],['good','☕','Good'],['meh','☕','Meh'],['spilled','☕','Spilled']];
function liveTools(s){const c=component(s.exerciseId,s.componentId),tools=c?.tools||[];if(!tools.length)return '';return `<div class="card"><div class="kicker">TRAINING TOOLS</div>${tools.map(t=>t.type==='timer'?`<div class="listrow"><div class="grow"><b>⏱ ${esc(t.name)}</b><div class="tiny muted">${t.min}–${t.max} ${t.units}</div><div id="toolout-${t.id}" class="lime" style="font-size:22px;font-weight:900;margin-top:5px"></div></div><button class="btn small" onclick="generateTimer('${t.id}')">GENERATE</button></div>`:`<div><b>🎲 ${esc(t.name)}</b><div id="toolout-${t.id}" class="tiny" style="margin:8px 0"></div><button class="btn small" onclick="generateRandom('${t.id}')">GENERATE</button></div>`).join('')}</div>`}
function findTool(id){return (component(nav.session.exerciseId,nav.session.componentId)?.tools||[]).find(x=>x.id===id)}
function generateTimer(id){const t=findTool(id),n=Math.floor(Math.random()*(t.max-t.min+1))+t.min,sec=t.units==='minutes'?n*60:n;const el=document.getElementById('toolout-'+id);el.dataset.seconds=sec;el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;el.innerHTML+=` <button class="btn small secondary" onclick="startCountdown('${id}')">START</button>`}
const timers={};function startCountdown(id){clearInterval(timers[id]);const el=document.getElementById('toolout-'+id);let n=Number(el.dataset.seconds||0);timers[id]=setInterval(()=>{n--;el.dataset.seconds=n;el.firstChild.textContent=`${Math.floor(Math.max(0,n)/60)}:${String(Math.max(0,n)%60).padStart(2,'0')} `;if(n<=0){clearInterval(timers[id]);navigator.vibrate?.(200)}},1000)}
function generateRandom(id){const t=findTool(id),out=[],vals=[...(t.values||[])];if(t.valueMode==='noRepeat'&&t.secondName&&t.count>new Set(vals).size){alert('Not enough unique choices for this sequence. Add choices or reduce the result count.');return}let cycle=[];for(let i=0;i<t.count;i++){const n=Math.floor(Math.random()*(t.max-t.min+1))+t.min,hasSecond=t.secondName&&vals.length;let second='';if(hasSecond){if(t.valueMode==='noRepeat'){if(!cycle.length)cycle=[...new Set(vals)].sort(()=>Math.random()-.5);second=cycle.pop()||''}else second=vals[Math.floor(Math.random()*vals.length)]}out.push(hasSecond?`${n} ${t.numberName} → ${second}`:`${n} ${t.numberName}`)}document.getElementById('toolout-'+id).innerHTML=out.map(x=>`<div class="outcomeChip">${esc(x)}</div>`).join(' ')}
function preserveLiveNote(){if(nav.session){const el=document.getElementById('liveNotes');if(el)nav.session.note=el.value}}
function exitSession(){if(!nav.session){show('trainScreen');return}preserveLiveNote();const hasWork=!!((nav.session.note||'').trim()||(nav.session.reps||[]).length||(nav.session.interferences||[]).length||sessionCoffee(nav.session));if(!hasWork){nav.session=null;nav.training=null;show('trainScreen');return}sheet(`<h2>Leave this session?</h2><p class="muted">You have unsaved session work.</p><button class="btn full" onclick="closeSheet()">KEEP SESSION</button><button class="btn danger full" style="margin-top:9px" onclick="discardSession()">DISCARD SESSION</button>`)}
function discardSession(){nav.session=null;nav.training=null;closeSheet();show('trainScreen');toast('Session discarded')}
function variableInput(v){const id=`var_${v.id}`;if(v.type==='number')return `<div class="field"><label>${esc(v.name)}</label><input id="${id}" type="number" inputmode="decimal"></div>`;if(v.type==='boolean')return `<div class="field"><label><input id="${id}" type="checkbox" style="width:auto;margin-right:8px"> ${esc(v.name)}</label></div>`;const opts=v.type==='library'?libraryItems(v.libraryKey||'articles'):(v.choices||[]);return v.multiSelect?`<div class="field"><label>${esc(v.name)} · MULTIPLE</label>${opts.map(x=>`<label style="display:inline-flex;align-items:center;gap:5px;padding:7px"><input type="checkbox" class="recordMulti" data-var="${esc(v.id)}" value="${esc(x)}" style="width:auto">${esc(x)}</label>`).join('')}</div>`:`<div class="field"><label>${esc(v.name)}</label><select id="${id}"><option value="">Choose…</option>${opts.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`}
function recordVariablesUI(s){const vars=component(s.exerciseId,s.componentId)?.trackableVariables||[];if(!vars.length)return '';return `<div class="card"><div class="kicker">ADD A RECORD (OPTIONAL)</div><div class="tiny muted" style="margin-bottom:10px">Save one, many, or none. These fields come from this Component.</div>${vars.map(variableInput).join('')}<button class="btn full" onclick="addTrainingRecord()">+ SAVE RECORD</button></div>${s.reps.length?`<div class="card"><div class="kicker">RECORDED (${s.reps.length})</div>${s.reps.map((r,i)=>`<div class="listrow"><div class="grow"><b>${i+1}</b> <span class="tiny">${Object.entries(r.values||{}).map(([k,v])=>`${esc(k)}: ${esc(Array.isArray(v)?v.join(', '):String(v))}`).join(' · ')}</span></div><button class="btn small danger" onclick="deleteTrainingRecord(${i})">DELETE</button></div>`).join('')}</div>`:''}`}
function addTrainingRecord(){preserveLiveNote();const s=nav.session,vars=component(s.exerciseId,s.componentId)?.trackableVariables||[],values={};vars.forEach(v=>{if(v.multiSelect){const selected=[...document.querySelectorAll('.recordMulti')].filter(el=>el.dataset.var===v.id&&el.checked).map(el=>el.value);if(selected.length)values[v.name]=selected;return}const el=document.getElementById(`var_${v.id}`);if(!el)return;const value=v.type==='boolean'?el.checked:el.value;if(value!==''&&value!==false)values[v.name]=v.type==='number'?Number(value):value});s.reps.push({id:uid(),values,at:new Date().toISOString()});renderLive();toast('Record saved ✓')}
function deleteTrainingRecord(i){preserveLiveNote();nav.session.reps.splice(i,1);renderLive()}
function voiceNote(id){const el=document.getElementById(id);if(!el)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){el.focus();alert('Direct voice capture is not available in this browser. Tap the microphone on the iPhone keyboard to dictate into this Notes box.');return}const r=new SR();r.continuous=false;r.interimResults=false;r.lang='en-US';r.onresult=e=>{const words=[...e.results].map(x=>x[0].transcript).join(' ');el.value+=(el.value.trim()?' ':'')+words;if(nav.session&&id==='liveNotes')nav.session.note=el.value};r.onerror=()=>{el.focus();toast('Use the iPhone keyboard microphone for dictation.');};r.start();toast('Listening… 🎙')}
function stepNumber(eid,cid,sid){const c=component(eid,cid),i=c?.steps?.findIndex(x=>x.id===sid)??-1;return i>=0?i+1:''}
function stepJob(st){return st?.todayJob||st?.actions||'No Today’s Job entered'}

function observationChips(key,selected,field){const a=libraryItems(key);if(!a.length)return `<div class="empty" style="padding:12px">No saved items yet.</div>`;return `<div class="tagGrid">${a.map(x=>`<button class="tag ${(selected||[]).includes(x)?'selected':''}" onclick="toggleObservation('${field}',${JSON.stringify(x).replace(/"/g,'&quot;')})">${esc(x)}</button>`).join('')}</div>`}

function openObservationManager(key){syncSummaryFields();openLibraryManager(key)}

// Build 20: handler observations are saved on the same component session, independently of Java's coffee.
const handlerLevels=['Excellent','Solid','Inconsistent','Needs work'];
const mentalLevels=['Clear','Recovered','Struggled','Looped'];
const pressureChoices=['Unclear / conflicting dog behavior','Repeated unsuccessful reps','Technical criticism / club context','My own expectations','No significant pressure'];
const responseChoices=['Learner — diagnosed and adjusted','Paused or ended appropriately','Pushed through without a useful adjustment','Got caught in the mental loop'];
const effectChoices=['Improved','No clear change','Got worse'];
function handlerPick(field,value){syncSummaryFields();nav.session.handlerPerformance=nav.session.handlerPerformance||{};nav.session.handlerPerformance[field]=value;renderSummary()}
function handlerFlag(field){syncSummaryFields();const h=nav.session.handlerPerformance||(nav.session.handlerPerformance={});h[field]=!h[field];renderSummary()}
function handlerSessionPanel(s){const h=s.handlerPerformance||{},choose=(label,field,opts)=>`<div style="margin:13px 0"><b>${label}</b><div class="chiprow" style="margin-top:8px">${opts.map(x=>`<button class="btn small ${h[field]===x?'':'secondary'}" style="margin:3px" onclick="handlerPick('${field}',${JSON.stringify(x).replace(/"/g,'&quot;')})">${esc(x)}</button>`).join('')}</div></div>`;
return `<div class="card" style="border:2px solid #e89bb9;background:linear-gradient(160deg,#fff7fb,#fff)"><div class="kicker">🧠 HANDLER PERFORMANCE · OPTIONAL</div><p class="tiny muted">Your two ratings are separate from Java's coffee and never change her progression.</p>
${choose('☕ Technical handling','technical',handlerLevels)}
${choose('☕ Mental performance','mental',mentalLevels)}
${choose('What triggered pressure?','pressure',pressureChoices)}
${choose('How did I respond?','response',responseChoices)}
${choose('Effect on the session','effect',effectChoices)}
<button class="btn small ${h.innerCritic?'':'secondary'}" onclick="handlerFlag('innerCritic')">${h.innerCritic?'✓ ':''}Inner critic showed up</button>
<button class="btn small ${h.afterLoop?'':'secondary'}" onclick="handlerFlag('afterLoop')">${h.afterLoop?'✓ ':''}Looped afterward</button>
<div style="margin-top:12px"><b>What did I learn or change?</b><textarea id="handlerLearning" style="min-height:90px;width:100%;box-sizing:border-box" placeholder="What I noticed, changed, or will try next…">${esc(h.learning||'')}</textarea></div>
<div style="margin-top:10px"><b>Additional pressure trigger / observation</b><textarea id="handlerCustom" style="min-height:70px;width:100%;box-sizing:border-box" placeholder="Anything else worth tracking…">${esc(h.custom||'')}</textarea></div></div>`}
function handlerTrendPanel(ss){const logged=ss.filter(x=>x.handlerPerformance&&(x.handlerPerformance.technical||x.handlerPerformance.mental));if(!logged.length)return `<div class="card"><div class="kicker">🩷 JAVA + HANDLER TRENDS</div><div class="tiny muted">No handler ratings saved yet. Record them in End Session to compare performance here.</div></div>`;
const num=(v,labels)=>{const n=labels.indexOf(v);return n<0?null:100-n*25};
const javaScore=x=>{const v=String(x.sessionOutcome||x.overallOutcome||x.coffee||'').toLowerCase();return v.includes('beautiful')?100:v.includes('good')||v.includes('solid')?75:v.includes('meh')||v.includes('rough')?50:v.includes('spilled')?25:null};
const series=[{label:'🐕 Java',field:'java',fn:javaScore,color:'#a9587c'},{label:'👤 Technical',field:'technical',fn:x=>num(x.handlerPerformance?.technical,handlerLevels),color:'#ed8ab1'},{label:'🧠 Mental',field:'mental',fn:x=>num(x.handlerPerformance?.mental,mentalLevels),color:'#b77bc2'}];
const recent=logged.slice(-12),bars=series.map(a=>{const vals=logged.map(a.fn).filter(x=>x!==null),avg=vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/vals.length):null;return `<div style="margin:9px 0"><div class="tiny"><b>${a.label}</b> · ${avg===null?'Not rated':avg+'%'} <span class="muted">(${vals.length} sessions)</span></div><div style="height:13px;border-radius:12px;background:#f5dce7;overflow:hidden"><div style="height:100%;width:${avg||0}%;background:${a.color}"></div></div></div>`}).join('');
const columns=recent.map(x=>`<div style="min-width:38px;flex:1;text-align:center"><div style="height:96px;display:flex;gap:3px;align-items:flex-end;justify-content:center">${series.map(a=>{const v=a.fn(x);return `<div title="${a.label}: ${v===null?'Not rated':v+'%'}" style="width:9px;height:${v===null?0:v}%;background:${a.color};border-radius:3px 3px 0 0"></div>`}).join('')}</div><div class="tiny muted">${esc(String(x.savedAt||x.date||'').slice(5,10)||'—')}</div></div>`).join('');
const responses=logged.map(x=>x.handlerPerformance?.response).filter(Boolean),counts=responseChoices.map(x=>({x,n:responses.filter(v=>v===x).length})).filter(x=>x.n);
return `<div class="card" style="border:2px solid #e89bb9;background:#fff8fb"><div class="kicker">🩷 JAVA + HANDLER PERFORMANCE TRENDS</div><div class="tiny muted">${logged.length} handler-rated sessions · Same saved Component history. Ratings shown on a four-level display scale, not a clinical score.</div>${bars}<b class="tiny">SESSION-BY-SESSION COMPARISON</b><div style="display:flex;gap:5px;margin:12px 0">${columns}</div><div class="tiny muted">Java · dark pink | Technical · pink | Mental · lavender</div><div style="margin-top:13px"><b>Pressure responses</b>${counts.length?counts.map(o=>`<div class="tiny" style="margin:7px 0">${esc(o.x)} · ${o.n}/${responses.length}<div style="height:9px;background:#f5dce7;border-radius:9px"><div style="height:9px;width:${Math.round(o.n/responses.length*100)}%;background:#e88bae;border-radius:9px"></div></div></div>`).join(''):'<div class="tiny muted">No pressure responses logged yet.</div>'}</div><div class="tiny muted">Compare associations across sessions; these patterns do not establish causation.</div></div>`}
function renderSummary(){const s=nav.session;if(!s)return;const rec=progressionRecommendation(s),cur=step(s.exerciseId,s.componentId,s.stepId),ps=proposedStep(s),ints=interferenceItems(),curN=stepNumber(s.exerciseId,s.componentId,s.stepId),psN=ps?stepNumber(s.exerciseId,s.componentId,ps.id):curN;document.getElementById('summaryScreen').innerHTML=`<div class="topbar"><button class="exitSessionBtn" onclick="exitSession()">← EXIT</button><div class="grow"><div class="eyebrow">END SESSION</div><div class="title">${esc(s.exerciseName)} — ${esc(s.componentName)}</div><div class="subtitle">Session time · ${esc(s.sessionTime||'')}</div></div></div>${stepSnapshot('YOU TRAINED',cur,s.exerciseId,s.componentId,'summary')}<div class="card"><div class="kicker">SESSION NOTES</div><textarea id="sumNotes" style="min-height:330px;width:100%;box-sizing:border-box" placeholder="Anything you want to remember…">${esc(s.note||'')}</textarea></div><div class="card" style="border:2px solid #d88aa0;background:#fff3f6"><div class="kicker">☕ COFFEE EVALUATION</div><div class="coffeeGrid">${outcomes.map(o=>`<button class="coffee ${sessionCoffee(s)===o[0]?'selected':''}" onclick="setSessionCoffee('${o[0]}')"><span>${o[1]}</span>${o[2]}</button>`).join('')}</div></div><div class="card"><div class="kicker">INTERFERENCES</div><p class="tiny muted">Select any saved interference that affected this session.</p>${ints.length?`<div class="tagGrid">${ints.map(x=>{const id=typeof x==='object'?x.id:interferenceName(x);return `<button class="tag ${(s.interferences||[]).includes(id)?'selected':''}" onclick="toggleInterference('${id}')">${esc(interferenceName(x))}</button>`}).join('')}</div>`:`<div class="empty" style="padding:14px">No interferences saved.</div>`}<button class="btn secondary full" style="margin-top:10px" onclick="openInterferenceManager()">MANAGE INTERFERENCES</button></div><div class="card"><div class="kicker">JAVA — PROGRESS / SETBACK</div><p class="tiny muted">Optional. Pick as many short observations as matter.</p><b>Made Progress On</b>${observationChips('trainingObservations',s.trainingProgress,'trainingProgress')}<div style="height:10px"></div><b>Had a Setback On</b>${observationChips('trainingObservations',s.trainingSetbacks,'trainingSetbacks')}<button class="btn secondary full" style="margin-top:10px" onclick="openObservationManager('trainingObservations')">MANAGE JAVA OBSERVATIONS</button></div><div class="card"><div class="kicker">HANDLER — HELPED / HURT</div><p class="tiny muted">Optional. These are stored with the session handler (${esc(s.handler||'Kerrie')}).</p><b>Helped</b>${observationChips('handlerObservations',s.handlerHelped,'handlerHelped')}<div style="height:10px"></div><b>Hurt</b>${observationChips('handlerObservations',s.handlerHurt,'handlerHurt')}<button class="btn secondary full" style="margin-top:10px" onclick="openObservationManager('handlerObservations')">MANAGE HANDLER OBSERVATIONS</button></div>${handlerSessionPanel(s)}<div class="card" style="border:2px solid #d88aa0"><div class="kicker">FIELDWORK RECOMMENDS</div><h3>${esc(rec.action)}</h3><p>${esc(rec.text)}</p>${stepSnapshot('YOU TRAINED',cur,s.exerciseId,s.componentId,'summary')}<div class="center kicker" style="font-size:14px;margin:12px 0">${esc(rec.direction)}</div>${stepSnapshot('RECOMMENDED NEXT STEP',ps,s.exerciseId,s.componentId,'summary')}</div><div class="card"><div class="kicker">YOU CHOOSE</div><button class="btn full" onclick="acceptProposal()">ACCEPT RECOMMENDATION · STEP ${psN}</button><div class="decisionGrid" style="margin-top:10px"><button class="btn secondary" onclick="saveDecision('Repeat','${cur?.id||s.stepId}')">STAY ON STEP ${curN}</button><button class="btn secondary" onclick="chooseRelativeStep(-1)">GO BACK ONE STEP</button><button class="btn secondary" onclick="chooseDifferentStep()">CHOOSE DIFFERENT STEP</button></div></div>`}
function syncSummaryFields(){if(!nav.session)return;const n=document.getElementById('sumNotes');if(n)nav.session.note=n.value;const h=nav.session.handlerPerformance||(nav.session.handlerPerformance={});const l=document.getElementById('handlerLearning'),c=document.getElementById('handlerCustom');if(l)h.learning=l.value;if(c)h.custom=c.value}
function acceptProposal(){syncSummaryFields();const s=nav.session,ps=proposedStep(s);if(!ps){saveDecision('Repeat');return}saveDecision('FIELDWORK Proposal',ps.id)}
function toggleInterference(id){syncSummaryFields();const a=nav.session.interferences||(nav.session.interferences=[]),i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);renderSummary()}
function chooseRelativeStep(offset){syncSummaryFields();const s=nav.session,c=component(s.exerciseId,s.componentId),idx=c.steps.findIndex(x=>x.id===s.stepId),ni=Math.max(0,Math.min(c.steps.length-1,idx+offset)),target=c.steps[ni];if(target)saveDecision(offset<0?'Step Back':'Advance',target.id)}
function saveDecision(decision,chosenStepId=null){syncSummaryFields();const s=nav.session;if(!sessionCoffee(s)){alert('Choose one overall Session Coffee result before saving.');return}const c=component(s.exerciseId,s.componentId),idx=c.steps.findIndex(x=>x.id===s.stepId);let next=s.stepId;if(chosenStepId)next=chosenStepId;else if(decision==='Advance'&&idx<c.steps.length-1)next=c.steps[idx+1].id;else if(decision==='Step Back'&&idx>0)next=c.steps[idx-1].id;const historical=!!s.sessionDate&&s.sessionDate<localDateKey();if(!historical)c.currentStepId=next;s.historicalEntry=historical;s.decision=decision;s.resultingStepId=next;s.savedAt=new Date().toISOString();state.sessions.push({...s});if(!historical)state.todayItems=(state.todayItems||[]).filter(x=>!(x.exerciseId===s.exerciseId&&x.componentId===s.componentId));save();nav.session=null;nav.training=null;show('homeScreen');toast(`Saved. ${c.name} history + coverage updated.`)}
function chooseDifferentStep(){syncSummaryFields();const s=nav.session,c=component(s.exerciseId,s.componentId);sheet(`<h2>Choose ${esc(c.name)} step</h2>${c.steps.map((x,i)=>`<div class="listrow ${c.currentStepId===x.id?'current':''}" style="align-items:flex-start"><div class="num">${i+1}</div><div class="grow"><b>${esc(x.name)}</b><div class="tiny muted" style="margin-top:5px"><b>Today’s Job:</b> ${esc(stepJob(x))}</div><button class="linkish tiny" style="margin-top:7px" onclick="openStepDetails('${s.exerciseId}','${s.componentId}','${x.id}','summary')">DETAILS ›</button></div><button class="btn small" onclick="closeSheet();saveDecision('Choose Different Step','${x.id}')">CHOOSE</button></div>`).join('')}`)}
function sheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeSheet(){document.getElementById('modal').classList.remove('show')}
function val(id){return document.getElementById(id)?.value.trim()||''}
function exportBackup(){state.settings.lastBackupAt=new Date().toISOString();save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`FIELDWORK-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function toast(msg){const d=document.createElement('div');d.textContent=msg;Object.assign(d.style,{position:'fixed',left:'50%',bottom:'92px',transform:'translateX(-50%)',background:'#234d38',color:'#fffaf0',padding:'10px 14px',borderRadius:'999px',fontWeight:'900',fontSize:'12px',zIndex:99});document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>show(b.dataset.screen));
document.getElementById('builderScreen').addEventListener('click',e=>{const g=e.target.closest('.js-open-goal');if(g){openGoal(g.dataset.goalId);return}const ex=e.target.closest('.js-open-exercise');if(ex){openExercise(ex.dataset.exerciseId);return}const c=e.target.closest('.js-open-component');if(c){openComponent(c.dataset.componentId);return}});
document.getElementById('photoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.dog.photo=r.result;save();renderHome()};r.readAsDataURL(f)});
document.getElementById('restoreInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);if(!raw.version||!Array.isArray(raw.goals))throw 0;const x=migrate(raw);const gc=x.goals.length,ec=x.exercises.length,cc=x.exercises.reduce((n,e)=>n+e.components.length,0),sc=x.exercises.reduce((n,e)=>n+e.components.reduce((m,c)=>m+c.steps.length,0),0);if(!confirm(`Restore this backup?\n\n${gc} goals · ${ec} exercises · ${cc} components · ${sc} steps\n\nCurrent data will first be preserved as an emergency recovery copy.`))return;localStorage.setItem(RECOVERY_KEY,JSON.stringify(state));state=x;save();render();show('homeScreen');toast('Backup restored and migrated ✓')}catch(_){alert('That does not look like a FIELDWORK backup.')}finally{e.target.value=''}};r.readAsText(f)});
render();
</script>
