<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b100d" />
<title>FIELDWORK</title>
<style>
:root{--bg:#0a0f0c;--panel:#121b17;--panel2:#18231e;--line:#2b3a31;--lime:#c9f25b;--olive:#8fa84b;--cream:#f2ead8;--tan:#c8b894;--orange:#f29a54;--coral:#ef725e;--purple:#9a7aa5;--muted:#9eaa9f;--danger:#e56f61;--shadow:0 12px 30px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;background:#050806;color:var(--cream);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.app{max-width:520px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#0c1410,#08100c);position:relative;padding-bottom:92px}.screen{display:none;padding:18px 16px 24px}.screen.active{display:block}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:800}.title{font-size:27px;font-weight:900;letter-spacing:-.03em}.subtitle{color:var(--muted);font-size:13px;line-height:1.4}.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:900;background:var(--lime);color:#10150f;cursor:pointer;box-shadow:none}.btn.secondary{background:#202d26;color:var(--cream);border:1px solid #34483c}.btn.ghost{background:transparent;color:var(--cream);border:1px solid #3a4b40}.btn.danger{background:#3a1e1b;color:#ffd8d2;border:1px solid #70423b}.btn.small{padding:8px 10px;border-radius:9px;font-size:12px}.btn.full{width:100%;font-size:15px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1}.muted{color:var(--muted)}.lime{color:var(--lime)}.orange{color:var(--orange)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;background:#202c26;border:1px solid #34483c;color:var(--tan);font-size:11px;font-weight:800}.hero{position:relative;overflow:hidden;min-height:178px;padding:0}.hero img{width:100%;height:210px;object-fit:cover;display:block}.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,10,7,.93) 0%,rgba(6,10,7,.62) 52%,rgba(6,10,7,.12) 100%)}.hero .heroText{position:absolute;left:16px;top:18px;right:16px}.hero h1{margin:2px 0 0;font-size:34px;letter-spacing:-.04em}.hero .goal{margin-top:8px;color:#d7dfd5}.progress{height:9px;background:#26322b;border-radius:99px;overflow:hidden;margin-top:16px;width:55%}.progress i{display:block;height:100%;width:42%;background:var(--lime);border-radius:99px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin:20px 2px 10px}.sectionHead h2{margin:0;font-size:14px;letter-spacing:.08em;text-transform:uppercase}.work{display:flex;align-items:center;gap:12px}.workIcon{width:43px;height:43px;border-radius:13px;background:#243028;display:grid;place-items:center;font-size:22px}.work h3{font-size:15px;margin:0 0 4px}.work p{font-size:12px;color:var(--muted);margin:0}.work .train{margin-left:auto}.empty{text-align:center;padding:28px 16px;color:var(--muted)}.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(8,14,10,.97);border-top:1px solid #28372e;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:30;backdrop-filter:blur(14px)}.navbtn{border:0;background:transparent;color:#9aa59d;font-size:10px;font-weight:800;padding:5px 0}.navbtn b{display:block;font-size:20px;margin-bottom:2px}.navbtn.active{color:var(--lime)}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--tan);margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#0d1511;border:1px solid #33443a;border-radius:11px;padding:12px;color:var(--cream);font:inherit;outline:none}.field textarea{min-height:86px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--lime)}.stack{display:grid;gap:10px}.crumb{font-size:12px;color:var(--tan);margin-bottom:8px}.listrow{display:flex;align-items:center;gap:10px;background:#111a16;border:1px solid #2b3b31;border-radius:12px;padding:12px;margin-bottom:8px}.listrow.current{border-color:var(--lime);box-shadow:inset 3px 0 0 var(--lime)}.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:#17200f;font-weight:900;flex:0 0 auto}.icon{font-size:22px}.coffeeGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}.coffee{border:1px solid #34483c;background:#111a16;border-radius:12px;padding:10px 4px;color:var(--cream);text-align:center;font-size:10px;font-weight:800}.coffee span{display:block;font-size:24px;margin-bottom:5px}.coffee.selected{border-color:var(--lime);background:#25331f;color:var(--lime)}.tagGrid{display:flex;flex-wrap:wrap;gap:7px}.tag{border:1px solid #394a40;background:#121b17;color:#cbd4cc;border-radius:999px;padding:8px 10px;font-size:11px}.tag.selected{background:#343d24;border-color:var(--lime);color:var(--lime)}.decisionGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.statline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #28372e;font-size:13px}.notice{border-left:3px solid var(--orange);background:#241d15;padding:11px 12px;border-radius:8px;color:#ead9c7;font-size:12px;line-height:1.45}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(520px,100%);max-height:90vh;overflow:auto;background:#111a16;border:1px solid #314239;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 60px rgba(0,0,0,.4)}.sheet h2{margin:0 0 6px}.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.builderHeader{padding:13px;border-radius:13px;background:#171f1a;border:1px solid #304137;margin-bottom:10px}.builderHeader strong{display:block}.tiny{font-size:11px}.hidden{display:none!important}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg button.active{background:var(--lime);color:#10150f}.repCount{font-size:28px;font-weight:900;text-align:center;margin:16px 0 4px}.center{text-align:center}.outcomeBar{display:flex;gap:7px;flex-wrap:wrap}.outcomeChip{font-size:11px;padding:6px 8px;border-radius:999px;background:#202d26}.photoHint{position:absolute;right:10px;bottom:10px}.linkish{color:var(--lime);background:none;border:0;padding:0;font:inherit;font-weight:800;cursor:pointer}.hr{height:1px;background:#2a382f;margin:14px 0}.kicker{font-size:12px;color:var(--tan);font-weight:800}.bigCriterion{font-size:18px;line-height:1.35;margin:8px 0 14px}.sessionContext{padding:12px;border:1px solid #3a4a40;border-radius:12px;background:#0d1511;margin-bottom:12px}.sessionContext strong{display:block;font-size:17px}.safe{padding:10px 12px;border-radius:10px;background:#172518;color:#cfe6bc;font-size:12px;border:1px solid #345037}.backupRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footerNote{font-size:11px;color:#7f8c83;text-align:center;margin:18px 0}.moveBtns{margin-left:auto;display:flex;gap:4px}.moveBtns button{padding:5px 7px}.dangerText{color:#ff9a8f}@media(min-width:700px){body{padding:24px}.app{border:1px solid #2a382f;border-radius:28px;overflow:hidden;min-height:calc(100vh - 48px)}.bottomnav{bottom:24px;border-radius:0 0 28px 28px}}
</style>
</head>
<body>
<div class="app" id="app">
  <main>
    <section class="screen active" id="homeScreen"></section>
    <section class="screen" id="trainScreen"></section>
    <section class="screen" id="planScreen"></section>
    <section class="screen" id="progressScreen"></section>
    <section class="screen" id="moreScreen"></section>
    <section class="screen" id="builderScreen"></section>
    <section class="screen" id="setupScreen"></section>
    <section class="screen" id="liveScreen"></section>
    <section class="screen" id="summaryScreen"></section>
  </main>
  <nav class="bottomnav" id="bottomNav">
    <button class="navbtn active" data-screen="homeScreen"><b>⌂</b>Home</button>
    <button class="navbtn" data-screen="trainScreen"><b>⚡</b>Train</button>
    <button class="navbtn" data-screen="planScreen"><b>▣</b>Plan</button>
    <button class="navbtn" data-screen="progressScreen"><b>▥</b>Progress</button>
    <button class="navbtn" data-screen="moreScreen"><b>•••</b>More</button>
  </nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<input type="file" accept="image/*" id="photoInput" class="hidden" />
<input type="file" accept="application/json,.json" id="restoreInput" class="hidden" />
<script>
const STORAGE_KEY='fieldwork_v1_state';
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const freshState=()=>({version:1,dog:null,goals:[],sessions:[],settings:{locations:['Club Field','Backyard','Home'],reinforcers:['Toy','Food','Both','None'],rewardPositions:['Toe Position — Cameron R1'],handlerStates:['Playful','Neutral','Focused']}});
let state=load();
let nav={screen:'homeScreen',builder:{level:'root',goalId:null,exerciseId:null,componentId:null},training:null,session:null};
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));return x&&x.version?x:freshState()}catch(e){return freshState()}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');nav.screen=id;document.getElementById('bottomNav').classList.toggle('hidden',['builderScreen','setupScreen','liveScreen','summaryScreen'].includes(id));document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));render();window.scrollTo(0,0)}
function goal(id){return state.goals.find(x=>x.id===id)}
function exercise(gid,eid){return goal(gid)?.exercises.find(x=>x.id===eid)}
function component(gid,eid,cid){return exercise(gid,eid)?.components.find(x=>x.id===cid)}
function step(gid,eid,cid,sid){return component(gid,eid,cid)?.steps.find(x=>x.id===sid)}
function activeWork(){const rows=[];state.goals.filter(g=>g.active!==false).forEach(g=>g.exercises.forEach(e=>e.components.forEach(c=>{if(c.currentStepId){const s=c.steps.find(z=>z.id===c.currentStepId);if(s)rows.push({g,e,c,s})}})));return rows}
function render(){renderHome();renderTrain();renderPlan();renderProgress();renderMore();if(nav.screen==='builderScreen')renderBuilder();if(nav.screen==='setupScreen')renderSetup();if(nav.screen==='liveScreen')renderLive();if(nav.screen==='summaryScreen')renderSummary()}
function renderHome(){const el=document.getElementById('homeScreen');if(!state.dog){el.innerHTML=`<div class="topbar"><div><div class="eyebrow">FIELDWORK</div><div class="title">Build once. Train from it.</div></div></div><div class="card"><div class="icon">🐕</div><h2>Create your dog</h2><p class="muted">Phase 1 starts with one dog and a curriculum that persists on this phone.</p><button class="btn full" onclick="openDog()">CREATE DOG</button></div><div class="notice">Acceptance target: create separate Emotion and Precision progressions, train Precision, save a decision, close/reopen, and confirm both components kept their own independent current steps.</div>`;return}
const work=activeWork();const activeGoal=state.goals.find(g=>g.active!==false);
el.innerHTML=`<div class="card hero">${state.dog.photo?`<img src="${state.dog.photo}" alt="${esc(state.dog.name)}">`:`<div style="height:210px;background:radial-gradient(circle at 75% 35%,#445336,#172219 45%,#0d140f);display:grid;place-items:center;font-size:88px">🐕</div>`}<div class="shade"></div><div class="heroText"><div class="eyebrow">FIELDWORK</div><h1>${esc(state.dog.name)}</h1><div class="goal">${activeGoal?`Active Goal: <b>${esc(activeGoal.name)}</b>`:'No active goal yet'}</div><div class="progress"><i></i></div></div><button class="btn small secondary photoHint" onclick="document.getElementById('photoInput').click()">${state.dog.photo?'Change photo':'Add photo'}</button></div>
<div class="sectionHead"><h2>Current / Next Work</h2><button class="linkish" onclick="show('builderScreen');nav.builder={level:'root',goalId:null,exerciseId:null,componentId:null};renderBuilder()">Build</button></div>
${work.length?work.map(w=>workCard(w)).join(''):`<div class="card empty">No current progression steps yet.<br><br><button class="btn" onclick="show('builderScreen')">BUILD CURRICULUM</button></div>`}
<button class="btn secondary full" onclick="show('trainScreen')">CHOOSE OTHER WORK</button>`}
function workCard(w){return `<div class="card work"><div class="workIcon">${w.e.icon||'🐕'}</div><div class="grow"><div class="kicker">${esc(w.e.name).toUpperCase()}</div><h3>${esc(w.c.name)} → ${esc(w.s.name)}</h3><p>${esc(w.s.criterion||'No criterion entered')}</p></div><button class="btn small train" onclick="beginTraining('${w.g.id}','${w.e.id}','${w.c.id}','${w.s.id}')">TRAIN</button></div>`}
function renderTrain(){const el=document.getElementById('trainScreen');const work=activeWork();el.innerHTML=`<div class="topbar"><div><div class="eyebrow">TRAIN</div><div class="title">Choose existing work</div><div class="subtitle">Build creates. Train references.</div></div></div>${work.length?work.map(w=>workCard(w)).join(''):`<div class="card empty">Build a curriculum first.</div>`}<div class="sectionHead"><h2>Browse curriculum</h2></div>${state.goals.map(g=>`<div class="card"><b>${esc(g.name)}</b>${g.exercises.map(e=>`<div class="hr"></div><div class="kicker">${esc(e.name)}</div>${e.components.map(c=>`<div class="listrow"><div class="grow"><b>${esc(c.name)}</b><div class="tiny muted">${c.steps.length} steps</div></div>${c.steps.length?`<button class="btn small secondary" onclick="pickStepForTrain('${g.id}','${e.id}','${c.id}')">Choose step</button>`:''}</div>`).join('')}`).join('')}</div>`).join('')}`}
function renderPlan(){document.getElementById('planScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">PLAN</div><div class="title">Weekly planning</div></div></div><div class="card empty"><div style="font-size:38px">📅</div><h3>Phase 3</h3><p>Deliberately not built yet. First the curriculum → train → save → reopen loop has to be bulletproof.</p></div>`}
function renderProgress(){const recent=[...state.sessions].reverse().slice(0,8);document.getElementById('progressScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">PROGRESS</div><div class="title">Saved training</div><div class="subtitle">Phase 1 proof that sessions and component state persist.</div></div></div><div class="card"><div class="statline"><span>Saved sessions</span><b>${state.sessions.length}</b></div><div class="statline"><span>Active component progressions</span><b>${activeWork().length}</b></div></div>${recent.map(s=>`<div class="card"><div class="kicker">${new Date(s.savedAt).toLocaleDateString()}</div><b>${esc(s.goalName)} → ${esc(s.exerciseName)} → ${esc(s.componentName)}</b><div class="muted tiny" style="margin-top:5px">${esc(s.stepName)} · ${esc(s.decision)}</div></div>`).join('')||'<div class="empty">No sessions saved yet.</div>'}`}
function renderMore(){document.getElementById('moreScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">MORE</div><div class="title">FIELDWORK</div></div></div><div class="card"><h3 style="margin-top:0">Task Analysis / Curriculum</h3><p class="muted">Create goals, exercises, independent components, and each component’s own progression.</p><button class="btn full" onclick="nav.builder={level:'root',goalId:null,exerciseId:null,componentId:null};show('builderScreen')">OPEN CURRICULUM BUILDER</button></div><div class="card"><h3 style="margin-top:0">Data safety</h3><p class="muted">V1 saves locally on this device/browser. Export a JSON backup before clearing browser data or moving devices.</p><div class="backupRow"><button class="btn secondary" onclick="exportBackup()">EXPORT BACKUP</button><button class="btn secondary" onclick="document.getElementById('restoreInput').click()">RESTORE BACKUP</button></div></div><div class="footerNote">FIELDWORK Phase 1 · local-first prototype</div>`}
function renderBuilder(){const el=document.getElementById('builderScreen');let html=`<div class="topbar"><button class="btn small ghost" onclick="builderBack()">‹ Back</button><div class="grow"><div class="eyebrow">TASK ANALYSIS</div><div class="title" style="font-size:22px">Curriculum Builder</div></div></div>`;
if(nav.builder.level==='root'){html+=`<div class="builderHeader"><strong>${esc(state.dog?.name||'Dog')}’s Curriculum</strong><span class="tiny muted">Goals contain exercises. Exercises contain independent components.</span></div>${state.goals.map(g=>`<div class="listrow"><div class="grow"><b>${esc(g.name)}</b><div class="tiny muted">${g.exercises.length} exercises</div></div><button type="button" class="btn small secondary js-open-goal" data-goal-id="${g.id}">OPEN</button></div>`).join('')}<button class="btn full" onclick="openGoalForm()">+ ADD GOAL</button>`}
if(nav.builder.level==='goal'){const g=goal(nav.builder.goalId);html+=`<div class="crumb">${esc(state.dog.name)} → ${esc(g.name)}</div><div class="card"><div class="kicker">FINISHED PICTURE</div><div>${esc(g.finishedPicture||'Not entered yet')}</div><div class="hr"></div><div class="kicker">GOAL / TRIAL CRITERIA</div><div>${esc(g.criteria||'Not entered yet')}</div><div class="hr"></div><button class="btn small secondary" onclick="openGoalForm('${g.id}')">EDIT GOAL</button></div><div class="sectionHead"><h2>Exercises</h2></div>${g.exercises.map(e=>`<div class="listrow"><div class="icon">${e.icon||'🐕'}</div><div class="grow"><b>${esc(e.name)}</b><div class="tiny muted">${e.components.length} components</div></div><button type="button" class="btn small secondary js-open-exercise" data-exercise-id="${e.id}">OPEN</button></div>`).join('')}<button class="btn full" onclick="openExerciseForm()">+ ADD EXERCISE</button>`}
if(nav.builder.level==='exercise'){const g=goal(nav.builder.goalId),e=exercise(g.id,nav.builder.exerciseId);html+=`<div class="crumb">${esc(g.name)} → ${esc(e.name)}</div><div class="card"><div class="kicker">FINISHED PICTURE</div><div>${esc(e.finishedPicture||'Not entered yet')}</div><div class="hr"></div><div class="kicker">CRITERIA</div><div>${esc(e.criteria||'Not entered yet')}</div><div class="hr"></div><button class="btn small secondary" onclick="openExerciseForm('${e.id}')">EDIT EXERCISE</button></div><div class="sectionHead"><h2>Independent Components</h2></div>${e.components.map(c=>{const s=c.steps.find(x=>x.id===c.currentStepId);return `<div class="listrow ${s?'current':''}"><div class="icon">${c.icon||'🎯'}</div><div class="grow"><b>${esc(c.name)}</b><div class="tiny muted">${c.steps.length} steps${s?` · Current: ${esc(s.name)}`:''}</div></div><button type="button" class="btn small secondary js-open-component" data-component-id="${c.id}">OPEN</button></div>`}).join('')}<button class="btn full" onclick="openComponentForm()">+ ADD COMPONENT</button>`}
if(nav.builder.level==='component'){const g=goal(nav.builder.goalId),e=exercise(g.id,nav.builder.exerciseId),c=component(g.id,e.id,nav.builder.componentId);html+=`<div class="crumb">${esc(g.name)} → ${esc(e.name)} → ${esc(c.name)}</div><div class="card"><div class="kicker">WHAT DOES FINISHED ${esc(c.name).toUpperCase()} LOOK LIKE?</div><div>${esc(c.finishedPicture||'Not entered yet')}</div><div class="hr"></div><button class="btn small secondary" onclick="openComponentForm('${c.id}')">EDIT COMPONENT</button></div><div class="sectionHead"><h2>Progression</h2><span class="tiny muted">No drag</span></div>${c.steps.map((s,i)=>`<div class="listrow ${c.currentStepId===s.id?'current':''}"><div class="num">${i+1}</div><div class="grow"><b>${esc(s.name)}</b><div class="tiny muted">${esc(s.criterion||'No criterion')}</div></div><div class="moveBtns"><button class="btn small ghost" onclick="moveStep('${s.id}',-1)">↑</button><button class="btn small ghost" onclick="moveStep('${s.id}',1)">↓</button><button class="btn small secondary" onclick="openStepForm('${s.id}')">•••</button></div></div>`).join('')}<button class="btn full" onclick="openStepForm()">+ ADD STEP</button>`}
el.innerHTML=html}
function builderBack(){if(nav.builder.level==='root')show('moreScreen');else if(nav.builder.level==='goal'){nav.builder.level='root';renderBuilder()}else if(nav.builder.level==='exercise'){nav.builder.level='goal';renderBuilder()}else{nav.builder.level='exercise';renderBuilder()}}
function openGoal(id){nav.builder={level:'goal',goalId:id,exerciseId:null,componentId:null};renderBuilder()}function openExercise(id){nav.builder.level='exercise';nav.builder.exerciseId=id;nav.builder.componentId=null;renderBuilder()}function openComponent(id){nav.builder.level='component';nav.builder.componentId=id;renderBuilder()}
function openDog(){sheet(`<h2>Create dog</h2><div class="field"><label>Name</label><input id="dogName" value="Java"></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveDog()">Save</button></div>`)}
function saveDog(){const n=document.getElementById('dogName').value.trim();if(!n)return;state.dog={id:uid(),name:n,photo:null};save();closeSheet();render()}
function openGoalForm(id){const g=id?goal(id):null;sheet(`<h2>${g?'Edit':'Add'} goal</h2><div class="field"><label>Goal name</label><input id="fName" value="${esc(g?.name||'BH')}"></div><div class="field"><label>Finished Picture</label><textarea id="fPic">${esc(g?.finishedPicture||'')}</textarea></div><div class="field"><label>Goal / Trial Criteria</label><textarea id="fCrit">${esc(g?.criteria||'')}</textarea></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveGoal('${id||''}')">Save</button></div>`)}
function saveGoal(id){const obj={id:id||uid(),name:val('fName'),finishedPicture:val('fPic'),criteria:val('fCrit'),active:true,exercises:id?goal(id).exercises:[]};if(id)state.goals[state.goals.findIndex(x=>x.id===id)]=obj;else state.goals.push(obj);save();closeSheet();nav.builder={level:'goal',goalId:obj.id,exerciseId:null,componentId:null};renderBuilder();renderHome()}
function openExerciseForm(id){const g=goal(nav.builder.goalId),e=id?exercise(g.id,id):null;sheet(`<h2>${e?'Edit':'Add'} exercise</h2><div class="field"><label>Exercise name</label><input id="fName" value="${esc(e?.name||'Heeling')}"></div><div class="field"><label>Finished Picture</label><textarea id="fPic">${esc(e?.finishedPicture||'')}</textarea></div><div class="field"><label>Criteria</label><textarea id="fCrit">${esc(e?.criteria||'')}</textarea></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveExercise('${id||''}')">Save</button></div>`)}
function saveExercise(id){const g=goal(nav.builder.goalId),old=id?exercise(g.id,id):null,obj={id:id||uid(),name:val('fName'),icon:'🐕',finishedPicture:val('fPic'),criteria:val('fCrit'),components:old?.components||[]};if(id)g.exercises[g.exercises.findIndex(x=>x.id===id)]=obj;else g.exercises.push(obj);save();closeSheet();nav.builder.level='exercise';nav.builder.exerciseId=obj.id;renderBuilder();renderHome()}
function openComponentForm(id){const g=goal(nav.builder.goalId),e=exercise(g.id,nav.builder.exerciseId),c=id?component(g.id,e.id,id):null;sheet(`<h2>${c?'Edit':'Add'} component</h2><div class="field"><label>Component / Dimension name</label><input id="fName" value="${esc(c?.name||'Precision')}"></div><div class="field"><label>What does finished ${esc(c?.name||'this component')} look like?</label><textarea id="fPic">${esc(c?.finishedPicture||'')}</textarea></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveComponent('${id||''}')">Save</button></div>`)}
function saveComponent(id){const g=goal(nav.builder.goalId),e=exercise(g.id,nav.builder.exerciseId),old=id?component(g.id,e.id,id):null,obj={id:id||uid(),name:val('fName'),icon:old?.icon||'🎯',finishedPicture:val('fPic'),steps:old?.steps||[],currentStepId:old?.currentStepId||null};if(id)e.components[e.components.findIndex(x=>x.id===id)]=obj;else e.components.push(obj);save();closeSheet();nav.builder.level='component';nav.builder.componentId=obj.id;renderBuilder();renderHome()}
function openStepForm(id){const c=component(nav.builder.goalId,nav.builder.exerciseId,nav.builder.componentId),s=id?c.steps.find(x=>x.id===id):null;sheet(`<h2>${s?'Edit':'Add'} progression step</h2><div class="field"><label>Step name</label><input id="fName" value="${esc(s?.name||`Step ${c.steps.length+1}`)}"></div><div class="field"><label>Description</label><textarea id="fDesc">${esc(s?.description||'')}</textarea></div><div class="field"><label>Criterion for success</label><textarea id="fCrit">${esc(s?.criterion||'')}</textarea></div><div class="field"><label>Optional training tool / note</label><textarea id="fTool" style="min-height:120px">${esc(s?.tool||'')}</textarea></div><div class="field"><label>Progression / outcome rule</label><textarea id="fRule" style="min-height:140px">${esc(s?.rule||'')}</textarea></div>${s?`<div class="safe">${c.currentStepId===s.id?'This is the CURRENT step.':'This step is not current.'}</div>`:''}<div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveStep('${id||''}')">Save</button></div>${s?`<div class="hr"></div><div class="stack"><button class="btn secondary full" onclick="setCurrent('${s.id}')">SET CURRENT</button><button class="btn danger full" onclick="deleteStep('${s.id}')">DELETE STEP</button></div>`:''}`)}
function saveStep(id){const c=component(nav.builder.goalId,nav.builder.exerciseId,nav.builder.componentId),old=id?c.steps.find(x=>x.id===id):null,obj={id:id||uid(),name:val('fName'),description:val('fDesc'),criterion:val('fCrit'),tool:val('fTool'),rule:val('fRule')};if(id)c.steps[c.steps.findIndex(x=>x.id===id)]=obj;else{c.steps.push(obj);if(!c.currentStepId)c.currentStepId=obj.id}save();closeSheet();renderBuilder();renderHome()}
function setCurrent(id){const c=component(nav.builder.goalId,nav.builder.exerciseId,nav.builder.componentId);c.currentStepId=id;save();closeSheet();renderBuilder();renderHome()}
function deleteStep(id){const c=component(nav.builder.goalId,nav.builder.exerciseId,nav.builder.componentId);if(!confirm('Delete this progression step?'))return;c.steps=c.steps.filter(x=>x.id!==id);if(c.currentStepId===id)c.currentStepId=c.steps[0]?.id||null;save();closeSheet();renderBuilder();renderHome()}
function moveStep(id,d){const c=component(nav.builder.goalId,nav.builder.exerciseId,nav.builder.componentId),i=c.steps.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=c.steps.length)return;[c.steps[i],c.steps[j]]=[c.steps[j],c.steps[i]];save();renderBuilder()}
function beginTraining(gid,eid,cid,sid){nav.training={gid,eid,cid,sid};nav.session=null;show('setupScreen')}
function pickStepForTrain(gid,eid,cid){const c=component(gid,eid,cid);sheet(`<h2>${esc(c.name)}</h2><p class="muted">Choose an existing progression step.</p>${c.steps.map((s,i)=>`<div class="listrow ${c.currentStepId===s.id?'current':''}"><div class="num">${i+1}</div><div class="grow"><b>${esc(s.name)}</b><div class="tiny muted">${esc(s.criterion||'')}</div></div><button class="btn small" onclick="closeSheet();beginTraining('${gid}','${eid}','${cid}','${s.id}')">TRAIN</button></div>`).join('')}`)}
function renderSetup(){if(!nav.training)return;const {gid,eid,cid,sid}=nav.training,g=goal(gid),e=exercise(gid,eid),c=component(gid,eid,cid),s=step(gid,eid,cid,sid),st=state.settings;document.getElementById('setupScreen').innerHTML=`<div class="topbar"><button class="btn small ghost" onclick="show('homeScreen')">‹ Back</button><div class="grow"><div class="eyebrow">SESSION SETUP</div><div class="title" style="font-size:21px">${esc(e.name)} — ${esc(c.name)}</div><div class="subtitle">${esc(s.name)}</div></div></div><div class="sessionContext"><span class="tiny muted">REFERENCING EXISTING CURRICULUM</span><strong>${esc(g.name)} → ${esc(e.name)} → ${esc(c.name)}</strong><div class="lime tiny">${esc(s.name)}</div></div>${selectField('Location','setupLocation',st.locations)}${selectField('Reinforcer','setupReinforcer',st.reinforcers)}${selectField('Reward Position','setupReward',st.rewardPositions,true)}${selectField('Handler State','setupHandler',st.handlerStates)}<div class="field"><label>Recording Mode</label><div class="seg"><button class="btn" id="modeRep" onclick="setMode('rep')">Rep by Rep</button><button class="btn secondary" id="modeOverview" onclick="setMode('overview')">Session Overview</button></div></div><button class="btn full" onclick="startSession()">START TRAINING</button>`;nav.recordingMode=nav.recordingMode||'rep'}
function selectField(label,id,arr,manage=false){return `<div class="field"><label>${label}${manage?` <button class="linkish" onclick="manageRewardPositions()">Manage</button>`:''}</label><select id="${id}">${arr.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`}
function setMode(m){nav.recordingMode=m;document.getElementById('modeRep').className='btn '+(m==='rep'?'':'secondary');document.getElementById('modeOverview').className='btn '+(m==='overview'?'':'secondary')}
function manageRewardPositions(){sheet(`<h2>Reward Positions</h2><p class="muted">Use your own terminology.</p>${state.settings.rewardPositions.map((x,i)=>`<div class="listrow"><div class="grow">${esc(x)}</div><button class="btn small danger" onclick="removeReward(${i})">Delete</button></div>`).join('')}<div class="field"><label>New named position</label><input id="newReward" placeholder="e.g. Toe Position — Cameron R1"></div><button class="btn full" onclick="addReward()">ADD POSITION</button>`)}
function addReward(){const x=val('newReward');if(!x)return;state.settings.rewardPositions.push(x);save();closeSheet();renderSetup()}function removeReward(i){state.settings.rewardPositions.splice(i,1);save();manageRewardPositions()}
function startSession(){const t=nav.training,g=goal(t.gid),e=exercise(t.gid,t.eid),c=component(t.gid,t.eid,t.cid),s=step(t.gid,t.eid,t.cid,t.sid);nav.session={id:uid(),startedAt:new Date().toISOString(),goalId:g.id,goalName:g.name,exerciseId:e.id,exerciseName:e.name,componentId:c.id,componentName:c.name,stepId:s.id,stepName:s.name,criterion:s.criterion,location:val('setupLocation'),reinforcer:val('setupReinforcer'),rewardPosition:val('setupReward'),handlerState:val('setupHandler'),mode:nav.recordingMode||'rep',reps:[],overviewOutcome:null,tags:[],note:'',good:'',bad:'',weird:'',limiters:[],decision:null};show('liveScreen')}
const outcomes=[['beautiful','⭐','Beautiful'],['solid','☕','Full / Solid'],['productive','☕','Productive'],['rough','☕','Rough'],['spilled','🫗','Spilled']];
function renderLive(){const s=nav.session;if(!s)return;const repN=s.reps.length+1;document.getElementById('liveScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">TRAINING SESSION</div><div class="title" style="font-size:22px">${esc(s.exerciseName)} — ${esc(s.componentName)}</div><div class="subtitle">${esc(s.stepName)}</div></div><button class="btn small ghost" onclick="endSession()">End</button></div><div class="card"><div class="kicker">TODAY'S CRITERION</div><div class="bigCriterion">${esc(s.criterion||'No criterion entered')}</div><details><summary class="linkish">VIEW FINISHED PICTURE / CRITERIA</summary><div class="hr"></div><div class="tiny muted">Component finished picture</div><div>${esc(component(s.goalId,s.exerciseId,s.componentId).finishedPicture||'Not entered')}</div></details></div><div class="seg"><button class="btn ${s.mode==='rep'?'':'secondary'}" onclick="switchLiveMode('rep')">Rep by Rep</button><button class="btn ${s.mode==='overview'?'':'secondary'}" onclick="switchLiveMode('overview')">Session Overview</button></div>${s.mode==='rep'?repUI(s,repN):overviewUI(s)}<button class="btn secondary full" style="margin-top:12px" onclick="endSession()">END SESSION</button>`}
function repUI(s,n){return `<div class="repCount">Rep ${n}</div><div class="center muted tiny">Tap one coffee outcome</div><div class="coffeeGrid">${outcomes.map(o=>`<button class="coffee" onclick="recordRep('${o[0]}')"><span>${o[1]}</span>${o[2]}</button>`).join('')}</div><div class="field"><label>Optional quick note</label><input id="repNote" placeholder="Short note…"></div>${s.reps.length?`<div class="card"><div class="kicker">RECORDED</div><div class="outcomeBar">${s.reps.map((r,i)=>`<span class="outcomeChip">${i+1}. ${labelOutcome(r.outcome)}</span>`).join('')}</div></div>`:''}`}
function overviewUI(s){return `<div class="sectionHead"><h2>Overall outcome</h2></div><div class="coffeeGrid">${outcomes.map(o=>`<button class="coffee ${s.overviewOutcome===o[0]?'selected':''}" onclick="setOverview('${o[0]}')"><span>${o[1]}</span>${o[2]}</button>`).join('')}</div><div class="field"><label>Optional session note</label><textarea id="overviewNote" oninput="nav.session.note=this.value">${esc(s.note)}</textarea></div>`}
function recordRep(outcome){const note=document.getElementById('repNote')?.value||'';nav.session.reps.push({id:uid(),outcome,note,at:new Date().toISOString()});renderLive()}function setOverview(o){nav.session.overviewOutcome=o;renderLive()}function switchLiveMode(m){nav.session.mode=m;renderLive()}function labelOutcome(x){return outcomes.find(o=>o[0]===x)?.[2]||x}
function endSession(){if(nav.session.mode==='overview'){const n=document.getElementById('overviewNote');if(n)nav.session.note=n.value}show('summaryScreen')}
function renderSummary(){const s=nav.session;if(!s)return;const dist={};s.reps.forEach(r=>dist[r.outcome]=(dist[r.outcome]||0)+1);document.getElementById('summaryScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">SESSION SUMMARY</div><div class="title" style="font-size:22px">${esc(s.exerciseName)} — ${esc(s.componentName)}</div><div class="subtitle">${esc(s.stepName)}</div></div></div><div class="card"><div class="statline"><span>Location</span><b>${esc(s.location)}</b></div><div class="statline"><span>Reinforcer</span><b>${esc(s.reinforcer)}</b></div><div class="statline"><span>Reward Position</span><b>${esc(s.rewardPosition)}</b></div><div class="statline"><span>Handler State</span><b>${esc(s.handlerState)}</b></div><div class="statline"><span>Result</span><b>${s.reps.length?`${s.reps.length} reps`:esc(labelOutcome(s.overviewOutcome||'Not scored'))}</b></div>${s.reps.length?`<div class="outcomeBar" style="margin-top:10px">${Object.entries(dist).map(([k,v])=>`<span class="outcomeChip">${labelOutcome(k)} ${v}</span>`).join('')}</div>`:''}</div><div class="card"><div class="field"><label>✅ GOOD — what worked</label><textarea id="sumGood">${esc(s.good)}</textarea></div><div class="field"><label>⚠️ BAD — what didn’t</label><textarea id="sumBad">${esc(s.bad)}</textarea></div><div class="field"><label>❓ WEIRD — anomalous / unexplained</label><textarea id="sumWeird">${esc(s.weird)}</textarea></div><div class="field"><label>What limited progress? (multi-select)</label><div class="tagGrid">${['Dog','Handler','Training Plan','Environment','Weird / Unknown'].map(x=>`<button class="tag ${s.limiters.includes(x)?'selected':''}" onclick="toggleLimiter('${x}')">${x}</button>`).join('')}</div></div></div><div class="card"><div class="kicker">PROGRESSION DECISION</div><p class="muted">The trainer decides. Only <b>${esc(s.componentName)}</b> will change.</p><div class="decisionGrid"><button class="btn secondary" onclick="saveDecision('Advance')">ADVANCE</button><button class="btn" onclick="saveDecision('Repeat')">REPEAT</button><button class="btn secondary" onclick="saveDecision('Step Back')">STEP BACK</button><button class="btn secondary" onclick="chooseDifferentStep()">CHOOSE STEP</button></div></div>`}
function syncSummaryFields(){nav.session.good=document.getElementById('sumGood')?.value||'';nav.session.bad=document.getElementById('sumBad')?.value||'';nav.session.weird=document.getElementById('sumWeird')?.value||''}
function toggleLimiter(x){syncSummaryFields();const a=nav.session.limiters,i=a.indexOf(x);i>=0?a.splice(i,1):a.push(x);renderSummary()}
function saveDecision(decision,chosenStepId=null){syncSummaryFields();const s=nav.session,c=component(s.goalId,s.exerciseId,s.componentId),idx=c.steps.findIndex(x=>x.id===s.stepId);let next=s.stepId;if(chosenStepId)next=chosenStepId;else if(decision==='Advance'&&idx<c.steps.length-1)next=c.steps[idx+1].id;else if(decision==='Step Back'&&idx>0)next=c.steps[idx-1].id;c.currentStepId=next;s.decision=decision;s.resultingStepId=next;s.savedAt=new Date().toISOString();state.sessions.push({...s});save();nav.session=null;nav.training=null;show('homeScreen');toast(`Saved. Only ${c.name} updated.`)}
function chooseDifferentStep(){syncSummaryFields();const s=nav.session,c=component(s.goalId,s.exerciseId,s.componentId);sheet(`<h2>Choose ${esc(c.name)} step</h2>${c.steps.map((x,i)=>`<div class="listrow ${c.currentStepId===x.id?'current':''}"><div class="num">${i+1}</div><div class="grow"><b>${esc(x.name)}</b></div><button class="btn small" onclick="closeSheet();saveDecision('Choose Different Step','${x.id}')">CHOOSE</button></div>`).join('')}`)}
function sheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeSheet(){document.getElementById('modal').classList.remove('show')}function val(id){return document.getElementById(id)?.value.trim()||''}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`FIELDWORK-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function toast(msg){const d=document.createElement('div');d.textContent=msg;Object.assign(d.style,{position:'fixed',left:'50%',bottom:'92px',transform:'translateX(-50%)',background:'#c9f25b',color:'#10150f',padding:'10px 14px',borderRadius:'999px',fontWeight:'900',fontSize:'12px',zIndex:99,boxShadow:'0 8px 30px rgba(0,0,0,.35)'});document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>show(b.dataset.screen));
// Reliable delegated navigation for dynamically rendered Curriculum Builder rows (iOS/Safari safe).
document.getElementById('builderScreen').addEventListener('click',e=>{
  const g=e.target.closest('.js-open-goal');
  if(g){e.preventDefault();openGoal(g.dataset.goalId);return;}
  const ex=e.target.closest('.js-open-exercise');
  if(ex){e.preventDefault();openExercise(ex.dataset.exerciseId);return;}
  const c=e.target.closest('.js-open-component');
  if(c){e.preventDefault();openComponent(c.dataset.componentId);return;}
});
document.getElementById('photoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.dog.photo=r.result;save();renderHome()};r.readAsDataURL(f)});
document.getElementById('restoreInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.version)throw 0;state=x;save();render();show('homeScreen');toast('Backup restored.')}catch(_){alert('That does not look like a FIELDWORK backup.')}};r.readAsText(f)});
render();
</script>
</body>
</html>
