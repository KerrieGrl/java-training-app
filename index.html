function openLibraryHub(){show('libraryHubScreen')}
function libraryHubOpenComponent(eid,cid){
  const e=exercise(eid),c=component(eid,cid);
  if(!e||!c){alert('That component could not be found.');return}
  const g=displayGoalForExercise(e);
  nav.builder={level:'component',goalId:g?.id||null,exerciseId:eid,componentId:cid};
  show('builderScreen');
}
function libraryHubEditAssigned(eid,cid,kind,id){
  const e=exercise(eid),c=component(eid,cid);
  if(!e||!c){alert('Component not found. Nothing changed.');return}
  const items=kind==='tool'?(c.tools||[]):(c.trackableVariables||[]);
  const item=items.find(x=>x.id===id);
  if(!item){alert('Setting not found. Nothing changed.');return}
  const g=displayGoalForExercise(e);
  nav.builder={level:'component',goalId:g?.id||null,exerciseId:eid,componentId:cid};

function libraryHubRows(){
  const rows=[];
  (state.exercises||[]).forEach(e=>(e.components||[]).forEach(c=>{
    const tools=Array.isArray(c.tools)?c.tools:[];
    const variables=Array.isArray(c.trackableVariables)?c.trackableVariables:[];
    rows.push({e,c,tools,variables});
  }));
  return rows.sort((a,b)=>a.e.name.localeCompare(b.e.name)||a.c.name.localeCompare(b.c.name));
}

if(nav.builder.level==='exercise'){const e=exercise(nav.builder.exerciseId);html+=`<div class="crumb">${esc(e.name)}</div><div class="card"><div class="kicker">LINKED GOALS</div><div>${goalsForExercise(e).map(g=>esc(g.name)).join(' · ')||'None'}</div><div class="hr"></div><div class="kicker">OVERALL EXERCISE / TRIAL CRITERIA</div><div style="white-space:pre-wrap">${esc(e.criteria||'Not entered')}</div><div class="hr"></div><div class="kicker">NOTES</div><div style="white-space:pre-wrap">${esc(e.notes||'Not entered')}</div><div class="hr"></div><div class="tiny muted">${esc(e.status)} · ${esc(e.priority)} · ${esc(freqText(e))}</div><div class="hr"></div><button class="btn small secondary" onclick="openExerciseForm('${e.id}')">EDIT EXERCISE</button></div><div class="sectionHead"><h2>Troubleshoot</h2></div>${builderTroubleshootSection(e,'exercise',e.id,'')}<div class="sectionHead"><h2>Components</h2></div>${e.components.map(c=>`<div class="listrow"><div class="grow"><b>${esc(c.name)}</b><div class="tiny muted">${esc(c.status)} · ${esc(c.priority)} · ${esc(freqText(c))} · ${esc(currentStepText(c))}</div></div><button class="btn small secondary js-open-component" data-component-id="${c.id}">OPEN</button></div>`).join('')}<button class="btn full" onclick="openComponentForm()">+ ADD COMPONENT</button>`}
if(nav.builder.level==='component'){const e=exercise(nav.builder.exerciseId),c=component(e.id,nav.builder.componentId),st=statsFor(e,c);html+=`<div class="crumb">${esc(e.name)} → ${esc(c.name)}</div><div class="card"><div class="kicker">COVERAGE SETTINGS</div><div>${esc(c.status)} · ${esc(c.priority)} · ${esc(freqText(c))}</div><div class="tiny muted" style="margin-top:5px">Last trained: ${fmtDate(st.last)} · This week: ${st.thisWeek}${st.overdue?' · OVERDUE':''}</div><div class="hr"></div><div class="kicker">FINISHED PICTURE</div><div>${esc(c.finishedPicture||'Not entered')}</div><div class="hr"></div><div class="seg"><button class="btn small secondary" onclick="openComponentForm('${c.id}')">EDIT COMPONENT</button><button class="btn small secondary" onclick="openMoveComponent('${c.id}')">MOVE COMPONENT</button><button class="btn small secondary" onclick="openPromoteComponent('${c.id}')">MAKE ITS OWN EXERCISE</button></div><button class="btn danger full" style="margin-top:10px" onclick="deleteComponent('${c.id}')">DELETE COMPONENT</button></div><div class="sectionHead"><h2>Troubleshoot</h2></div>${builderTroubleshootSection(c,'component',e.id,c.id)}<div class="sectionHead"><h2>Training Tools</h2></div>${componentToolsBuilder(c)}<button class="btn full secondary" onclick="chooseToolSource()">+ ADD TRAINING TOOL</button><div class="sectionHead"><h2>Trackable Variables</h2></div>${componentVariablesBuilder(c)}<button class="btn full secondary" onclick="chooseVariableSource()">+ ADD TRACKABLE VARIABLE</button><div class="sectionHead"><h2>Progression</h2></div>${c.steps.map((s,i)=>`<div class="listrow ${c.currentStepId===s.id?'current':''}"><div class="num">${i+1}</div><div class="grow"><b>${esc(s.name)}</b><div class="tiny muted">${esc(s.goal||s.criterion||'')}</div></div><div class="moveBtns"><button class="btn small ghost" onclick="moveStep('${s.id}',-1)">↑</button><button class="btn small ghost" onclick="moveStep('${s.id}',1)">↓</button><button class="btn small secondary" onclick="openStepForm('${s.id}')">•••</button></div></div>`).join('')}<button class="btn full" onclick="openStepForm()">+ ADD STEP</button>`}el.innerHTML=html}
function builderTroubleshootSection(x,scope,eid,cid){const items=troubleshootItems(x);return `<div class="card">${items.length?items.map((v,i)=>`<div class="listrow" style="align-items:flex-start"><div class="grow" style="white-space:pre-wrap">• ${esc(v)}</div><div class="moveBtns"><button class="btn small secondary" onclick="editBuilderTroubleshootBullet('${scope}','${eid}','${cid}',${i})">EDIT</button><button class="btn small danger" onclick="deleteBuilderTroubleshootBullet('${scope}','${eid}','${cid}',${i})">DELETE</button></div></div>`).join(''):`<div class="tiny muted" style="margin:8px 0">No troubleshooting reminders yet.</div>`}<button class="btn secondary full" style="margin-top:8px" onclick="addBuilderTroubleshootBullet('${scope}','${eid}','${cid}')">+ ADD BULLET</button></div>`}
function builderTroubleshootTarget(scope,eid,cid){return scope==='exercise'?exercise(eid):component(eid,cid)}
function addBuilderTroubleshootBullet(scope,eid,cid){const x=builderTroubleshootTarget(scope,eid,cid);if(!x)return;const v=prompt('Add troubleshooting bullet:');if(v==null||!v.trim())return;x.troubleshoot=troubleshootItems(x);x.troubleshoot.push(v.trim());save();renderBuilder();toast('Troubleshooting bullet added ✓')}
function editBuilderTroubleshootBullet(scope,eid,cid,i){const x=builderTroubleshootTarget(scope,eid,cid),a=troubleshootItems(x);if(!x||!a[i])return;const v=prompt('Edit troubleshooting bullet:',a[i]);if(v==null)return;if(!v.trim()){if(confirm('Delete this troubleshooting bullet?'))a.splice(i,1)}else a[i]=v.trim();x.troubleshoot=a;save();renderBuilder();toast('Troubleshooting updated ✓')}
function deleteBuilderTroubleshootBullet(scope,eid,cid,i){const x=builderTroubleshootTarget(scope,eid,cid),a=troubleshootItems(x);if(!x||!a[i])return;if(!confirm('Delete this troubleshooting bullet?'))return;a.splice(i,1);x.troubleshoot=a;save();renderBuilder();toast('Troubleshooting bullet deleted')}
function builderBack(){if(nav.builder.level==='component')nav.builder.level='exercise';else if(nav.builder.level==='exercise')nav.builder={level:'goal',goalId:nav.builder.goalId,exerciseId:null,componentId:null};else if(nav.builder.level==='goal')nav.builder={level:'root',goalId:null,exerciseId:null,componentId:null};else{show('moreScreen');return}renderBuilder()}

function openExercise(id){nav.builder={level:'exercise',goalId:nav.builder.goalId,exerciseId:id,componentId:null};renderBuilder()}

function openMoveComponent(componentId){const from=exercise(nav.builder.exerciseId),c=component(from.id,componentId),others=state.exercises.filter(e=>e.id!==from.id);if(!others.length){alert('Create the destination Exercise first.');return}sheet(`<h2>Move ${esc(c.name)}</h2><p class="muted">Move this entire Component — including its progression steps, current step, tools, and saved settings — to another Exercise. Nothing is retyped.</p><div class="field"><label>Move to Exercise</label><select id="moveDestination">${others.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="moveComponentNow('${componentId}')">MOVE</button></div>`)}
function moveComponentNow(componentId){const from=exercise(nav.builder.exerciseId),to=exercise(document.getElementById('moveDestination').value),idx=from.components.findIndex(c=>c.id===componentId);if(idx<0||!to)return;const moved=from.components.splice(idx,1)[0];to.components=to.components||[];to.components.push(moved);save();closeSheet();nav.builder.exerciseId=to.id;nav.builder.componentId=moved.id;nav.builder.level='component';render();toast(`${moved.name} moved to ${to.name} ✓`)}
function openPromoteComponent(componentId){const from=exercise(nav.builder.exerciseId),c=component(from.id,componentId);if(!from||!c)return;const linked=goalsForExercise(from);const preferred=goal(nav.builder.goalId)||linked[0]||state.goals[0];sheet(`<h2>Make ${esc(c.name)} its own Exercise</h2><p class="muted">This promotes the Component out of ${esc(from.name)}. FIELDWORK first creates and verifies the new Exercise, preserving the progression, current step, tools, finished picture, status, priority, and frequency. Only after verification will it remove the old Component.</p><div class="field"><label>New Exercise Name</label><input id="promoteName" value="${esc(c.name)}"></div><div class="field"><label>Link new Exercise to Goal(s)</label><div class="tagGrid">${state.goals.map(g=>`<label class="tag"><input type="checkbox" class="promoteGoal" value="${g.id}" ${g.id===preferred?.id?'checked':''}> ${esc(g.name)}</label>`).join('')}</div></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="promoteComponentNow('${componentId}')">MAKE EXERCISE</button></div>`)}
function promoteComponentNow(componentId){try{const from=exercise(nav.builder.exerciseId),idx=from?.components?.findIndex(c=>c.id===componentId);if(!from||idx<0)throw new Error('Original component was not found. Nothing changed.');const original=from.components[idx];const name=val('promoteName').trim()||original.name;const goalIds=[...document.querySelectorAll('.promoteGoal:checked')].map(x=>x.value);if(!goalIds.length)throw new Error('Choose at least one Goal for the new Exercise.');const snapshot=JSON.stringify(state);const preserved=JSON.parse(JSON.stringify(original));const innerComponent={...preserved,id:uid()};const newExercise={id:uid(),name,icon:'🐕',criteria:preserved.finishedPicture||'',notes:'',goalIds:[...goalIds],components:[innerComponent],status:original.status||'Not Started',priority:original.priority||'Normal',frequency:JSON.parse(JSON.stringify(original.frequency||{mode:'weekly',value:1}))};state.exercises.push(newExercise);state.goals.forEach(g=>{g.exerciseIds=g.exerciseIds||[];if(goalIds.includes(g.id)&&!g.exerciseIds.includes(newExercise.id))g.exerciseIds.push(newExercise.id)});save();const persisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));const pe=persisted.exercises.find(e=>e.id===newExercise.id),pc=pe?.components?.find(c=>c.id===innerComponent.id);if(!pe||!pc){state=JSON.parse(snapshot);save();throw new Error('FIELDWORK could not verify the new Exercise. The original Component is still untouched.');}const liveFrom=state.exercises.find(e=>e.id===from.id);const liveIdx=liveFrom?.components?.findIndex(c=>c.id===componentId)??-1;if(liveIdx<0){state=JSON.parse(snapshot);save();throw new Error('FIELDWORK could not find the original Component for the final move. Nothing was removed.');}liveFrom.components.splice(liveIdx,1);save();const finalPersisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));const finalExercise=finalPersisted.exercises.find(e=>e.id===newExercise.id);const finalGoalLinks=goalIds.every(gid=>finalPersisted.goals.find(g=>g.id===gid)?.exerciseIds?.includes(newExercise.id));const originalStillThere=finalPersisted.exercises.find(e=>e.id===from.id)?.components?.some(c=>c.id===componentId);if(!finalExercise||!finalGoalLinks||originalStillThere){state=JSON.parse(snapshot);save();throw new Error('Final move verification failed. FIELDWORK restored the original Component.');}state=finalPersisted;closeSheet();nav.builder={level:'exercise',goalId:goalIds[0],exerciseId:newExercise.id,componentId:null};render();alert(`${name} is now its own Exercise under the selected Goal. The old Component was removed only after the new Exercise and Goal link were verified.`)}catch(err){alert(err.message)}}

function openExerciseForm(id){const e=id?exercise(id):null;const currentGoal=nav.builder.goalId;sheet(`<h2>${e?'Edit':'Add / Link'} exercise</h2>${!e&&state.exercises.length?`<div class="field"><label>Link an existing exercise instead</label><select id="existingExercise"><option value="">Create new exercise</option>${state.exercises.filter(x=>!(x.goalIds||[]).includes(currentGoal)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`:''}<div class="field"><label>Name</label><input id="fName" value="${esc(e?.name||'')}"></div><div class="field"><label>Icon</label><input id="fIcon" value="${esc(e?.icon||'🐕')}"></div><div class="field"><label>Linked Goal(s)</label><div class="tagGrid">${state.goals.map(g=>`<label class="tag"><input type="checkbox" class="goalLink" value="${g.id}" ${(e?.goalIds||[currentGoal]).includes(g.id)?'checked':''}> ${esc(g.name)}</label>`).join('')}</div></div><div class="field" style="padding:14px;border:2px solid var(--lime);border-radius:16px;background:rgba(213,255,63,.06)"><label style="font-size:18px">OVERALL EXERCISE / TRIAL CRITERIA</label><textarea id="fExerciseCriteria" style="min-height:320px" placeholder="Enter the overall criteria for this exercise (for example, the full IGP trial criteria for Heeling).">${esc(e?.criteria||'')}</textarea></div><div class="field" style="padding:14px;border:2px solid var(--line);border-radius:16px"><label style="font-size:18px">NOTES</label><textarea id="fExerciseNotes" style="min-height:360px" placeholder="Add overall notes for this exercise.">${esc(e?.notes||'')}</textarea></div>${metaFields(e)}<div class="field" style="border:1px solid var(--line);padding:12px;border-radius:12px"><label>WEEKLY COMPONENT PLANNING</label><select id="fPlanningMode" onchange="document.getElementById('planningComponentChoices').style.display=this.value==='selected'?'block':'none'"><option value="all" ${e?.planningMode!=='selected'?'selected':''}>All eligible components</option><option value="selected" ${e?.planningMode==='selected'?'selected':''}>Only selected components</option></select><div id="planningComponentChoices" style="display:${e?.planningMode==='selected'?'block':'none'};margin-top:10px"><div class="tiny muted">Choose components eligible for automatic weekly scheduling. Unselected components remain available for manual training.</div>${(e?.components||[]).map(c=>`<label style="display:block;padding:9px 0"><input type="checkbox" class="planningComponent" value="${c.id}" ${e?.planningMode!=='selected'||(e?.planningComponentIds||[]).includes(c.id)?'checked':''} style="width:auto;margin-right:8px">${esc(c.name)}</label>`).join('')||'<div class="tiny muted">Add components first, then edit this exercise to select them.</div>'}</div></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveExercise('${id||''}')">Save</button></div>`)}
function saveExercise(id){const existing=document.getElementById('existingExercise')?.value;if(!id&&existing){const e=exercise(existing),g=goal(nav.builder.goalId);if(!e.goalIds.includes(g.id))e.goalIds.push(g.id);if(!g.exerciseIds.includes(e.id))g.exerciseIds.push(e.id);save();closeSheet();renderBuilder();return}let e=id?exercise(id):{id:uid(),components:[],goalIds:[],troubleshoot:[]};e.name=val('fName');e.icon=val('fIcon')||'🐕';e.criteria=val('fExerciseCriteria');e.notes=val('fExerciseNotes');e.goalIds=[...document.querySelectorAll('.goalLink:checked')].map(x=>x.value);readMeta(e);e.planningMode=document.getElementById('fPlanningMode')?.value||'all';e.planningComponentIds=[...document.querySelectorAll('.planningComponent:checked')].map(x=>x.value);state.goals.forEach(g=>{g.exerciseIds=g.exerciseIds||[];const linked=e.goalIds.includes(g.id);g.exerciseIds=linked?[...new Set([...g.exerciseIds,e.id])]:g.exerciseIds.filter(x=>x!==e.id)});if(!id)state.exercises.push(e);save();closeSheet();nav.builder.exerciseId=e.id;nav.builder.level='exercise';render()}
function openComponentForm(id){const e=exercise(nav.builder.exerciseId),c=id?component(e.id,id):null,f=c?.sessionFields||{place:true,reinforcer:true,rewardPosition:false,handlerState:true};sheet(`<h2>${c?'Edit':'Add'} component</h2><div class="field"><label>Name</label><input id="fName" value="${esc(c?.name||'')}"></div><div class="field"><label>Finished picture</label><textarea id="fPic">${esc(c?.finishedPicture||'')}</textarea></div>${metaFields(c)}<div class="field"><label>SESSION SETUP — SHOW FOR THIS COMPONENT</label><div class="tagGrid">${[['place','Place'],['reinforcer','Reinforcer'],['rewardPosition','Reward Position'],['handlerState','Handler State']].map(([k,l])=>`<label class="tag"><input type="checkbox" id="sf_${k}" ${f[k]?'checked':''}> ${l}</label>`).join('')}</div></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveComponent('${id||''}')">Save</button></div>`)}
function saveComponent(id){const e=exercise(nav.builder.exerciseId);let c=id?component(e.id,id):{id:uid(),steps:[],tools:[],trackableVariables:[],currentStepId:null,troubleshoot:[]};c.name=val('fName');c.finishedPicture=val('fPic');readMeta(c);c.sessionFields={place:!!document.getElementById('sf_place')?.checked,reinforcer:!!document.getElementById('sf_reinforcer')?.checked,rewardPosition:!!document.getElementById('sf_rewardPosition')?.checked,handlerState:!!document.getElementById('sf_handlerState')?.checked};if(!id)e.components.push(c);save();closeSheet();nav.builder.componentId=c.id;nav.builder.level='component';render()}
function deleteComponent(id){
  const e=exercise(nav.builder.exerciseId),c=component(e?.id,id);
  if(!e||!c){alert('Component not found. Nothing changed.');return}
  const separate=state.exercises.find(x=>x.id!==e.id&&x.name.trim().toLowerCase()===c.name.trim().toLowerCase());
  const msg=separate
    ? `Delete ${c.name} ONLY as a Component from ${e.name}?\n\nThe separate ${separate.name} Exercise will NOT be deleted.\n\nThis removes this Component and its progression/tools from ${e.name}.`
    : `Delete ${c.name} from ${e.name}?\n\nThis permanently removes this Component and its progression/tools. No separate Exercise with the same name was found.`;
  if(!confirm(msg))return;
  const snapshot=JSON.stringify(state);
  e.components=e.components.filter(x=>x.id!==id);
  try{
    save();
    const persisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));
    const pe=persisted.exercises.find(x=>x.id===e.id);
    if(!pe||pe.components.some(x=>x.id===id))throw new Error('Delete could not be verified.');
    if(separate&&!persisted.exercises.some(x=>x.id===separate.id))throw new Error('Separate Exercise verification failed.');
    nav.builder={level:'exercise',goalId:nav.builder.goalId,exerciseId:e.id,componentId:null};
    render();toast(`${c.name} removed from ${e.name} ✓`);
  }catch(err){state=JSON.parse(snapshot);save();alert('FIELDWORK restored your data because the delete could not be verified. '+err.message)}
}

function openStepForm(id){const c=component(nav.builder.exerciseId,nav.builder.componentId),s=id?c.steps.find(x=>x.id===id):null;sheet(`<h2>${s?'Edit':'Add'} progression step</h2><div class="field"><label>Step name</label><input id="fName" value="${esc(s?.name||`Step ${c.steps.length+1}`)}"></div><div class="field" style="padding:14px;border:2px solid var(--lime);border-radius:16px;background:rgba(213,255,63,.08)"><label style="font-size:18px">🎯 STEP GOAL</label><textarea id="fGoal" style="min-height:220px">${esc(s?.goal||'')}</textarea></div><div class="field" style="padding:14px;border:2px solid var(--lime);border-radius:16px;background:rgba(213,255,63,.06)"><label style="font-size:18px">🧭 STEPS TO PERFORM THIS STEP</label><textarea id="fActions" style="min-height:320px" placeholder="Enter the actual training sequence / steps to perform this progression step.">${esc(s?.actions||'')}</textarea></div><div class="field"><label>Description</label><textarea id="fDesc" style="min-height:220px">${esc(s?.description||'')}</textarea></div><div class="field" style="padding:14px;border:2px solid var(--orange);border-radius:16px;background:rgba(242,154,84,.06)"><label style="font-size:18px">⚡ TODAY'S JOB</label><textarea id="fTodayJob" style="min-height:180px" placeholder="Short field-language cue: what are you actually doing today?">${esc(s?.todayJob||'')}</textarea></div><div class="field"><label>Criterion for success</label><textarea id="fCrit" style="min-height:220px">${esc(s?.criterion||'')}</textarea></div><div class="field"><label>Progression / outcome rule</label><textarea id="fRule" style="min-height:220px">${esc(s?.rule||'')}</textarea></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveStep('${id||''}')">Save</button></div>${s?`<div class="stack"><button class="btn secondary full" onclick="setCurrent('${s.id}')">SET CURRENT</button><button class="btn danger full" onclick="deleteStep('${s.id}')">DELETE STEP</button></div>`:''}`)}
function saveStep(id){try{const c=component(nav.builder.exerciseId,nav.builder.componentId);const obj={id:id||uid(),name:val('fName'),goal:val('fGoal'),actions:val('fActions'),description:val('fDesc'),todayJob:val('fTodayJob'),criterion:val('fCrit'),rule:val('fRule')};if(id)c.steps[c.steps.findIndex(x=>x.id===id)]=obj;else{c.steps.push(obj);if(!c.currentStepId)c.currentStepId=obj.id}save();const persisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));const pc=persisted.exercises.find(e=>e.id===nav.builder.exerciseId)?.components.find(x=>x.id===nav.builder.componentId),ps=pc?.steps.find(x=>x.id===obj.id);if(!ps||ps.goal!==obj.goal||ps.actions!==obj.actions||ps.description!==obj.description||ps.todayJob!==obj.todayJob||ps.criterion!==obj.criterion||ps.rule!==obj.rule)throw new Error('Step fields did not persist completely');closeSheet();render();toast('Step saved and verified ✓')}catch(err){alert('FIELDWORK did not save this step. '+err.message)}}
function setCurrent(id){component(nav.builder.exerciseId,nav.builder.componentId).currentStepId=id;save();closeSheet();render()}
function deleteStep(id){if(!confirm('Delete this progression step?'))return;const c=component(nav.builder.exerciseId,nav.builder.componentId);c.steps=c.steps.filter(x=>x.id!==id);if(c.currentStepId===id)c.currentStepId=c.steps[0]?.id||null;save();closeSheet();render()}
function moveStep(id,d){const c=component(nav.builder.exerciseId,nav.builder.componentId),i=c.steps.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=c.steps.length)return;[c.steps[i],c.steps[j]]=[c.steps[j],c.steps[i]];save();renderBuilder()}
function libraryItems(key){state.libraries=state.libraries||{places:[],articles:[],reinforcers:[],handlerStates:[],interferences:[],trainingObservations:[],handlerObservations:[],toolTemplates:[],variableTemplates:[]};state.libraries[key]=state.libraries[key]||[];return state.libraries[key]}
function libraryLabel(key){return ({places:'Places',articles:'Articles',reinforcers:'Reinforcers',handlerStates:'Handler States',trainingObservations:'Java Progress / Setback',handlerObservations:'Handler Helped / Hurt'})[key]||key}
function renderLibraryList(key){const a=libraryItems(key);return a.length?a.map((x,i)=>`<div class="listrow"><div class="grow"><b>${esc(x)}</b></div><div class="moveBtns"><button class="btn small ghost" onclick="moveLibraryItem('${key}',${i},-1)">↑</button><button class="btn small ghost" onclick="moveLibraryItem('${key}',${i},1)">↓</button><button class="btn small secondary" onclick="openLibraryItemForm('${key}',${i})">EDIT</button><button class="btn small danger" onclick="deleteLibraryItem('${key}',${i})">DELETE</button></div></div>`).join(''):`<div class="empty">No ${libraryLabel(key).toLowerCase()} saved yet.</div>`}
function interferenceItems(){state.libraries=state.libraries||{};state.libraries.interferences=Array.isArray(state.libraries.interferences)?state.libraries.interferences:[];return state.libraries.interferences}
function interferenceName(x){return typeof x==='string'?x:(x?.name||'')}
function interferenceCategory(x){return typeof x==='string'?'Other':(x?.category||'Other')}
function renderInterferenceList(){const a=interferenceItems();return a.length?a.map((x,i)=>`<div class="listrow"><div class="grow"><b>${esc(interferenceName(x))}</b><div class="tiny muted">${esc(interferenceCategory(x))}</div></div><button class="btn small secondary" onclick="openInterferenceForm(${i})">EDIT</button><button class="btn small danger" onclick="deleteInterference(${i})">DELETE</button></div>`).join(''):'<div class="empty">No interferences saved yet.</div>'}
function openInterferenceManager(){sheet(`<h2>Interferences</h2><p class="muted">Reusable things that can interfere with a training session. You name them; the type keeps progression logic meaningful.</p>${renderInterferenceList()}<button class="btn full" onclick="openInterferenceForm()">+ ADD INTERFERENCE</button><button class="btn secondary full" style="margin-top:8px" onclick="finishInterferenceManager()">DONE</button>`)}
function finishInterferenceManager(){closeSheet();if(nav.session&&document.getElementById('summaryScreen')?.classList.contains('active'))renderSummary()}
function openInterferenceForm(index=null){const a=interferenceItems(),x=index===null?null:a[index],name=interferenceName(x),cat=interferenceCategory(x);sheet(`<h2>${index===null?'Add':'Edit'} Interference</h2><div class="field"><label>Name</label><input id="interferenceName" value="${esc(name)}" placeholder="Your wording"></div><div class="field"><label>Type</label><select id="interferenceCategory">${['Dog','Handler','Environment','Training Plan','Other'].map(v=>`<option ${cat===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="sheetActions"><button class="btn secondary" onclick="openInterferenceManager()">Cancel</button><button class="btn" onclick="saveInterference(${index===null?'null':index})">SAVE</button></div>`)}
function saveInterference(index){const name=val('interferenceName'),category=document.getElementById('interferenceCategory')?.value||'Other';if(!name){alert('Enter a name.');return}const a=interferenceItems();if(a.some((x,i)=>i!==index&&interferenceName(x).trim().toLowerCase()===name.toLowerCase())){alert('That interference is already saved.');return}const item={id:(index===null?uid():(typeof a[index]==='object'&&a[index].id?a[index].id:uid())),name,category};if(index===null)a.push(item);else a[index]=item;save();openInterferenceManager();toast('Interference saved ✓')}
function deleteInterference(index){const a=interferenceItems();if(!confirm(`Delete “${interferenceName(a[index])}”?`))return;a.splice(index,1);save();openInterferenceManager()}
function openLibraryManager(key){sheet(`<h2>${libraryLabel(key)}</h2><p class="muted">Your reusable ${libraryLabel(key).toLowerCase()} library.</p>${renderLibraryList(key)}<button class="btn full" onclick="openLibraryItemForm('${key}')">+ ADD ${key==='places'?'PLACE':key==='articles'?'ARTICLE':key==='reinforcers'?'REINFORCER':key==='handlerStates'?'HANDLER STATE':'ITEM'}</button><button class="btn secondary full" style="margin-top:8px" onclick="closeSheet()">DONE</button>`)}
function openLibraryItemForm(key,index=null){const a=libraryItems(key),current=index===null?'':(a[index]||'');sheet(`<h2>${index===null?'Add':'Edit'} ${key==='places'?'Place':key==='articles'?'Article':key==='reinforcers'?'Reinforcer':key==='handlerStates'?'Handler State':'Item'}</h2><div class="field"><label>Name</label><input id="libraryItemName" value="${esc(current)}"></div><div class="sheetActions"><button class="btn secondary" onclick="openLibraryManager('${key}')">Cancel</button><button class="btn" onclick="saveLibraryItem('${key}',${index===null?'null':index})">SAVE</button></div>`)}
function saveLibraryItem(key,index){const name=val('libraryItemName');if(!name){alert('Enter a name.');return}const a=libraryItems(key);if(a.some((x,i)=>i!==index&&x.trim().toLowerCase()===name.toLowerCase())){alert('That item is already saved.');return}if(index===null)a.push(name);else a[index]=name;if(key==='places')state.settings.locations=[...a];if(key==='reinforcers')state.settings.reinforcers=[...a];if(key==='handlerStates')state.settings.handlerStates=[...a];save();openLibraryManager(key);toast(`${libraryLabel(key).replace(/s$/,'')} saved ✓`)}
function deleteLibraryItem(key,index){const a=libraryItems(key),name=a[index];if(name===undefined)return;if(!confirm(`Delete ${name} from ${libraryLabel(key)}?`))return;a.splice(index,1);if(key==='places')state.settings.locations=[...a];if(key==='reinforcers')state.settings.reinforcers=[...a];if(key==='handlerStates')state.settings.handlerStates=[...a];save();openLibraryManager(key)}
function moveLibraryItem(key,index,dir){const a=libraryItems(key),j=index+dir;if(j<0||j>=a.length)return;[a[index],a[j]]=[a[j],a[index]];if(key==='places')state.settings.locations=[...a];if(key==='reinforcers')state.settings.reinforcers=[...a];if(key==='handlerStates')state.settings.handlerStates=[...a];save();openLibraryManager(key)}
function variableTypeLabel(v){return v.type==='number'?'Number':v.type==='choice'?'Choice':v.type==='library'?`Library Choice · ${libraryLabel(v.libraryKey||'articles')}`:'Yes / No'}
function componentVariablesBuilder(c){c.trackableVariables=c.trackableVariables||[];return c.trackableVariables.length?c.trackableVariables.map(v=>`<div class="listrow"><div class="grow"><b>${esc(v.name)}</b><div class="tiny muted">${esc(variableTypeLabel(v))}${v.repeatable?' · Repeatable':''}</div></div><button class="btn small secondary" onclick="openVariableForm('${v.id}')">EDIT</button></div>`).join(''):`<div class="card empty">No trackable variables attached yet.</div>`}
function openVariableForm(id){const c=component(nav.builder.exerciseId,nav.builder.componentId);c.trackableVariables=c.trackableVariables||[];const v=id?c.trackableVariables.find(x=>x.id===id):null;sheet(`<h2>${v?'Edit':'Add'} Trackable Variable</h2><div class="field"><label>Variable Name</label><input id="varName" value="${esc(v?.name||'')}"></div><div class="field"><label>Type</label><select id="varType" onchange="refreshVariableOptions()"><option value="number" ${v?.type==='number'?'selected':''}>Number</option><option value="choice" ${v?.type==='choice'?'selected':''}>Choice</option><option value="library" ${v?.type==='library'?'selected':''}>Library Choice</option><option value="boolean" ${v?.type==='boolean'?'selected':''}>Yes / No</option></select></div><div id="varOptions"></div><div class="field"><label><input id="varMultiSelect" type="checkbox" ${v?.multiSelect?'checked':''} style="width:auto;margin-right:8px"> Allow multiple choices in one record</label></div><div class="field"><label><input id="varRepeatable" type="checkbox" ${v?.repeatable?'checked':''} style="width:auto;margin-right:8px"> Repeatable during a session</label></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveVariable('${id||''}')">SAVE</button></div>${v?`<button class="btn secondary full" style="margin-top:10px" onclick="saveCurrentAsTemplate('variables','${v.id}')">SAVE AS REUSABLE TEMPLATE</button><button class="btn danger full" style="margin-top:10px" onclick="deleteVariable('${v.id}')">DELETE VARIABLE</button>`:''}`);setTimeout(()=>refreshVariableOptions(v),0)}
function refreshVariableOptions(existing=null){const type=document.getElementById('varType')?.value,box=document.getElementById('varOptions');if(!box)return;if(type==='choice')box.innerHTML=`<div class="field"><label>Choices — one per line</label><textarea id="varChoices">${esc((existing?.choices||[]).join('\n'))}</textarea></div>`;else if(type==='library')box.innerHTML=`<div class="field"><label>Library</label><select id="varLibrary"><option value="articles" ${existing?.libraryKey!=='places'?'selected':''}>Articles</option><option value="places" ${existing?.libraryKey==='places'?'selected':''}>Places</option><option value="reinforcers" ${existing?.libraryKey==='reinforcers'?'selected':''}>Reinforcers</option><option value="handlerStates" ${existing?.libraryKey==='handlerStates'?'selected':''}>Handler States</option></select></div>`;else box.innerHTML=''}
function saveVariable(id){const c=component(nav.builder.exerciseId,nav.builder.componentId);c.trackableVariables=c.trackableVariables||[];const name=val('varName'),type=document.getElementById('varType').value;if(!name){alert('Enter a variable name.');return}const obj={id:id||uid(),name,type,repeatable:document.getElementById('varRepeatable').checked,multiSelect:document.getElementById('varMultiSelect').checked};if(type==='choice')obj.choices=(document.getElementById('varChoices')?.value||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(type==='library')obj.libraryKey=document.getElementById('varLibrary').value;const i=c.trackableVariables.findIndex(x=>x.id===id);if(i>=0)c.trackableVariables[i]=obj;else c.trackableVariables.push(obj);save();closeSheet();render();toast('Trackable variable saved ✓')}
function deleteVariable(id){const c=component(nav.builder.exerciseId,nav.builder.componentId);if(!confirm('Delete this trackable variable? Existing curriculum and training tools will not be changed.'))return;c.trackableVariables=(c.trackableVariables||[]).filter(x=>x.id!==id);save();closeSheet();render();toast('Trackable variable deleted ✓')}
function componentToolsBuilder(c){c.tools=c.tools||[];return c.tools.length?c.tools.map(t=>`<div class="listrow"><div class="grow"><b>${esc(t.name)}</b><div class="tiny muted">${t.type==='timer'?`Random Timer · ${t.min}–${t.max} ${t.units}`:`Random ${esc(t.numberName)}${t.secondName?' + '+esc(t.secondName):''}`}</div></div><button class="btn small secondary" onclick="openToolForm('${t.type}','${t.id}')">EDIT</button></div>`).join(''):`<div class="card empty">No tools attached yet.</div>`}

function templateItems(kind){state.libraries=state.libraries||{};const key=kind==='tools'?'toolTemplates':'variableTemplates';state.libraries[key]=Array.isArray(state.libraries[key])?state.libraries[key]:[];return state.libraries[key]}
function toolAssignmentLabel(t){const a=t.assignment||{};if(a.scope==='all')return 'All exercises and components';if(a.scope==='exercise')return 'Selected exercises: '+(a.exerciseIds||[]).map(id=>exercise(id)?.name||'Unknown').join(', ');if(a.scope==='component')return 'Selected components: '+(a.componentIds||[]).map(id=>{for(const e of state.exercises||[]){const c=(e.components||[]).find(c=>c.id===id);if(c)return e.name+' → '+c.name}return 'Unknown'}).join(', ');return 'Not assigned yet'}
function assignedLibraryTools(eid,cid){return templateItems('tools').filter(t=>{const a=t.assignment||{};return a.scope==='all'||a.scope==='exercise'&&(a.exerciseIds||[]).includes(eid)||a.scope==='component'&&(a.componentIds||[]).includes(cid)})}
function effectiveTrainingTools(eid,cid){const local=component(eid,cid)?.tools||[],library=assignedLibraryTools(eid,cid);return [...local,...library.filter(t=>!local.some(x=>x.templateId===t.id))]}
function toolAssignmentFields(t){const a=t?.assignment||{},scope=a.scope||'none';return `<div style="background:#fff4fa;border:1px solid #e9b5ce;padding:12px;border-radius:14px;margin-top:12px"><h3 style="color:#204d3b">📍 WHERE THIS TOOL APPLIES</h3><div class="field"><label>Assign to</label><select id="tmplScope" onchange="refreshToolAssignmentTargets()"><option value="none" ${scope==='none'?'selected':''}>Not assigned yet</option><option value="all" ${scope==='all'?'selected':''}>All exercises / all components</option><option value="exercise" ${scope==='exercise'?'selected':''}>Selected exercises (all their components)</option><option value="component" ${scope==='component'?'selected':''}>Selected components only</option></select></div><div id="tmplAssignmentTargets"></div></div>`}
function refreshToolAssignmentTargets(){const scope=document.getElementById('tmplScope')?.value,box=document.getElementById('tmplAssignmentTargets');if(!box)return;const t=templateItems('tools').find(x=>x.id===window.fwEditingToolId),a=t?.assignment||{};if(scope==='exercise')box.innerHTML=`<div class="tiny muted">Select one or more exercises:</div>${(state.exercises||[]).map(e=>`<label style="display:block;padding:9px 0"><input type="checkbox" class="fwAssignExercise" value="${esc(e.id)}" ${(a.exerciseIds||[]).includes(e.id)?'checked':''} style="width:auto"> ${esc(e.name)}</label>`).join('')}`;else if(scope==='component')box.innerHTML=`<div class="tiny muted">Select the exact components:</div>${(state.exercises||[]).map(e=>`<details style="padding:8px 0"><summary>${esc(e.name)}</summary>${(e.components||[]).map(c=>`<label style="display:block;padding:8px 0 8px 15px"><input type="checkbox" class="fwAssignComponent" value="${esc(c.id)}" ${(a.componentIds||[]).includes(c.id)?'checked':''} style="width:auto"> ${esc(c.name)}</label>`).join('')}</details>`).join('')}`;else box.innerHTML=scope==='all'?'<div class="tiny muted">Available throughout your curriculum.</div>':'<div class="tiny muted">Saved in Library but not shown during training.</div>'}
function readToolAssignment(){const scope=document.getElementById('tmplScope')?.value||'none';return {scope,exerciseIds:[...document.querySelectorAll('.fwAssignExercise:checked')].map(x=>x.value),componentIds:[...document.querySelectorAll('.fwAssignComponent:checked')].map(x=>x.value)}}
function openToolAssignments(id){const t=templateItems('tools').find(x=>x.id===id);if(!t)return;window.fwEditingToolId=id;sheet(`<h2>Assign ${esc(t.name)}</h2>${toolAssignmentFields(t)}<button class="btn full" onclick="saveToolAssignments('${id}')">SAVE ASSIGNMENTS</button><button class="btn secondary full" style="margin-top:8px" onclick="openTemplateManager('tools')">CANCEL</button>`);refreshToolAssignmentTargets()}
function saveToolAssignments(id){const t=templateItems('tools').find(x=>x.id===id);if(!t)return;const a=readToolAssignment();if((a.scope==='exercise'&&!a.exerciseIds.length)||(a.scope==='component'&&!a.componentIds.length)){alert('Choose at least one exercise or component.');return}t.assignment=a;save();openTemplateManager('tools');toast('Training tool assignments saved ✓')}
function cloneForComponent(obj){const x=JSON.parse(JSON.stringify(obj));x.id=uid();delete x.templateId;return x}
function chooseToolSource(){const a=templateItems('tools');sheet(`<h2>Add Training Tool</h2><p class="muted">Tools stay Component-specific. Start from a reusable template or create one just for this Component.</p>${a.length?`<button class="btn full" onclick="chooseExistingTemplate('tools')">CHOOSE EXISTING TEMPLATE</button>`:''}<button class="btn full secondary" style="margin-top:10px" onclick="chooseToolType()">CREATE NEW</button>`)}
function chooseVariableSource(){const a=templateItems('variables');sheet(`<h2>Add Trackable Variable</h2><p class="muted">Variables stay Component-specific. Start from a reusable template or create one just for this Component.</p>${a.length?`<button class="btn full" onclick="chooseExistingTemplate('variables')">CHOOSE EXISTING TEMPLATE</button>`:''}<button class="btn full secondary" style="margin-top:10px" onclick="openVariableForm()">CREATE NEW</button>`)}
function templateSummary(kind,x){if(kind==='tools')return x.type==='list'?`Random from ${(x.values||[]).length} custom choices · ${x.valueMode==='noRepeat'?'No repeats':'Repeats allowed'}`:x.type==='timer'?`${x.min}–${x.max} ${x.units||'seconds'}`:`${x.numberName||'Number'} ${x.min}–${x.max}${x.secondName?' + '+x.secondName:''}`;return `${variableTypeLabel(x)}${x.repeatable?' · Repeatable':''}`}
function chooseExistingTemplate(kind){const a=templateItems(kind);sheet(`<h2>Choose ${kind==='tools'?'Training Tool':'Trackable Variable'} Template</h2><p class="muted">This adds a Component-specific copy. You can edit this Component without changing the reusable template.</p>${a.map(x=>`<button class="btn full secondary" style="margin-top:8px;text-align:left" onclick="attachTemplate('${kind}','${x.id}')"><b>${esc(x.name)}</b><div class="tiny muted">${esc(templateSummary(kind,x))}</div></button>`).join('')}<button class="btn ghost full" style="margin-top:10px" onclick="${kind==='tools'?'chooseToolSource()':'chooseVariableSource()'}">BACK</button>`)}
function attachTemplate(kind,id){const t=templateItems(kind).find(x=>x.id===id);if(!t)return;const c=component(nav.builder.exerciseId,nav.builder.componentId);if(kind==='tools'){c.tools=c.tools||[];c.tools.push(cloneForComponent(t))}else{c.trackableVariables=c.trackableVariables||[];c.trackableVariables.push(cloneForComponent(t))}save();closeSheet();render();toast(`${kind==='tools'?'Training tool':'Trackable variable'} attached ✓`)}
function saveCurrentAsTemplate(kind,id){const c=component(nav.builder.exerciseId,nav.builder.componentId),src=kind==='tools'?(c.tools||[]).find(x=>x.id===id):(c.trackableVariables||[]).find(x=>x.id===id);if(!src)return;const a=templateItems(kind);if(a.some(x=>x.name.trim().toLowerCase()===src.name.trim().toLowerCase())){alert('A reusable template with that name already exists.');return}const t=JSON.parse(JSON.stringify(src));t.id=uid();a.push(t);save();toast('Saved as reusable template ✓')}
function openTemplateManager(kind){const a=templateItems(kind);sheet(`${kind==='tools'?`<button class="btn full" style="margin-bottom:12px" onclick="openSequenceManager()">🐾 RANDOM SEQUENCE BUILDER</button>`:''}<h2>${kind==='tools'?'Training Tools · Library':'Trackable Variable Templates'}</h2><p class="muted">${kind==='tools'?'Create a tool once, then assign it to all training, selected exercises, or selected components. No curriculum editing needed.':'Reusable variable templates.'}</p>${a.length?a.map(x=>`<div class="listrow" style="align-items:flex-start"><div class="grow"><b>${esc(x.name)}</b><div class="tiny muted">${esc(templateSummary(kind,x))}</div>${kind==='tools'?`<div class="tiny" style="color:#204d3b;margin-top:5px">${esc(toolAssignmentLabel(x))}</div>`:''}</div><div style="display:flex;gap:5px;flex-wrap:wrap">${kind==='tools'?`<button class="btn small" onclick="openToolAssignments('${x.id}')">ASSIGN</button>`:''}<button class="btn small secondary" onclick="openStandaloneTemplate('${kind}','${x.id}')">EDIT</button><button class="btn small danger" onclick="deleteTemplate('${kind}','${x.id}')">DELETE</button></div></div>`).join(''):'<div class="empty">No tools saved yet.</div>'}<button class="btn full" onclick="openStandaloneTemplate('${kind}')">+ ADD ${kind==='tools'?'TRAINING TOOL':'VARIABLE'} TEMPLATE</button><button class="btn secondary full" style="margin-top:8px" onclick="closeSheet()">DONE</button>`)}

function sequencePools(){state.libraries=state.libraries||{};return state.libraries.sequencePools=Array.isArray(state.libraries.sequencePools)?state.libraries.sequencePools:[]}
function openSequenceManager(){sheet(`<h2>🐾 Random Sequence Builder</h2><p class="muted">Save exercise pools and generate random-length obedience chains.</p>${sequencePools().map(p=>`<div class="listrow"><div class="grow"><b>${esc(p.name)}</b><div class="tiny muted">${p.items.length} choices · ${p.minCount}–${p.maxCount} actions</div></div><button class="btn small" onclick="runSequence('${p.id}')">RUN</button><button class="btn small secondary" onclick="editSequence('${p.id}')">EDIT</button><button class="btn small danger" onclick="deleteSequence('${p.id}')">×</button></div>`).join('')}<button class="btn full" style="margin-top:12px" onclick="editSequence()">+ NEW SEQUENCE POOL</button><button class="btn secondary full" style="margin-top:8px" onclick="openTemplateManager('tools')">BACK TO TOOLS</button>`)}
function editSequence(id){const p=sequencePools().find(x=>x.id===id);sheet(`<h2>${p?'Edit':'New'} Sequence Pool</h2><div class="field"><label>Pool name</label><input id="seqName" value="${esc(p?.name||'BU obedience')}"></div><div class="field"><label>Exercises — one per line</label><textarea id="seqItems" style="min-height:210px" placeholder="Heel | 5-20 | steps&#10;Right turn&#10;Stop&#10;Down in motion">${esc((p?.items||[]).map(x=>x.name+(x.min!=null?' | '+x.min+'-'+x.max+' | '+(x.unit||'steps'):'')).join('\n'))}</textarea><div class="tiny muted">Random steps: Heel | 5-20 | steps. Fixed action: Right turn. One action per line.</div></div><div class="field"><label>Random heel steps — minimum</label><input id="seqHeelMin" type="number" min="1" max="1000" value="${p?.heelMin??5}"></div><div class="field"><label>Random heel steps — maximum</label><input id="seqHeelMax" type="number" min="1" max="1000" value="${p?.heelMax??20}"></div><div class="tiny muted">Any plain “Heel” entry gets a fresh random step count each time. A custom range like Heel | 10-15 | steps overrides this.</div><div class="field"><label>Minimum actions per sequence</label><input id="seqMin" type="number" min="1" max="100" value="${p?.minCount||3}"></div><div class="field"><label>Maximum actions per sequence</label><input id="seqMax" type="number" min="1" max="100" value="${p?.maxCount||6}"></div><button class="btn full" onclick="saveSequence('${id||''}')">SAVE POOL & GENERATE</button><button class="btn secondary full" style="margin-top:8px" onclick="openSequenceManager()">CANCEL</button>`)}
function saveSequence(id){const name=val('seqName'),minCount=Number(val('seqMin')),maxCount=Number(val('seqMax')),heelMin=Number(val('seqHeelMin')),heelMax=Number(val('seqHeelMax')),lines=(document.getElementById('seqItems')?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!name||!lines.length||!Number.isInteger(minCount)||!Number.isInteger(maxCount)||minCount<1||maxCount<minCount||maxCount>100||!Number.isInteger(heelMin)||!Number.isInteger(heelMax)||heelMin<1||heelMax<heelMin||heelMax>1000){alert('Enter a name, exercises, and valid sequence length (1–100).');return}const items=[];for(const line of lines){const parts=line.split('|').map(x=>x.trim());if(!parts[0]){alert('Each exercise needs a name.');return}let item={name:parts[0]};if(parts.length>1&&parts[1]){const m=parts[1].match(/^(\d+)\s*[-–]\s*(\d+)$/);if(!m||Number(m[1])>Number(m[2])){alert('Use a range like 5-20 for '+parts[0]);return}item={name:parts[0],min:Number(m[1]),max:Number(m[2]),unit:parts[2]||'steps'}}items.push(item)}const pools=sequencePools(),p={id:id||uid(),name,items,minCount,maxCount,heelMin,heelMax},i=pools.findIndex(x=>x.id===id);if(i>=0)pools[i]=p;else pools.push(p);save();runSequence(p.id)}
function runSequence(id){const p=sequencePools().find(x=>x.id===id);if(!p||!p.items.length)return;const n=p.minCount+Math.floor(Math.random()*(p.maxCount-p.minCount+1)),out=[];let prev=-1;for(let i=0;i<n;i++){const eligible=p.items.map((x,j)=>j).filter(j=>p.items.length===1||p.items[j].name!==p.items[prev]?.name),choices=eligible.length?eligible:p.items.map((x,j)=>j),j=choices[Math.floor(Math.random()*choices.length)],item=p.items[j],count=item.min!=null?` — ${item.min+Math.floor(Math.random()*(item.max-item.min+1))} ${item.unit}`:/^heel$/i.test(item.name.trim())?` — ${(p.heelMin??5)+Math.floor(Math.random()*((p.heelMax??20)-(p.heelMin??5)+1))} steps`:'';out.push(item.name+count);prev=j}window.fwLastSequence=out;sheet(`<h2>🐾 ${esc(p.name)}</h2><div class="tiny muted">${n} randomly selected actions</div><div style="background:#f7f0df;border:1px solid #d4c4a4;border-radius:12px;padding:12px;margin:12px 0">${out.map((x,i)=>`<div style="padding:10px 3px;border-bottom:1px solid #dfd4bd;font-size:17px;font-weight:800;color:#173d2c">${i+1}. ${esc(x)}</div>`).join('')}</div><button class="btn full" onclick="runSequence('${id}')">🎲 GENERATE AGAIN</button><button class="btn secondary full" style="margin-top:8px" onclick="copySequence()">COPY SEQUENCE</button><button class="btn secondary full" style="margin-top:8px" onclick="openSequenceManager()">BACK TO POOLS</button>`)}
function copySequence(){const txt=(window.fwLastSequence||[]).map((x,i)=>`${i+1}. ${x}`).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Sequence copied ✓')).catch(()=>prompt('Copy sequence:',txt));else prompt('Copy sequence:',txt)}
function deleteSequence(id){if(!confirm('Delete this sequence pool?'))return;state.libraries.sequencePools=sequencePools().filter(x=>x.id!==id);save();openSequenceManager()}

function liveTools(s){const tools=effectiveTrainingTools(s.exerciseId,s.componentId);if(!tools.length)return '';return `<div class="card"><div class="kicker">TRAINING TOOLS</div>${tools.map(t=>t.type==='timer'?`<div class="listrow"><div class="grow"><b>⏱ ${esc(t.name)}</b><div class="tiny muted">${t.min}–${t.max} ${t.units}</div><div id="toolout-${t.id}" class="lime" style="font-size:22px;font-weight:900;margin-top:5px"></div></div><button class="btn small" onclick="generateTimer('${t.id}')">GENERATE</button></div>`:`<div><b>🎲 ${esc(t.name)}</b>${t.type==='random'?`<div class="tiny" style="margin:8px 0 4px;font-weight:800;color:#244d3b">DISTANCE / NUMBER REPEATS</div><select style="width:100%;font-size:16px;padding:10px;border-radius:9px;background:#fffdf7;color:#173d2c" onchange="fwSetRandomNumberRepeat('${t.id}',this.value)"><option value="noRepeat" ${fwRandomNumberMode(t)==='noRepeat'?'selected':''}>NO REPEATED DISTANCES / NUMBERS</option><option value="random" ${fwRandomNumberMode(t)==='random'?'selected':''}>ALLOW REPEATS</option></select>`:''}<div class="tiny" style="margin:8px 0 4px;font-weight:800;color:#244d3b">${t.type==='list'?'LIST REPEATS':'ARTICLE / SECOND VARIABLE REPEATS'}</div><select aria-label="Repeat setting for ${esc(t.name)}" style="width:100%;font-size:16px;padding:10px;border-radius:9px;background:#fffdf7;color:#173d2c" onchange="fwSetRandomRepeat('${t.id}',this.value)"><option value="noRepeat" ${fwRandomRepeatMode(t)==='noRepeat'?'selected':''}>NO REPEATS · use every choice first</option><option value="random" ${fwRandomRepeatMode(t)==='random'?'selected':''}>ALLOW REPEATS</option></select><div id="toolout-${t.id}" class="fwFieldResults" aria-live="polite"></div><button class="btn small" onclick="generateRandom('${t.id}')">GENERATE</button></div>`).join('')}</div>`}
function findTool(id){return effectiveTrainingTools(nav.session.exerciseId,nav.session.componentId).find(x=>x.id===id)}
function generateTimer(id){const t=findTool(id),n=Math.floor(Math.random()*(t.max-t.min+1))+t.min,sec=t.units==='minutes'?n*60:n;const el=document.getElementById('toolout-'+id);el.dataset.seconds=sec;el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;el.innerHTML+=` <button class="btn small secondary" onclick="startCountdown('${id}')">START</button>`}
const timers={};function startCountdown(id){clearInterval(timers[id]);const el=document.getElementById('toolout-'+id);let n=Number(el.dataset.seconds||0);timers[id]=setInterval(()=>{n--;const el=document.getElementById('toolout-'+id);if(!el){clearInterval(timers[id]);return}el.dataset.seconds=n;el.firstChild.textContent=`${Math.floor(Math.max(0,n)/60)}:${String(Math.max(0,n)%60).padStart(2,'0')} `;if(n<=0){clearInterval(timers[id]);navigator.vibrate?.(200)}},1000)}
function fwBigRandomResults(out){
 return out.map(x=>{
  const parts=String(x).split(' → ');
  return `<div class="fwFieldResult" role="status"><div class="fwFieldNumber">${esc(parts[0])}</div>${parts.length>1?`<div class="fwFieldArticle">${esc(parts.slice(1).join(' → '))}</div>`:''}</div>`;
 }).join('');
}
function fwRandomRepeatMode(t){
 const override=nav.session?.fwToolRepeatOverrides?.[t.id];
 if(override)return override;
 // An explicit saved configuration takes precedence; older unconfigured two-variable tools default to no repeats.
 return t.valueMode==='random'||t.valueMode==='noRepeat'?t.valueMode:'noRepeat';
}
function fwRandomNumberMode(t){return nav.session?.fwToolNumberOverrides?.[t.id]||t.numberMode||'random'}
function fwSetRandomNumberRepeat(id,mode){if(!nav.session)return;nav.session.fwToolNumberOverrides=nav.session.fwToolNumberOverrides||{};nav.session.fwToolNumberOverrides[id]=mode}
function fwSetRandomRepeat(id,mode){
 if(!nav.session)return;
 nav.session.fwToolRepeatOverrides=nav.session.fwToolRepeatOverrides||{};
 nav.session.fwToolRepeatOverrides[id]=mode;
}
function generateRandom(id){
 const t=findTool(id);if(!t)return;
 if(t.type==='list'){
  const vals=[...new Set((t.values||[]).map(v=>String(v).trim()).filter(Boolean))],count=Math.max(1,Number(t.count)||1);
  if(!vals.length){alert('This list has no choices.');return}
  const key='fwListRandom_'+id;
  const memory=nav.session||(nav.session={});
  memory.toolDrawBags=memory.toolDrawBags||{};
  const out=[];
  for(let i=0;i<count;i++){
   let pick;
   if(fwRandomRepeatMode(t)==='noRepeat'){
    let bag=memory.toolDrawBags[key];
    if(!Array.isArray(bag)||!bag.length||bag.some(v=>!vals.includes(v))){
     bag=[...vals];
     // Avoid immediate repeat when reshuffling if there is more than one choice.
     const previous=memory.toolLastDraw?.[key];
     if(vals.length>1&&previous)bag=bag.filter(v=>v!==previous).concat(previous);
     memory.toolDrawBags[key]=bag;
    }
    const n=(bag.length===vals.length&&vals.length>1&&memory.toolLastDraw?.[key])?Math.floor(Math.random()*(bag.length-1)):Math.floor(Math.random()*bag.length);
    pick=bag.splice(n,1)[0];
   }else pick=vals[Math.floor(Math.random()*vals.length)];
   out.push(pick);
   memory.toolLastDraw=memory.toolLastDraw||{};memory.toolLastDraw[key]=pick;
  }
  const el=document.getElementById('toolout-'+id);
  if(el)el.innerHTML=fwBigRandomResults(out);
  return;
 }
 const count=Math.max(1,Number(t.count)||1),min=Math.ceil(Number(t.min)),max=Math.floor(Number(t.max));
 if(!Number.isFinite(min)||!Number.isFinite(max)||max<min){alert('Check the first variable range.');return}
 const vals=[...new Set((t.values||[]).map(v=>String(v).trim()).filter(Boolean))];
 
 
 const numberMode=fwRandomNumberMode(t);
 let numbers=numberMode==='noRepeat'?Array.from({length:max-min+1},(_,i)=>min+i):[];
 const secondMode=fwRandomRepeatMode(t);
 let seconds=secondMode==='noRepeat'?[...vals]:[];
 const draw=(arr)=>{const i=Math.floor(Math.random()*arr.length);return arr.splice(i,1)[0]};
 const out=[];
 for(let i=0;i<count;i++){
  const n=numberMode==='noRepeat'?(numbers.length?draw(numbers):(numbers=Array.from({length:max-min+1},(_,j)=>min+j),draw(numbers))):Math.floor(Math.random()*(max-min+1))+min;
  const hasSecond=!!(t.secondName&&vals.length);
  const second=hasSecond?(secondMode==='noRepeat'?(seconds.length?draw(seconds):(seconds=[...vals],draw(seconds))):vals[Math.floor(Math.random()*vals.length)]):'';
  out.push(hasSecond?`${n} ${t.numberName||'Steps'} → ${second}`:`${n} ${t.numberName||'Steps'}`);
 }
 const el=document.getElementById('toolout-'+id);if(el)el.innerHTML=fwBigRandomResults(out);
}

function exitSession(){if(!nav.session){show('trainScreen');return}preserveLiveNote();const hasWork=!!((nav.session.note||'').trim()||(nav.session.reps||[]).length||(nav.session.interferences||[]).length||sessionCoffee(nav.session));if(!hasWork){nav.session=null;nav.training=null;show('trainScreen');return}sheet(`<h2>Leave this session?</h2><p class="muted">You have unsaved session work.</p><button class="btn full" onclick="closeSheet()">KEEP SESSION</button><button class="btn danger full" style="margin-top:9px" onclick="discardSession()">DISCARD SESSION</button>`)}

function addTrainingRecord(){preserveLiveNote();const s=nav.session,vars=component(s.exerciseId,s.componentId)?.trackableVariables||[],values={};vars.forEach(v=>{if(v.multiSelect){const selected=[...document.querySelectorAll('.recordMulti')].filter(el=>el.dataset.var===v.id&&el.checked).map(el=>el.value);if(selected.length)values[v.name]=selected;return}const el=document.getElementById(`var_${v.id}`);if(!el)return;const value=v.type==='boolean'?el.checked:el.value;if(value!==''&&value!==false)values[v.name]=v.type==='number'?Number(value):value});s.reps.push({id:uid(),values,at:new Date().toISOString()});renderLive();toast('Record saved ✓')}

function fwDiscoverPairs(rows,catalog){

  if(i===j)continue;
  const a=ids[i],b=ids[j],ca=catalog.find(x=>x.id===a),cb=catalog.find(x=>x.id===b);
  if(!ca||!cb)continue;
  const paired=rows.filter(r=>r.date&&/^\\d{4}-\\d{2}-\\d{2}$/.test(r.date)&&fwHasObservation(r,a)&&fwHasObservation(r,b));
  if(paired.length<8||new Set(paired.map(r=>r.date)).size<3)continue;
  const aValues=[...new Set(paired.flatMap(r=>fwAnswers(r.values[a])))],bValues=[...new Set(paired.flatMap(r=>fwAnswers(r.values[b])))];
  for(const av of aValues)for(const bv of bValues){
   const yes=paired.filter(r=>fwHasAnswer(r,a,av)),no=paired.filter(r=>!fwHasAnswer(r,a,av));
   if(yes.length<3||no.length<3)continue;
   if(new Set(yes.map(r=>r.date)).size<2||new Set(no.map(r=>r.date)).size<2)continue;
   const y=yes.filter(r=>fwHasAnswer(r,b,bv)).length,n=no.filter(r=>fwHasAnswer(r,b,bv)).length;
   const r1=y/yes.length,r0=n/no.length,diff=Math.abs(r1-r0);
   if(diff<.25)continue;
   // Keep only the strongest direction for each observation-answer pairing.
   const key=[a,bv,b].join('|');
   const entry={a,av,b,bv,yes:yes.length,no:no.length,y,n,diff,dates:new Set(paired.map(r=>r.date)).size,paired:paired.length};
   if(!counts[key]||counts[key].diff<diff)counts[key]=entry;
  }
 }

}

 const overall=(s.unifiedObservations||[]).map((r,i)=>`<div class="listrow"><div class="grow"><b>${esc(r.subject==='handler'?'Handler':'Java')} · ${esc(r.category)} · ${esc(r.name)}</b><div class="tiny muted">${esc(r.trend||'steady')}${r.detail?' · '+esc(r.detail):''}</div></div><button class="btn small secondary" onclick="fwRemoveUnified(${i})">REMOVE</button></div>`).join('');
 return `<div class="card" style="border:2px solid #e89bb9;background:#fff9fc"><div class="kicker">🩷 ONE PLACE · RECORD OBSERVATIONS</div><p class="tiny muted">Record Java and Handler together for each rep, or choose Overall Session for something that applied to the whole session. No other recording screen.</p>
 <div class="seg" style="margin:10px 0"><button class="btn ${mode==='rep'?'':'secondary'}" onclick="fwRecordMode('rep')">REPS</button><button class="btn ${mode==='overall'?'':'secondary'}" onclick="fwRecordMode('overall')">OVERALL SESSION</button></div>
 ${mode==='rep'?`<div class="kicker">${s.fwEditingRepIndex!==undefined?'EDIT REP '+(s.fwEditingRepIndex+1):'REP '+(reps.length+1)}</div><p class="tiny muted">Add as many observations as you want to this rep, then save the rep. Your two-variable comparison uses answers saved together here.</p>`:'<p class="tiny muted">An observation about the session overall, not a particular rep.</p>'}
 <div class="seg" style="margin:10px 0"><button class="btn ${subject==='dog'?'':'secondary'}" onclick="fwObsSubject('dog')">🐕 JAVA</button><button class="btn ${subject==='handler'?'':'secondary'}" onclick="fwObsSubject('handler')">👤 HANDLER</button></div>
 <div class="tiny muted">WHAT ARE YOU OBSERVING?</div><select id="fwObsCategorySelect" style="width:100%;box-sizing:border-box;margin:5px 0 12px" onchange="fwObsChooseCategory(this.value)"><option value="">Choose...</option>${catalog.map(x=>`<option value="${esc(x.id)}" ${selected?.id===x.id?'selected':''}>${esc(x.category||x.name)}</option>`).join('')}</select>
 <div class="tiny muted">WHAT DID YOU SEE?</div><select id="fwObsChoice" style="width:100%;box-sizing:border-box;margin:5px 0 12px" onchange="fwObsChooseAnswer(this.value)"><option value="">Choose...</option>${(selected?.choices||[]).map(v=>`<option value="${esc(v)}" ${s.fwObsName===v?'selected':''}>${esc(v)}</option>`).join('')}</select>
 ${mode==='overall'?`<div class="tiny muted" style="margin-bottom:7px">DIRECTION OF CHANGE (OPTIONAL)</div><div class="seg" style="display:flex;gap:5px;flex-wrap:wrap">${[['improving','↗ Improving'],['steady','→ Holding Steady'],['declining','↘ Declining']].map(([v,l])=>`<button class="btn small ${s.fwObsTrend===v?'':'secondary'}" onclick="fwObsTrend('${v}')">${l}</button>`).join('')}</div><textarea id="fwObsDetail" style="min-height:58px;width:100%;box-sizing:border-box;margin-top:12px" placeholder="Optional details">${esc(s.fwObsDetail||'')}</textarea><button class="btn full" onclick="fwAddUnified()">+ SAVE OBSERVATION</button>${overall}`:`<button class="btn full secondary" onclick="fwAddToRep()">+ ADD OBSERVATION TO THIS REP</button><div style="margin-top:12px">${labels.length?labels.map(x=>`<div class="tiny" style="padding:5px 0">✓ ${esc(x)}</div>`).join(''):'<p class="tiny muted">No observations added to this rep yet.</p>'}</div><button class="btn full" style="margin-top:9px" onclick="fwSaveRecordRep()">${s.fwEditingRepIndex!==undefined?'SAVE REP CHANGES':'+ SAVE REP '+(reps.length+1)}</button><div class="kicker" style="margin-top:18px">RECORDED REPS · ${reps.length}</div>${saved||'<p class="tiny muted">No reps saved yet.</p>'}`}
 <button class="btn small secondary" style="margin-top:12px" onclick="fwCatalogManager()">EDIT OBSERVATIONS IN LIBRARY</button></div>`;
}
function fwRecordMode(v){syncSummaryFields();nav.session.fwRecordMode=v;renderSummary()}
function fwAddToRep(){syncSummaryFields();const s=nav.session;if(!s.fwObsCategoryId||!s.fwObsName){alert('Choose what you observed and what you saw.');return}s.fwRepDraft=s.fwRepDraft||{};const old=fwAnswers(s.fwRepDraft[s.fwObsCategoryId]);if(old.includes(s.fwObsName)){toast('Already added to this rep');return}old.push(s.fwObsName);s.fwRepDraft[s.fwObsCategoryId]=old;s.fwObsName='';renderSummary();toast('Added to this rep ✓')}
function fwSaveRecordRep(){syncSummaryFields();const s=nav.session;if(!Object.keys(s.fwRepDraft||{}).length){alert('Add at least one observation to this rep.');return}s.fwObservationReps=s.fwObservationReps||[];const row={id:uid(),values:{...s.fwRepDraft},recordedAt:new Date().toISOString()};if(s.fwEditingRepIndex!==undefined){const old=s.fwObservationReps[s.fwEditingRepIndex];row.id=old?.id||row.id;s.fwObservationReps[s.fwEditingRepIndex]=row}else s.fwObservationReps.push(row);delete s.fwEditingRepIndex;s.fwRepDraft={};s.fwObsName='';renderSummary();toast('Rep saved · Ready for next rep ✓')}
function fwEditRecordRep(i){syncSummaryFields();const s=nav.session;if(!s.fwObservationReps?.[i])return;s.fwEditingRepIndex=i;s.fwRepDraft={...s.fwObservationReps[i].values};s.fwRecordMode='rep';renderSummary()}
function fwDeleteRecordRep(i){syncSummaryFields();const s=nav.session;if(!s.fwObservationReps?.[i]||!confirm('Delete this rep?'))return;s.fwObservationReps.splice(i,1);delete s.fwEditingRepIndex;s.fwRepDraft={};renderSummary()}

function fwObsCapture(){const s=nav.session;if(!s)return;s.fwObsDetail=document.getElementById('fwObsDetail')?.value||s.fwObsDetail||''}
function fwObsSubject(v){syncSummaryFields();fwObsCapture();const s=nav.session;s.fwObsSubject=v;s.fwObsCategory='';s.fwObsCategoryId='';s.fwObsName='';s.fwObsDetail='';renderSummary()}
function fwObsChooseCategory(id){syncSummaryFields();const s=nav.session;s.fwObsCategoryId=id;const x=fwMeasurementCatalog().find(v=>v.id===id);s.fwObsCategory=x?.category||x?.name||'';s.fwObsName='';renderSummary()}
function fwObsChooseAnswer(v){if(nav.session)nav.session.fwObsName=v}
function fwObsTrend(v){syncSummaryFields();fwObsCapture();nav.session.fwObsTrend=v;renderSummary()}
function fwAddUnified(){syncSummaryFields();fwObsCapture();const s=nav.session,name=(s.fwObsName||'').trim(),category=(s.fwObsCategory||'').trim();if(!name){alert('Enter what you observed first.');return}if(!category){alert('Choose or enter a category first.');return}const subject=s.fwObsSubject==='handler'?'handler':'dog',trend=s.fwObsTrend||'steady';s.unifiedObservations=s.unifiedObservations||[];s.unifiedObservations.push({subject,category,name,catalogId:s.fwObsCategoryId||'',trend,detail:(s.fwObsDetail||'').trim(),recordedAt:new Date().toISOString()});
 // Existing Progress → Patterns uses these fields. Only clear directional judgments are bridged.
 const field=subject==='handler'?(trend==='improving'?'handlerHelped':trend==='declining'?'handlerHurt':null):(trend==='improving'?'trainingProgress':trend==='declining'?'trainingSetbacks':null);
 if(field){s[field]=s[field]||[];if(!s[field].includes(name))s[field].push(name)}
 s.fwObsName='';s.fwObsDetail='';renderSummary()}
function fwRemoveUnified(i){syncSummaryFields();fwObsCapture();const s=nav.session,r=s.unifiedObservations?.[i];if(!r)return;s.unifiedObservations.splice(i,1);const field=r.subject==='handler'?(r.trend==='improving'?'handlerHelped':r.trend==='declining'?'handlerHurt':null):(r.trend==='improving'?'trainingProgress':r.trend==='declining'?'trainingSetbacks':null);if(field&&!s.unifiedObservations.some(x=>x.subject===r.subject&&x.trend===r.trend&&x.name===r.name))s[field]=(s[field]||[]).filter(x=>x!==r.name);renderSummary()}
function renderSummary(){const s=nav.session;if(!s)return;const toolOutputs=[...document.querySelectorAll('[id^=toolout-]')].map(el=>({id:el.id,html:el.innerHTML,seconds:el.dataset.seconds}));const rec=progressionRecommendation(s),cur=step(s.exerciseId,s.componentId,s.stepId),ps=proposedStep(s),ints=interferenceItems(),curN=stepNumber(s.exerciseId,s.componentId,s.stepId),psN=ps?stepNumber(s.exerciseId,s.componentId,ps.id):curN;
 document.getElementById('summaryScreen').innerHTML=`<div class="topbar"><button class="exitSessionBtn" onclick="exitSession()">← EXIT</button><div class="grow"><div class="eyebrow">RECORD SESSION</div><div class="title">${esc(s.exerciseName)} — ${esc(s.componentName)}</div><div class="subtitle">Step ${curN} · ${esc(s.sessionTime||'')}</div></div></div>
 ${fwFold('recordTools','🎲 TRAINING TOOLS',liveTools(s),'Timer and randomizers · run them here',true)}
 ${fwUnifiedObservations(s)}
 <div class="card"><div class="kicker">SESSION NOTES</div><textarea id="sumNotes" style="min-height:100px;width:100%;box-sizing:border-box" placeholder="Anything you want to remember…">${esc(s.note||'')}</textarea></div>
 <details class="card" ${s.uiFolds?.endExtras?'open':''} ontoggle="fwFoldChange('endExtras',this.open)"><summary style="cursor:pointer;font-weight:900">OPTIONAL · INTERFERENCES & HANDLER PERFORMANCE</summary><div class="card"><div class="kicker">INTERFERENCES</div>${ints.length?`<div class="tagGrid">${ints.map(x=>{const id=typeof x==='object'?x.id:interferenceName(x);return `<button class="tag ${(s.interferences||[]).includes(id)?'selected':''}" onclick="toggleInterference('${id}')">${esc(interferenceName(x))}</button>`}).join('')}</div>`:'<div class="empty">No interferences saved.</div>'}<button class="btn secondary full" onclick="openInterferenceManager()">MANAGE INTERFERENCES</button></div>${handlerSessionPanel(s)}</details>
 ${(s.heelReps?.length||s.reps?.length)?`<details class="card"><summary style="cursor:pointer;font-weight:800">Older recorded measurements (read-only review)</summary>${fwMeasuredObservationPanel({...s,fwObservationReps:[]})}</details>`:''}
 <div class="card" style="border:2px solid #d88aa0;background:#fff3f6"><div class="kicker">☕ COFFEE EVALUATION</div><p class="tiny muted">Compare Java’s performance with the criteria already defined for this step. The main requirement must be met for The God Shot or The Daily Driver. No scoring or mistake counting.</p><div class="coffeeGrid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${outcomes.map(o=>`<button class="coffee ${sessionCoffee(s)===o[0]?'selected':''}" style="font-size:12px;line-height:1.35;min-height:88px" onclick="setSessionCoffee('${o[0]}')"><img src="${fwCoffeeArt[o[0]]}" alt="" style="display:block;width:100%;height:105px;object-fit:contain;margin:0 auto 7px">${o[2]}</button>`).join('')}</div>${fwCoffeeInfo[sessionCoffee(s)]?`<div style="background:#fffdf8;border:1px solid #d6c5bb;border-radius:13px;padding:12px;color:#243d30"><b>${esc(fwCoffeeInfo[sessionCoffee(s)].decision)}</b><p style="margin:7px 0;font-style:italic">${esc(fwCoffeeInfo[sessionCoffee(s)].story)}</p><p style="margin:7px 0">${esc(fwCoffeeInfo[sessionCoffee(s)].meaning)}</p></div>`:''}</div>
 <div class="card" style="border:2px solid #d88aa0"><div class="kicker">FIELDWORK RECOMMENDS</div><h3>${esc(rec.action)}</h3><p>${esc(rec.text)}</p>${stepSnapshot('YOU TRAINED',cur,s.exerciseId,s.componentId,'summary')}<div class="center kicker" style="font-size:14px;margin:12px 0">${esc(rec.direction)}</div>${stepSnapshot('RECOMMENDED NEXT STEP',ps,s.exerciseId,s.componentId,'summary')}</div>
 <div class="card"><div class="kicker">YOU CHOOSE · SAVE SESSION</div><p class="tiny muted">Your coffee suggests a training decision; you decide the next step. Nothing advances automatically.</p><div class="decisionGrid" style="margin-top:10px"><button class="btn secondary" onclick="saveDecision('Repeat','${cur?.id||s.stepId}')">STAY ON STEP ${curN}</button><button class="btn secondary" onclick="chooseRelativeStep(1)">GO TO NEXT STEP</button><button class="btn secondary" onclick="chooseRelativeStep(-1)">GO BACK ONE STEP</button><button class="btn secondary" onclick="chooseDifferentStep()">CHOOSE DIFFERENT STEP</button></div></div>`;toolOutputs.forEach(x=>{const el=document.getElementById(x.id);if(el){el.innerHTML=x.html;if(x.seconds!==undefined)el.dataset.seconds=x.seconds}})}

function syncSummaryFields(){if(!nav.session)return;fwObsCapture();const n=document.getElementById('sumNotes');if(n)nav.session.note=n.value;const h=nav.session.handlerPerformance||(nav.session.handlerPerformance={});const l=document.getElementById('handlerLearning'),c=document.getElementById('handlerCustom');if(l)h.learning=l.value;if(c)h.custom=c.value}
function acceptProposal(){syncSummaryFields();const s=nav.session,ps=proposedStep(s);if(!ps){saveDecision('Repeat');return}saveDecision('FIELDWORK Proposal',ps.id)}
function toggleInterference(id){syncSummaryFields();const a=nav.session.interferences||(nav.session.interferences=[]),i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);renderSummary()}
function chooseRelativeStep(offset){syncSummaryFields();const s=nav.session,c=component(s.exerciseId,s.componentId),idx=c.steps.findIndex(x=>x.id===s.stepId),ni=Math.max(0,Math.min(c.steps.length-1,idx+offset)),target=c.steps[ni];if(target)saveDecision(offset<0?'Step Back':'Advance',target.id)}
function saveDecision(decision,chosenStepId=null){syncSummaryFields();const s=nav.session;if(Object.keys(s.fwRepDraft||{}).length&&!confirm('You have observations in an unsaved rep. Save session without this rep?'))return;if(!sessionCoffee(s)){alert('Choose one overall Session Coffee result before saving.');return}const c=component(s.exerciseId,s.componentId),idx=c.steps.findIndex(x=>x.id===s.stepId);let next=s.stepId;if(chosenStepId)next=chosenStepId;else if(decision==='Advance'&&idx<c.steps.length-1)next=c.steps[idx+1].id;else if(decision==='Step Back'&&idx>0)next=c.steps[idx-1].id;const historical=!!s.sessionDate&&s.sessionDate<localDateKey();if(!historical)c.currentStepId=next;s.historicalEntry=historical;s.decision=decision;s.resultingStepId=next;s.savedAt=new Date().toISOString();state.sessions.push({...s});if(!historical)state.todayItems=(state.todayItems||[]).filter(x=>!(x.exerciseId===s.exerciseId&&x.componentId===s.componentId));save();nav.session=null;nav.training=null;show('homeScreen');toast(`Saved. ${c.name} history + coverage updated.`)}
function chooseDifferentStep(){syncSummaryFields();const s=nav.session,c=component(s.exerciseId,s.componentId);sheet(`<h2>Choose ${esc(c.name)} step</h2>${c.steps.map((x,i)=>`<div class="listrow ${c.currentStepId===x.id?'current':''}" style="align-items:flex-start"><div class="num">${i+1}</div><div class="grow"><b>${esc(x.name)}</b><div class="tiny muted" style="margin-top:5px"><b>Today’s Job:</b> ${esc(stepJob(x))}</div><button class="linkish tiny" style="margin-top:7px" onclick="openStepDetails('${s.exerciseId}','${s.componentId}','${x.id}','summary')">DETAILS ›</button></div><button class="btn small" onclick="closeSheet();saveDecision('Choose Different Step','${x.id}')">CHOOSE</button></div>`).join('')}`)}
function sheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeSheet(){document.getElementById('modal').classList.remove('show')}
function val(id){return document.getElementById(id)?.value.trim()||''}
function exportBackup(){state.settings.lastBackupAt=new Date().toISOString();save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`FIELDWORK-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function toast(msg){const d=document.createElement('div');d.textContent=msg;Object.assign(d.style,{position:'fixed',left:'50%',bottom:'92px',transform:'translateX(-50%)',background:'#234d38',color:'#fffaf0',padding:'10px 14px',borderRadius:'999px',fontWeight:'900',fontSize:'12px',zIndex:99});document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>show(b.dataset.screen));
document.getElementById('builderScreen').addEventListener('click',e=>{const g=e.target.closest('.js-open-goal');if(g){openGoal(g.dataset.goalId);return}const ex=e.target.closest('.js-open-exercise');if(ex){openExercise(ex.dataset.exerciseId);return}const c=e.target.closest('.js-open-component');if(c){openComponent(c.dataset.componentId);return}});
document.getElementById('photoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.dog.photo=r.result;save();renderHome()};r.readAsDataURL(f)});
document.getElementById('restoreInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);if(!raw.version||!Array.isArray(raw.goals))throw 0;const x=migrate(raw);const gc=x.goals.length,ec=x.exercises.length,cc=x.exercises.reduce((n,e)=>n+e.components.length,0),sc=x.exercises.reduce((n,e)=>n+e.components.reduce((m,c)=>m+c.steps.length,0),0);if(!confirm(`Restore this backup?\n\n${gc} goals · ${ec} exercises · ${cc} components · ${sc} steps\n\nCurrent data will first be preserved as an emergency recovery copy.`))return;localStorage.setItem(RECOVERY_KEY,JSON.stringify(state));state=x;save();render();show('homeScreen');toast('Backup restored and migrated ✓')}catch(_){alert('That does not look like a FIELDWORK backup.')}finally{e.target.value=''}};r.readAsText(f)});
render();
</script>
