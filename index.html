<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b100d" />
<title>FIELDWORK</title>
<style>
:root{--bg:#0a0f0c;--panel:#121b17;--panel2:#18231e;--line:#2b3a31;--lime:#c9f25b;--olive:#8fa84b;--cream:#f2ead8;--tan:#c8b894;--orange:#f29a54;--coral:#ef725e;--purple:#9a7aa5;--muted:#9eaa9f;--danger:#e56f61;--shadow:0 12px 30px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;background:#050806;color:var(--cream);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.app{max-width:520px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#0c1410,#08100c);position:relative;padding-bottom:92px}.screen{display:none;padding:18px 16px 24px}.screen.active{display:block}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:800}.title{font-size:27px;font-weight:900;letter-spacing:-.03em}.subtitle{color:var(--muted);font-size:13px;line-height:1.4}.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:900;background:var(--lime);color:#10150f;cursor:pointer;box-shadow:none}.btn.secondary{background:#202d26;color:var(--cream);border:1px solid #34483c}.btn.ghost{background:transparent;color:var(--cream);border:1px solid #3a4b40}.btn.danger{background:#3a1e1b;color:#ffd8d2;border:1px solid #70423b}.btn.small{padding:8px 10px;border-radius:9px;font-size:12px}.btn.full{width:100%;font-size:15px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1}.muted{color:var(--muted)}.lime{color:var(--lime)}.orange{color:var(--orange)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;background:#202c26;border:1px solid #34483c;color:var(--tan);font-size:11px;font-weight:800}.hero{position:relative;overflow:hidden;min-height:178px;padding:0}.hero img{width:100%;height:210px;object-fit:cover;display:block}.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,10,7,.93) 0%,rgba(6,10,7,.62) 52%,rgba(6,10,7,.12) 100%)}.hero .heroText{position:absolute;left:16px;top:18px;right:16px}.hero h1{margin:2px 0 0;font-size:34px;letter-spacing:-.04em}.hero .goal{margin-top:8px;color:#d7dfd5}.progress{height:9px;background:#26322b;border-radius:99px;overflow:hidden;margin-top:16px;width:55%}.progress i{display:block;height:100%;width:42%;background:var(--lime);border-radius:99px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin:20px 2px 10px}.sectionHead h2{margin:0;font-size:14px;letter-spacing:.08em;text-transform:uppercase}.work{display:flex;align-items:center;gap:12px}.workIcon{width:43px;height:43px;border-radius:13px;background:#243028;display:grid;place-items:center;font-size:22px}.work h3{font-size:15px;margin:0 0 4px}.work p{font-size:12px;color:var(--muted);margin:0}.work .train{margin-left:auto}.empty{text-align:center;padding:28px 16px;color:var(--muted)}.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(8,14,10,.97);border-top:1px solid #28372e;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:30;backdrop-filter:blur(14px)}.navbtn{border:0;background:transparent;color:#9aa59d;font-size:10px;font-weight:800;padding:5px 0}.navbtn b{display:block;font-size:20px;margin-bottom:2px}.navbtn.active{color:var(--lime)}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--tan);margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#0d1511;border:1px solid #33443a;border-radius:11px;padding:12px;color:var(--cream);font:inherit;outline:none}.field textarea{min-height:86px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--lime)}.stack{display:grid;gap:10px}.crumb{font-size:12px;color:var(--tan);margin-bottom:8px}.listrow{display:flex;align-items:center;gap:10px;background:#111a16;border:1px solid #2b3b31;border-radius:12px;padding:12px;margin-bottom:8px}.listrow.current{border-color:var(--lime);box-shadow:inset 3px 0 0 var(--lime)}.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:#17200f;font-weight:900;flex:0 0 auto}.icon{font-size:22px}.coffeeGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}.coffee{border:1px solid #34483c;background:#111a16;border-radius:12px;padding:10px 4px;color:var(--cream);text-align:center;font-size:10px;font-weight:800}.coffee span{display:block;font-size:24px;margin-bottom:5px}.coffee.selected{border-color:var(--lime);background:#25331f;color:var(--lime)}.tagGrid{display:flex;flex-wrap:wrap;gap:7px}.tag{border:1px solid #394a40;background:#121b17;color:#cbd4cc;border-radius:999px;padding:8px 10px;font-size:11px}.tag.selected{background:#343d24;border-color:var(--lime);color:var(--lime)}.decisionGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.statline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #28372e;font-size:13px}.notice{border-left:3px solid var(--orange);background:#241d15;padding:11px 12px;border-radius:8px;color:#ead9c7;font-size:12px;line-height:1.45}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(520px,100%);max-height:90vh;overflow:auto;background:#111a16;border:1px solid #314239;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 60px rgba(0,0,0,.4)}.sheet h2{margin:0 0 6px}.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.builderHeader{padding:13px;border-radius:13px;background:#171f1a;border:1px solid #304137;margin-bottom:10px}.builderHeader strong{display:block}.tiny{font-size:11px}.hidden{display:none!important}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg button.active{background:var(--lime);color:#10150f}.repCount{font-size:28px;font-weight:900;text-align:center;margin:16px 0 4px}.center{text-align:center}.outcomeBar{display:flex;gap:7px;flex-wrap:wrap}.outcomeChip{font-size:11px;padding:6px 8px;border-radius:999px;background:#202d26}.photoHint{position:absolute;right:10px;bottom:10px}.linkish{color:var(--lime);background:none;border:0;padding:0;font:inherit;font-weight:800;cursor:pointer}.hr{height:1px;background:#2a382f;margin:14px 0}.kicker{font-size:12px;color:var(--tan);font-weight:800}.bigCriterion{font-size:18px;line-height:1.35;margin:8px 0 14px}.sessionContext{padding:12px;border:1px solid #3a4a40;border-radius:12px;background:#0d1511;margin-bottom:12px}.sessionContext strong{display:block;font-size:17px}.safe{padding:10px 12px;border-radius:10px;background:#172518;color:#cfe6bc;font-size:12px;border:1px solid #345037}.backupRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footerNote{font-size:11px;color:#7f8c83;text-align:center;margin:18px 0}.moveBtns{margin-left:auto;display:flex;gap:4px}.moveBtns button{padding:5px 7px}.dangerText{color:#ff9a8f}@media(min-width:700px){body{padding:24px}.app{border:1px solid #2a382f;border-radius:28px;overflow:hidden;min-height:calc(100vh - 48px)}.bottomnav{bottom:24px;border-radius:0 0 28px 28px}}
</style>
</head>
<body>
<div class="app" id="app">
  <main>
    <section class="screen active" id="homeScreen"></section>
    <section class="screen" id="trainScreen"></section>
    <section class="screen" id="planScreen"></section>
    <section class="screen" id="progressScreen"></section>
    <section class="screen" id="moreScreen"></section>
    <section class="screen" id="builderScreen"></section>
    <section class="screen" id="setupScreen"></section>
    <section class="screen" id="liveScreen"></section>
    <section class="screen" id="summaryScreen"></section>
  </main>
  <nav class="bottomnav" id="bottomNav">
    <button class="navbtn active" data-screen="homeScreen"><b>⌂</b>Home</button>
    <button class="navbtn" data-screen="trainScreen"><b>⚡</b>Train</button>
    <button class="navbtn" data-screen="planScreen"><b>▣</b>Plan</button>
    <button class="navbtn" data-screen="progressScreen"><b>▥</b>Progress</button>
    <button class="navbtn" data-screen="moreScreen"><b>•••</b>More</button>
  </nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<input type="file" accept="image/*" id="photoInput" class="hidden" />
<input type="file" accept="application/json,.json" id="restoreInput" class="hidden" />
<script>
const STORAGE_KEY='fieldwork_v1_state';
const RECOVERY_KEY='fieldwork_v1_pre_restore_recovery';
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const freshState=()=>({version:2,dog:null,goals:[],exercises:[],sessions:[],weeklyPlan:{weekKey:'',entries:[]},settings:{locations:['Club Field','Backyard','Home'],reinforcers:['Toy','Food','Both','None'],rewardPositions:['Toe Position — Cameron R1'],handlerStates:['Playful','Neutral','Focused']}});
const esc=(s='')=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function normalizeMeta(x={}){x.status=x.status||'Building';x.priority=x.priority||'Normal';x.frequency=x.frequency||{mode:'weekly',value:1};if(typeof x.frequency==='number')x.frequency={mode:'weekly',value:x.frequency};return x}
function migrate(raw){if(!raw||!raw.version)return freshState();if(raw.version>=2&&Array.isArray(raw.exercises)){raw.goals=raw.goals||[];raw.exercises=raw.exercises||[];raw.sessions=raw.sessions||[];raw.weeklyPlan=raw.weeklyPlan||{weekKey:'',entries:[]};raw.settings={...freshState().settings,...(raw.settings||{})};raw.goals.forEach(g=>{g.priority=g.priority||'Secondary';g.exerciseIds=g.exerciseIds||[]});raw.exercises.forEach(e=>{normalizeMeta(e);e.criteria=e.criteria||'';e.goalIds=e.goalIds||raw.goals.filter(g=>(g.exerciseIds||[]).includes(e.id)).map(g=>g.id);e.components=e.components||[];e.components.forEach(c=>{normalizeMeta(c);c.steps=c.steps||[];c.steps.forEach(s=>{s.goal=s.goal||'';s.actions=s.actions||'';s.description=s.description||'';s.criterion=s.criterion||'';s.rule=s.rule||''});c.tools=c.tools||[]})});return raw}
 const out=freshState();out.dog=raw.dog||null;out.sessions=raw.sessions||[];out.settings={...out.settings,...(raw.settings||{})};const seen=new Map();(raw.goals||[]).forEach((og,gi)=>{const g={id:og.id||uid(),name:og.name||`Goal ${gi+1}`,finishedPicture:og.finishedPicture||'',criteria:og.criteria||'',priority:og.priority||'Secondary',exerciseIds:[]};out.goals.push(g);(og.exercises||[]).forEach(oe=>{let e=seen.get(oe.id);if(!e){e={...oe,id:oe.id||uid(),goalIds:[],components:oe.components||[]};delete e.exercises;normalizeMeta(e);e.components.forEach(c=>{normalizeMeta(c);c.steps=c.steps||[];c.steps.forEach(s=>{s.goal=s.goal||'';s.actions=s.actions||'';s.description=s.description||'';s.criterion=s.criterion||'';s.rule=s.rule||''});c.tools=c.tools||[]});out.exercises.push(e);seen.set(oe.id,e)}if(!e.goalIds.includes(g.id))e.goalIds.push(g.id);if(!g.exerciseIds.includes(e.id))g.exerciseIds.push(e.id)})});return out}
function load(){try{return migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)))}catch(e){return freshState()}}
let state=load();
let nav={screen:'homeScreen',builder:{level:'root',goalId:null,exerciseId:null,componentId:null},training:null,session:null,recordingMode:'rep'};
function save(){state.version=2;const raw=JSON.stringify(state);localStorage.setItem(STORAGE_KEY,raw);if(localStorage.getItem(STORAGE_KEY)!==raw)throw new Error('FIELDWORK could not verify saved data');return true}
save();
function goal(id){return state.goals.find(x=>x.id===id)}
function exercise(a,b){const id=b||a;return state.exercises.find(x=>x.id===id)}
function component(a,b,c){const eid=c?b:a,cid=c||b;return exercise(eid)?.components.find(x=>x.id===cid)}
function step(a,b,c,d){const eid=d?b:a,cid=d?c:b,sid=d||c;return component(eid,cid)?.steps.find(x=>x.id===sid)}
function goalsForExercise(e){return state.goals.filter(g=>(e.goalIds||[]).includes(g.id))}
function displayGoalForExercise(e,preferred){return goal(preferred)||goalsForExercise(e).sort((a,b)=>goalWeight(b.priority)-goalWeight(a.priority))[0]||state.goals[0]}
function goalWeight(p){return ({Primary:4,Secondary:3,Development:2,Parked:0})[p]??1}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');nav.screen=id;document.getElementById('bottomNav').classList.toggle('hidden',['builderScreen','setupScreen','liveScreen','summaryScreen'].includes(id));document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));render();window.scrollTo(0,0)}
function activeWork(){const rows=[];state.exercises.forEach(e=>{if(e.status==='Parked'||e.status==='Complete')return;e.components.forEach(c=>{if(c.status==='Parked'||c.status==='Complete'||!c.currentStepId)return;const s=c.steps.find(z=>z.id===c.currentStepId);const g=displayGoalForExercise(e);if(s&&g)rows.push({g,e,c,s})})});return rows}
function weekStart(d=new Date()){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x}
function weekKey(){return weekStart().toISOString().slice(0,10)}
function targetSessions(e,c){return state.sessions.filter(s=>s.exerciseId===e.id&&(!c||s.componentId===c.id)&&s.savedAt)}
function statsFor(e,c){const arr=targetSessions(e,c).sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt));const last=arr[0]?new Date(arr[0].savedAt):null;const ws=weekStart();const thisWeek=arr.filter(s=>new Date(s.savedAt)>=ws).length;const f=(c||e).frequency||{mode:'weekly',value:1};let overdue=false;if((c||e).status!=='Parked'&&(c||e).status!=='Complete'){if(f.mode==='days'){overdue=!last||((Date.now()-last.getTime())/86400000)>=Number(f.value||7)}else{const need=Math.max(0,Number(f.value||1));const elapsed=Math.max(1,(Date.now()-ws.getTime())/86400000);const spacing=7/Math.max(1,need);overdue=thisWeek<need&&(!last||((Date.now()-last.getTime())/86400000)>=spacing||elapsed>=(7*(thisWeek+1)/Math.max(1,need)))}}return {last,thisWeek,overdue}}
function fmtDate(d){return d?d.toLocaleDateString(undefined,{month:'short',day:'numeric'}):'Never'}
function freqText(x){const f=x.frequency||{mode:'weekly',value:1};return f.mode==='days'?`Every ${f.value} day${Number(f.value)===1?'':'s'}`:`${f.value}× / week`}
function currentStepText(c){return c?.steps?.find(s=>s.id===c.currentStepId)?.name||'Not set'}
function render(){renderHome();renderTrain();renderPlan();renderProgress();renderMore();if(nav.screen==='builderScreen')renderBuilder();if(nav.screen==='setupScreen')renderSetup();if(nav.screen==='liveScreen')renderLive();if(nav.screen==='summaryScreen')renderSummary()}
function renderHome(){const el=document.getElementById('homeScreen');if(!state.dog){el.innerHTML=`<div class="topbar"><div><div class="eyebrow">FIELDWORK</div><div class="title">Build once. Train from it.</div></div></div><div class="card"><div class="icon">🐕</div><h2>Create your dog</h2><button class="btn full" onclick="openDog()">CREATE DOG</button></div>`;return}const work=activeWork();const primary=state.goals.find(g=>g.priority==='Primary');el.innerHTML=`<div class="card hero">${state.dog.photo?`<img src="${state.dog.photo}" alt="${esc(state.dog.name)}">`:`<div style="height:210px;background:#172219;display:grid;place-items:center;font-size:88px">🐕</div>`}<div class="shade"></div><div class="heroText"><div class="eyebrow">FIELDWORK</div><h1>${esc(state.dog.name)}</h1><div class="goal">${primary?`Primary Goal: <b>${esc(primary.name)}</b>`:'Training Map ready'}</div></div><button class="btn small secondary photoHint" onclick="document.getElementById('photoInput').click()">${state.dog.photo?'Change photo':'Add photo'}</button></div><div class="sectionHead"><h2>Current Work</h2><button class="linkish" onclick="show('planScreen')">Plan</button></div>${work.length?work.map(workCard).join(''):`<div class="card empty">No current progression steps yet.</div>`}<button class="btn secondary full" onclick="show('trainScreen')">CHOOSE OTHER WORK</button>`}
function workCard(w){return `<div class="card work"><div class="workIcon">${w.e.icon||'🐕'}</div><div class="grow"><div class="kicker">${esc(w.e.name).toUpperCase()}</div><h3>${esc(w.c.name)} → ${esc(w.s.name)}</h3><p>${esc(w.s.criterion||'No criterion entered')}</p></div><button class="btn small train" onclick="beginTraining('${w.g.id}','${w.e.id}','${w.c.id}','${w.s.id}')">TRAIN</button></div>`}
function renderTrain(){const el=document.getElementById('trainScreen');const work=activeWork();el.innerHTML=`<div class="topbar"><div><div class="eyebrow">TRAIN</div><div class="title">Choose existing work</div><div class="subtitle">BUILD CREATES. TRAIN REFERENCES.</div></div></div>${work.length?work.map(workCard).join(''):`<div class="card empty">Build a curriculum first.</div>`}<div class="sectionHead"><h2>All Curriculum</h2></div>${state.exercises.map(e=>`<div class="card"><b>${esc(e.name)}</b><div class="tiny muted">${goalsForExercise(e).map(g=>esc(g.name)).join(' · ')||'Unlinked'}</div>${e.components.map(c=>`<div class="listrow"><div class="grow"><b>${esc(c.name)}</b><div class="tiny muted">${esc(currentStepText(c))}</div></div>${c.steps.length?`<button class="btn small secondary" onclick="pickStepForTrain('${displayGoalForExercise(e)?.id||''}','${e.id}','${c.id}')">Choose step</button>`:''}</div>`).join('')}</div>`).join('')}`}
function coverageRows(){const rows=[];state.goals.slice().sort((a,b)=>goalWeight(b.priority)-goalWeight(a.priority)).forEach(g=>{(g.exerciseIds||[]).map(id=>exercise(id)).filter(Boolean).forEach(e=>{if(e.components.length)e.components.forEach(c=>rows.push({g,e,c,stats:statsFor(e,c)}));else rows.push({g,e,c:null,stats:statsFor(e,null)})})});return rows}
function renderCoverage(){const rows=coverageRows();return `<div class="card"><div class="kicker">TRAINING MAP / COVERAGE</div><div class="tiny muted">Shared exercises appear under every linked goal. Coverage is tracked at Component level when components exist.</div></div>${state.goals.slice().sort((a,b)=>goalWeight(b.priority)-goalWeight(a.priority)).map(g=>{const rs=rows.filter(r=>r.g.id===g.id);return `<div class="card"><div class="sectionHead" style="margin:0 0 8px"><h2>${esc(g.name)}</h2><span class="outcomeChip">${esc(g.priority)}</span></div>${rs.length?rs.map(r=>`<div class="listrow" style="align-items:flex-start"><div class="grow"><b>${esc(r.e.name)}${r.c?` → ${esc(r.c.name)}`:''}</b><div class="tiny muted">${esc((r.c||r.e).status)} · ${esc((r.c||r.e).priority)} · ${esc(freqText(r.c||r.e))}</div><div class="tiny" style="margin-top:5px">Current: <b>${r.c?esc(currentStepText(r.c)):'Exercise-level'}</b></div><div class="tiny muted">Last: ${fmtDate(r.stats.last)} · This week: ${r.stats.thisWeek}</div></div>${r.stats.overdue?`<span class="outcomeChip" style="border-color:#ff9a62;color:#ffb27f">OVERDUE</span>`:''}</div>`).join(''):`<div class="empty">No exercises linked.</div>`}</div>`}).join('')}`}
function renderNeedsAttention(){const rows=coverageRows().filter(r=>{const x=r.c||r.e;return x.status==='Not Started'||r.stats.overdue});return state.goals.slice().sort((a,b)=>goalWeight(b.priority)-goalWeight(a.priority)).map(g=>{const rs=rows.filter(r=>r.g.id===g.id);return `<div class="card"><div class="sectionHead" style="margin:0 0 8px"><h3>${esc(g.name)}</h3><span class="outcomeChip">${esc(g.priority)}</span></div>${rs.length?rs.map(r=>{const x=r.c||r.e;const labels=[];if(x.status==='Not Started')labels.push('NOT STARTED');if(r.stats.overdue)labels.push('NEGLECTED / OVERDUE');return `<div class="listrow" style="align-items:flex-start"><div class="grow"><b>${esc(r.e.name)}${r.c?` → ${esc(r.c.name)}`:''}</b><div class="tiny muted">${esc(freqText(x))} · Last: ${fmtDate(r.stats.last)} · This week: ${r.stats.thisWeek}</div></div><div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">${labels.map(x=>`<span class="outcomeChip" style="border-color:#ff9a62;color:#ffb27f">${x}</span>`).join('')}</div></div>`}).join(''):`<div class="tiny muted">Nothing currently neglected or not started.</div>`}</div>`}).join('')}
function renderPlan(){ensurePlanWeek();const entries=state.weeklyPlan.entries||[];document.getElementById('planScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">PLAN</div><div class="title">Training Map + Weekly Coverage</div><div class="subtitle">PLAN SCHEDULES. HISTORY REMEMBERS.</div></div></div><button class="btn full" onclick="generateWeeklyPlan()">GENERATE / REGENERATE WEEKLY PLAN</button><div class="sectionHead"><h2>This Week</h2><span class="tiny muted">${esc(state.weeklyPlan.weekKey)}</span></div>${entries.length?entries.map(planEntryHTML).join(''):`<div class="card empty">Generate a plan from your curriculum, priorities, frequency, and training history.</div>`}<button class="btn secondary full" onclick="addPlanTarget()">+ ADD TARGET TO THIS WEEK</button><div class="sectionHead"><h2>Needs Attention</h2></div>${renderNeedsAttention()}<div class="sectionHead"><h2>Coverage</h2></div>${renderCoverage()}`}
function ensurePlanWeek(){const k=weekKey();if(!state.weeklyPlan||state.weeklyPlan.weekKey!==k){state.weeklyPlan={weekKey:k,entries:[]};save()}}
function planEntryHTML(p){const e=exercise(p.exerciseId),c=p.componentId?component(e?.id,p.componentId):null;if(!e)return '';const done=statsFor(e,c).thisWeek;return `<div class="card ${p.skipped?'muted':''}"><div class="listrow" style="padding:0"><div class="grow"><div class="kicker">${esc(e.name)}${c?` → ${esc(c.name)}`:''}</div><h3 style="margin:5px 0">${p.skipped?'SKIPPED THIS WEEK':`${p.count} target session${p.count===1?'':'s'}`}</h3><div class="tiny muted">Completed this week: ${done} · ${esc((c||e).status)} · ${esc((c||e).priority)}</div></div>${p.locked?'<span class="outcomeChip">LOCKED</span>':''}</div><div class="seg" style="margin-top:10px"><button class="btn small secondary" onclick="adjustPlan('${p.id}',-1)">−</button><button class="btn small secondary" onclick="adjustPlan('${p.id}',1)">+</button><button class="btn small secondary" onclick="togglePlanLock('${p.id}')">${p.locked?'UNLOCK':'LOCK'}</button></div><div class="seg" style="margin-top:8px"><button class="btn small secondary" onclick="boostPlan('${p.id}')">${p.boost?'HIGH THIS WEEK ✓':'INCREASE PRIORITY'}</button><button class="btn small ghost" onclick="skipPlan('${p.id}')">${p.skipped?'RESTORE':'SKIP'}</button><button class="btn small ghost" onclick="removePlan('${p.id}')">REMOVE</button></div></div>`}
function candidateTargets(){const out=[];state.exercises.forEach(e=>{const gs=goalsForExercise(e).filter(g=>g.priority!=='Parked');if(!gs.length)return;const gp=Math.max(...gs.map(g=>goalWeight(g.priority)));if(e.components.length){e.components.forEach(c=>{if(['Parked','Complete'].includes(c.status))return;out.push({e,c,gp})})}else if(!['Parked','Complete'].includes(e.status))out.push({e,c:null,gp})});return out}
function desiredThisWeek(e,c){const x=c||e,f=x.frequency||{mode:'weekly',value:1};if(f.mode==='days')return Math.max(1,Math.ceil(7/Math.max(1,Number(f.value||7))));return Math.max(0,Number(f.value||0))}
function generateWeeklyPlan(){ensurePlanWeek();const old=state.weeklyPlan.entries||[],locked=old.filter(x=>x.locked),skipped=old.filter(x=>x.skipped);const keepIds=new Set([...locked,...skipped].map(x=>`${x.exerciseId}:${x.componentId||''}`));const generated=[];candidateTargets().forEach(({e,c,gp})=>{const key=`${e.id}:${c?.id||''}`;if(keepIds.has(key))return;const st=statsFor(e,c),desired=desiredThisWeek(e,c),remaining=Math.max(0,desired-st.thisWeek);if(remaining<=0&&!st.overdue)return;const x=c||e;let count=Math.max(remaining,st.overdue?1:0);if(gp===4&&x.priority==='High')count=Math.max(count,1);generated.push({id:uid(),exerciseId:e.id,componentId:c?.id||null,count,locked:false,skipped:false,boost:false,score:gp*10+(x.priority==='High'?5:0)+(st.overdue?8:0)+(x.status==='Building'?2:0)-st.thisWeek})});generated.sort((a,b)=>b.score-a.score);state.weeklyPlan.entries=[...locked,...skipped,...generated].map(({score,...x})=>x);save();renderPlan();toast('Weekly plan generated from current coverage ✓')}
function findPlan(id){return state.weeklyPlan.entries.find(x=>x.id===id)}
function adjustPlan(id,n){const p=findPlan(id);p.count=Math.max(0,(p.count||0)+n);p.skipped=false;save();renderPlan()}
function togglePlanLock(id){const p=findPlan(id);p.locked=!p.locked;save();renderPlan()}
function boostPlan(id){const p=findPlan(id);p.boost=!p.boost;if(p.boost)p.count=Math.max(1,(p.count||0)+1);save();renderPlan()}
function skipPlan(id){const p=findPlan(id);p.skipped=!p.skipped;save();renderPlan()}
function removePlan(id){state.weeklyPlan.entries=state.weeklyPlan.entries.filter(x=>x.id!==id);save();renderPlan()}
function addPlanTarget(){const opts=candidateTargets();sheet(`<h2>Add weekly target</h2>${opts.map(({e,c})=>`<button class="btn secondary full" style="margin:7px 0" onclick="addPlanTargetNow('${e.id}','${c?.id||''}')">${esc(e.name)}${c?` → ${esc(c.name)}`:''}</button>`).join('')||'<div class="empty">No available targets.</div>'}`)}
function addPlanTargetNow(eid,cid){state.weeklyPlan.entries.push({id:uid(),exerciseId:eid,componentId:cid||null,count:1,locked:false,skipped:false,boost:false});save();closeSheet();renderPlan()}
function renderProgress(){const recent=[...state.sessions].reverse().slice(0,12);document.getElementById('progressScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">PROGRESS / HISTORY</div><div class="title">What you actually trained</div><div class="subtitle">HISTORY REMEMBERS.</div></div></div><div class="card"><div class="statline"><span>Saved sessions</span><b>${state.sessions.length}</b></div><div class="statline"><span>Current component progressions</span><b>${activeWork().length}</b></div></div>${recent.map(s=>`<div class="card"><div class="kicker">${new Date(s.savedAt).toLocaleDateString()}</div><b>${esc(s.exerciseName)} → ${esc(s.componentName)}</b><div class="muted tiny">${esc(s.goalName||'')} · ${esc(s.stepName)} · ${esc(s.decision)}</div></div>`).join('')||'<div class="empty">No sessions saved yet.</div>'}`}
function renderMore(){document.getElementById('moreScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">MORE</div><div class="title">FIELDWORK</div></div></div><div class="card"><h3>Task Analysis / Curriculum</h3><p class="muted">Goals link to shared exercises. Exercises contain independent components and progressions.</p><button class="btn full" onclick="nav.builder={level:'root',goalId:null,exerciseId:null,componentId:null};show('builderScreen')">OPEN CURRICULUM BUILDER</button></div><div class="card"><h3>Data safety</h3><p class="muted">Local-first. Export a backup before clearing browser data or moving devices.</p><div class="backupRow"><button class="btn secondary" onclick="exportBackup()">EXPORT BACKUP</button><button class="btn secondary" onclick="document.getElementById('restoreInput').click()">RESTORE BACKUP</button></div></div><div class="footerNote">FIELDWORK Training Map build · SAFE COPY Component to Exercise</div>`}
function renderBuilder(){const el=document.getElementById('builderScreen');let html=`<div class="topbar"><button class="btn small ghost" onclick="builderBack()">‹ Back</button><div class="grow"><div class="eyebrow">BUILD</div><div class="title" style="font-size:22px">Curriculum Builder</div></div></div>`;if(nav.builder.level==='root'){html+=`<div class="builderHeader"><strong>${esc(state.dog?.name||'Dog')}’s Curriculum</strong><span class="tiny muted">Goals link to shared Exercises. No duplicate exercise required.</span></div>${state.goals.map(g=>`<div class="listrow"><div class="grow"><b>${esc(g.name)}</b><div class="tiny muted">${esc(g.priority)} · ${(g.exerciseIds||[]).length} linked exercises</div></div><button class="btn small secondary js-open-goal" data-goal-id="${g.id}">OPEN</button></div>`).join('')}<button class="btn full" onclick="openGoalForm()">+ ADD GOAL</button>`}
if(nav.builder.level==='goal'){const g=goal(nav.builder.goalId);html+=`<div class="crumb">${esc(state.dog?.name||'Dog')} → ${esc(g.name)}</div><div class="card"><div class="kicker">GOAL PRIORITY</div><b>${esc(g.priority)}</b><div class="hr"></div><div class="kicker">FINISHED PICTURE</div><div>${esc(g.finishedPicture||'Not entered')}</div><div class="hr"></div><button class="btn small secondary" onclick="openGoalForm('${g.id}')">EDIT GOAL</button></div><div class="sectionHead"><h2>Linked Exercises</h2></div>${(g.exerciseIds||[]).map(id=>exercise(id)).filter(Boolean).map(e=>`<div class="listrow"><div class="grow"><b>${esc(e.name)}</b><div class="tiny muted">${goalsForExercise(e).map(x=>esc(x.name)).join(' · ')}</div></div><button class="btn small secondary js-open-exercise" data-exercise-id="${e.id}">OPEN</button></div>`).join('')}<button class="btn full" onclick="openExerciseForm()">+ ADD / LINK EXERCISE</button>`}
if(nav.builder.level==='exercise'){const e=exercise(nav.builder.exerciseId);html+=`<div class="crumb">${esc(e.name)}</div><div class="card"><div class="kicker">LINKED GOALS</div><div>${goalsForExercise(e).map(g=>esc(g.name)).join(' · ')||'None'}</div><div class="hr"></div><div class="kicker">OVERALL EXERCISE / TRIAL CRITERIA</div><div style="white-space:pre-wrap">${esc(e.criteria||'Not entered')}</div><div class="hr"></div><div class="kicker">NOTES</div><div style="white-space:pre-wrap">${esc(e.notes||'Not entered')}</div><div class="hr"></div><div class="tiny muted">${esc(e.status)} · ${esc(e.priority)} · ${esc(freqText(e))}</div><div class="hr"></div><button class="btn small secondary" onclick="openExerciseForm('${e.id}')">EDIT EXERCISE</button></div><div class="sectionHead"><h2>Components</h2></div>${e.components.map(c=>`<div class="listrow"><div class="grow"><b>${esc(c.name)}</b><div class="tiny muted">${esc(c.status)} · ${esc(c.priority)} · ${esc(freqText(c))} · ${esc(currentStepText(c))}</div></div><button class="btn small secondary js-open-component" data-component-id="${c.id}">OPEN</button></div>`).join('')}<button class="btn full" onclick="openComponentForm()">+ ADD COMPONENT</button>`}
if(nav.builder.level==='component'){const e=exercise(nav.builder.exerciseId),c=component(e.id,nav.builder.componentId),st=statsFor(e,c);html+=`<div class="crumb">${esc(e.name)} → ${esc(c.name)}</div><div class="card"><div class="kicker">COVERAGE SETTINGS</div><div>${esc(c.status)} · ${esc(c.priority)} · ${esc(freqText(c))}</div><div class="tiny muted" style="margin-top:5px">Last trained: ${fmtDate(st.last)} · This week: ${st.thisWeek}${st.overdue?' · OVERDUE':''}</div><div class="hr"></div><div class="kicker">FINISHED PICTURE</div><div>${esc(c.finishedPicture||'Not entered')}</div><div class="hr"></div><div class="seg"><button class="btn small secondary" onclick="openComponentForm('${c.id}')">EDIT COMPONENT</button><button class="btn small secondary" onclick="openMoveComponent('${c.id}')">MOVE COMPONENT</button><button class="btn small secondary" onclick="openPromoteComponent('${c.id}')">MAKE ITS OWN EXERCISE</button></div></div><div class="sectionHead"><h2>Training Tools</h2></div>${componentToolsBuilder(c)}<button class="btn full secondary" onclick="chooseToolType()">+ ADD TRAINING TOOL</button><div class="sectionHead"><h2>Progression</h2></div>${c.steps.map((s,i)=>`<div class="listrow ${c.currentStepId===s.id?'current':''}"><div class="num">${i+1}</div><div class="grow"><b>${esc(s.name)}</b><div class="tiny muted">${esc(s.goal||s.criterion||'')}</div></div><div class="moveBtns"><button class="btn small ghost" onclick="moveStep('${s.id}',-1)">↑</button><button class="btn small ghost" onclick="moveStep('${s.id}',1)">↓</button><button class="btn small secondary" onclick="openStepForm('${s.id}')">•••</button></div></div>`).join('')}<button class="btn full" onclick="openStepForm()">+ ADD STEP</button>`}el.innerHTML=html}
function builderBack(){if(nav.builder.level==='component')nav.builder.level='exercise';else if(nav.builder.level==='exercise')nav.builder={level:'goal',goalId:nav.builder.goalId,exerciseId:null,componentId:null};else if(nav.builder.level==='goal')nav.builder={level:'root',goalId:null,exerciseId:null,componentId:null};else{show('moreScreen');return}renderBuilder()}
function openGoal(id){nav.builder={level:'goal',goalId:id,exerciseId:null,componentId:null};renderBuilder()}
function openExercise(id){nav.builder={level:'exercise',goalId:nav.builder.goalId,exerciseId:id,componentId:null};renderBuilder()}
function openComponent(id){nav.builder.level='component';nav.builder.componentId=id;renderBuilder()}
function openMoveComponent(componentId){const from=exercise(nav.builder.exerciseId),c=component(from.id,componentId),others=state.exercises.filter(e=>e.id!==from.id);if(!others.length){alert('Create the destination Exercise first.');return}sheet(`<h2>Move ${esc(c.name)}</h2><p class="muted">Move this entire Component — including its progression steps, current step, tools, and saved settings — to another Exercise. Nothing is retyped.</p><div class="field"><label>Move to Exercise</label><select id="moveDestination">${others.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="moveComponentNow('${componentId}')">MOVE</button></div>`)}
function moveComponentNow(componentId){const from=exercise(nav.builder.exerciseId),to=exercise(document.getElementById('moveDestination').value),idx=from.components.findIndex(c=>c.id===componentId);if(idx<0||!to)return;const moved=from.components.splice(idx,1)[0];to.components=to.components||[];to.components.push(moved);save();closeSheet();nav.builder.exerciseId=to.id;nav.builder.componentId=moved.id;nav.builder.level='component';render();toast(`${moved.name} moved to ${to.name} ✓`)}
function openPromoteComponent(componentId){const from=exercise(nav.builder.exerciseId),c=component(from.id,componentId);if(!from||!c)return;const linked=goalsForExercise(from);const preferred=goal(nav.builder.goalId)||linked[0]||state.goals[0];sheet(`<h2>Make ${esc(c.name)} its own Exercise</h2><p class="muted">This promotes the Component out of ${esc(from.name)}. FIELDWORK first creates and verifies the new Exercise, preserving the progression, current step, tools, finished picture, status, priority, and frequency. Only after verification will it remove the old Component.</p><div class="field"><label>New Exercise Name</label><input id="promoteName" value="${esc(c.name)}"></div><div class="field"><label>Link new Exercise to Goal(s)</label><div class="tagGrid">${state.goals.map(g=>`<label class="tag"><input type="checkbox" class="promoteGoal" value="${g.id}" ${g.id===preferred?.id?'checked':''}> ${esc(g.name)}</label>`).join('')}</div></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="promoteComponentNow('${componentId}')">MAKE EXERCISE</button></div>`)}
function promoteComponentNow(componentId){try{const from=exercise(nav.builder.exerciseId),idx=from?.components?.findIndex(c=>c.id===componentId);if(!from||idx<0)throw new Error('Original component was not found. Nothing changed.');const original=from.components[idx];const name=val('promoteName').trim()||original.name;const goalIds=[...document.querySelectorAll('.promoteGoal:checked')].map(x=>x.value);if(!goalIds.length)throw new Error('Choose at least one Goal for the new Exercise.');const snapshot=JSON.stringify(state);const preserved=JSON.parse(JSON.stringify(original));const innerComponent={...preserved,id:uid()};const newExercise={id:uid(),name,icon:'🐕',criteria:preserved.finishedPicture||'',notes:'',goalIds:[...goalIds],components:[innerComponent],status:original.status||'Not Started',priority:original.priority||'Normal',frequency:JSON.parse(JSON.stringify(original.frequency||{mode:'weekly',value:1}))};state.exercises.push(newExercise);state.goals.forEach(g=>{g.exerciseIds=g.exerciseIds||[];if(goalIds.includes(g.id)&&!g.exerciseIds.includes(newExercise.id))g.exerciseIds.push(newExercise.id)});save();const persisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));const pe=persisted.exercises.find(e=>e.id===newExercise.id),pc=pe?.components?.find(c=>c.id===innerComponent.id);if(!pe||!pc){state=JSON.parse(snapshot);save();throw new Error('FIELDWORK could not verify the new Exercise. The original Component is still untouched.');}const liveFrom=state.exercises.find(e=>e.id===from.id);const liveIdx=liveFrom?.components?.findIndex(c=>c.id===componentId)??-1;if(liveIdx<0){state=JSON.parse(snapshot);save();throw new Error('FIELDWORK could not find the original Component for the final move. Nothing was removed.');}liveFrom.components.splice(liveIdx,1);save();const finalPersisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));const finalExercise=finalPersisted.exercises.find(e=>e.id===newExercise.id);const finalGoalLinks=goalIds.every(gid=>finalPersisted.goals.find(g=>g.id===gid)?.exerciseIds?.includes(newExercise.id));const originalStillThere=finalPersisted.exercises.find(e=>e.id===from.id)?.components?.some(c=>c.id===componentId);if(!finalExercise||!finalGoalLinks||originalStillThere){state=JSON.parse(snapshot);save();throw new Error('Final move verification failed. FIELDWORK restored the original Component.');}state=finalPersisted;closeSheet();nav.builder={level:'exercise',goalId:goalIds[0],exerciseId:newExercise.id,componentId:null};render();alert(`${name} is now its own Exercise under the selected Goal. The old Component was removed only after the new Exercise and Goal link were verified.`)}catch(err){alert(err.message)}}

function openDog(){sheet(`<h2>Create your dog</h2><div class="field"><label>Name</label><input id="dogName"></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveDog()">Save</button></div>`)}

function openGoalForm(id){const g=id?goal(id):null;sheet(`<h2>${g?'Edit':'Add'} goal</h2><div class="field"><label>Name</label><input id="fName" value="${esc(g?.name||'')}"></div><div class="field"><label>Goal Priority</label><select id="fGoalPriority">${['Primary','Secondary','Development','Parked'].map(x=>`<option ${g?.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Finished picture</label><textarea id="fPic">${esc(g?.finishedPicture||'')}</textarea></div><div class="field"><label>Goal / trial criteria</label><textarea id="fCrit">${esc(g?.criteria||'')}</textarea></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveGoal('${id||''}')">Save</button></div>`)}
function saveGoal(id){let g=id?goal(id):{id:uid(),exerciseIds:[]};g.name=val('fName');g.priority=document.getElementById('fGoalPriority').value;g.finishedPicture=val('fPic');g.criteria=val('fCrit');if(!id)state.goals.push(g);save();closeSheet();nav.builder={level:'goal',goalId:g.id,exerciseId:null,componentId:null};render()}
function metaFields(x){const f=x?.frequency||{mode:'weekly',value:1};return `<div class="field"><label>Training Status</label><select id="fStatus">${['Not Started','Building','Maintenance','Parked','Complete'].map(v=>`<option ${x?.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select id="fPriority"><option ${x?.priority!=='High'?'selected':''}>Normal</option><option ${x?.priority==='High'?'selected':''}>High</option></select></div><div class="field"><label>Desired Frequency</label><select id="fFreqMode" onchange="document.getElementById('freqLabel').textContent=this.value==='days'?'Days between sessions':'Times per week'"> <option value="weekly" ${f.mode!=='days'?'selected':''}>Times per week</option><option value="days" ${f.mode==='days'?'selected':''}>Custom interval</option></select></div><div class="field"><label id="freqLabel">${f.mode==='days'?'Days between sessions':'Times per week'}</label><input id="fFreqValue" type="number" min="1" value="${esc(f.value||1)}"></div>`}
function readMeta(x){x.status=document.getElementById('fStatus').value;x.priority=document.getElementById('fPriority').value;x.frequency={mode:document.getElementById('fFreqMode').value,value:Math.max(1,Number(document.getElementById('fFreqValue').value)||1)}}
function openExerciseForm(id){const e=id?exercise(id):null;const currentGoal=nav.builder.goalId;sheet(`<h2>${e?'Edit':'Add / Link'} exercise</h2>${!e&&state.exercises.length?`<div class="field"><label>Link an existing exercise instead</label><select id="existingExercise"><option value="">Create new exercise</option>${state.exercises.filter(x=>!(x.goalIds||[]).includes(currentGoal)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`:''}<div class="field"><label>Name</label><input id="fName" value="${esc(e?.name||'')}"></div><div class="field"><label>Icon</label><input id="fIcon" value="${esc(e?.icon||'🐕')}"></div><div class="field"><label>Linked Goal(s)</label><div class="tagGrid">${state.goals.map(g=>`<label class="tag"><input type="checkbox" class="goalLink" value="${g.id}" ${(e?.goalIds||[currentGoal]).includes(g.id)?'checked':''}> ${esc(g.name)}</label>`).join('')}</div></div><div class="field" style="padding:14px;border:2px solid var(--lime);border-radius:16px;background:rgba(213,255,63,.06)"><label style="font-size:18px">OVERALL EXERCISE / TRIAL CRITERIA</label><textarea id="fExerciseCriteria" style="min-height:320px" placeholder="Enter the overall criteria for this exercise (for example, the full IGP trial criteria for Heeling).">${esc(e?.criteria||'')}</textarea></div><div class="field" style="padding:14px;border:2px solid var(--line);border-radius:16px"><label style="font-size:18px">NOTES</label><textarea id="fExerciseNotes" style="min-height:360px" placeholder="Add overall notes for this exercise.">${esc(e?.notes||'')}</textarea></div>${metaFields(e)}<div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveExercise('${id||''}')">Save</button></div>`)}
function saveExercise(id){const existing=document.getElementById('existingExercise')?.value;if(!id&&existing){const e=exercise(existing),g=goal(nav.builder.goalId);if(!e.goalIds.includes(g.id))e.goalIds.push(g.id);if(!g.exerciseIds.includes(e.id))g.exerciseIds.push(e.id);save();closeSheet();renderBuilder();return}let e=id?exercise(id):{id:uid(),components:[],goalIds:[]};e.name=val('fName');e.icon=val('fIcon')||'🐕';e.criteria=val('fExerciseCriteria');e.notes=val('fExerciseNotes');e.goalIds=[...document.querySelectorAll('.goalLink:checked')].map(x=>x.value);readMeta(e);state.goals.forEach(g=>{g.exerciseIds=g.exerciseIds||[];const linked=e.goalIds.includes(g.id);g.exerciseIds=linked?[...new Set([...g.exerciseIds,e.id])]:g.exerciseIds.filter(x=>x!==e.id)});if(!id)state.exercises.push(e);save();closeSheet();nav.builder.exerciseId=e.id;nav.builder.level='exercise';render()}
function openComponentForm(id){const e=exercise(nav.builder.exerciseId),c=id?component(e.id,id):null;sheet(`<h2>${c?'Edit':'Add'} component</h2><div class="field"><label>Name</label><input id="fName" value="${esc(c?.name||'')}"></div><div class="field"><label>Finished picture</label><textarea id="fPic">${esc(c?.finishedPicture||'')}</textarea></div>${metaFields(c)}<div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveComponent('${id||''}')">Save</button></div>`)}
function saveComponent(id){const e=exercise(nav.builder.exerciseId);let c=id?component(e.id,id):{id:uid(),steps:[],tools:[],currentStepId:null};c.name=val('fName');c.finishedPicture=val('fPic');readMeta(c);if(!id)e.components.push(c);save();closeSheet();nav.builder.componentId=c.id;nav.builder.level='component';render()}
function openStepForm(id){const c=component(nav.builder.exerciseId,nav.builder.componentId),s=id?c.steps.find(x=>x.id===id):null;sheet(`<h2>${s?'Edit':'Add'} progression step</h2><div class="field"><label>Step name</label><input id="fName" value="${esc(s?.name||`Step ${c.steps.length+1}`)}"></div><div class="field" style="padding:14px;border:2px solid var(--lime);border-radius:16px;background:rgba(213,255,63,.08)"><label style="font-size:18px">🎯 STEP GOAL</label><textarea id="fGoal" style="min-height:220px">${esc(s?.goal||'')}</textarea></div><div class="field" style="padding:14px;border:2px solid var(--lime);border-radius:16px;background:rgba(213,255,63,.06)"><label style="font-size:18px">🧭 STEPS TO PERFORM THIS STEP</label><textarea id="fActions" style="min-height:320px" placeholder="Enter the actual training sequence / steps to perform this progression step.">${esc(s?.actions||'')}</textarea></div><div class="field"><label>Description</label><textarea id="fDesc" style="min-height:220px">${esc(s?.description||'')}</textarea></div><div class="field"><label>Criterion for success</label><textarea id="fCrit" style="min-height:220px">${esc(s?.criterion||'')}</textarea></div><div class="field"><label>Progression / outcome rule</label><textarea id="fRule" style="min-height:220px">${esc(s?.rule||'')}</textarea></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveStep('${id||''}')">Save</button></div>${s?`<div class="stack"><button class="btn secondary full" onclick="setCurrent('${s.id}')">SET CURRENT</button><button class="btn danger full" onclick="deleteStep('${s.id}')">DELETE STEP</button></div>`:''}`)}
function saveStep(id){try{const c=component(nav.builder.exerciseId,nav.builder.componentId);const obj={id:id||uid(),name:val('fName'),goal:val('fGoal'),actions:val('fActions'),description:val('fDesc'),criterion:val('fCrit'),rule:val('fRule')};if(id)c.steps[c.steps.findIndex(x=>x.id===id)]=obj;else{c.steps.push(obj);if(!c.currentStepId)c.currentStepId=obj.id}save();const persisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));const pc=persisted.exercises.find(e=>e.id===nav.builder.exerciseId)?.components.find(x=>x.id===nav.builder.componentId),ps=pc?.steps.find(x=>x.id===obj.id);if(!ps||ps.goal!==obj.goal||ps.actions!==obj.actions||ps.description!==obj.description||ps.criterion!==obj.criterion||ps.rule!==obj.rule)throw new Error('Step fields did not persist completely');closeSheet();render();toast('Step saved and verified ✓')}catch(err){alert('FIELDWORK did not save this step. '+err.message)}}
function setCurrent(id){component(nav.builder.exerciseId,nav.builder.componentId).currentStepId=id;save();closeSheet();render()}
function deleteStep(id){if(!confirm('Delete this progression step?'))return;const c=component(nav.builder.exerciseId,nav.builder.componentId);c.steps=c.steps.filter(x=>x.id!==id);if(c.currentStepId===id)c.currentStepId=c.steps[0]?.id||null;save();closeSheet();render()}
function moveStep(id,d){const c=component(nav.builder.exerciseId,nav.builder.componentId),i=c.steps.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=c.steps.length)return;[c.steps[i],c.steps[j]]=[c.steps[j],c.steps[i]];save();renderBuilder()}
function componentToolsBuilder(c){c.tools=c.tools||[];return c.tools.length?c.tools.map(t=>`<div class="listrow"><div class="grow"><b>${esc(t.name)}</b><div class="tiny muted">${t.type==='timer'?`Random Timer · ${t.min}–${t.max} ${t.units}`:`Random ${esc(t.numberName)} + ${esc(t.secondName)}`}</div></div><button class="btn small secondary" onclick="openToolForm('${t.type}','${t.id}')">EDIT</button></div>`).join(''):`<div class="card empty">No tools attached yet.</div>`}
function chooseToolType(){sheet(`<h2>Add training tool</h2><button class="btn full" onclick="openToolForm('timer')">⏱ RANDOM TIMER</button><button class="btn full secondary" style="margin-top:10px" onclick="openToolForm('random')">🎲 RANDOM NUMBER + CUSTOM VARIABLE</button>`)}
function openToolForm(type,id){const c=component(nav.builder.exerciseId,nav.builder.componentId),t=id?(c.tools||[]).find(x=>x.id===id):null;if(type==='timer')sheet(`<h2>Random Timer</h2><div class="field"><label>Tool Name</label><input id="toolName" value="${esc(t?.name||'')}"></div><div class="field"><label>Minimum</label><input id="toolMin" type="number" value="${t?.min??60}"></div><div class="field"><label>Maximum</label><input id="toolMax" type="number" value="${t?.max??180}"></div><div class="field"><label>Units</label><select id="toolUnits"><option ${t?.units!=='minutes'?'selected':''}>seconds</option><option ${t?.units==='minutes'?'selected':''}>minutes</option></select></div><button class="btn full" onclick="saveTool('timer','${id||''}')">SAVE TOOL</button>`);else sheet(`<h2>Random Number + Custom Variable</h2><div class="field"><label>Tool Name</label><input id="toolName" value="${esc(t?.name||'')}"></div><div class="field"><label>Number variable name</label><input id="numberName" value="${esc(t?.numberName||'Steps')}"></div><div class="field"><label>Minimum</label><input id="toolMin" type="number" value="${t?.min??1}"></div><div class="field"><label>Maximum</label><input id="toolMax" type="number" value="${t?.max??10}"></div><div class="field"><label>How many results</label><input id="toolCount" type="number" value="${t?.count??3}"></div><div class="field"><label>Second variable name</label><input id="secondName" value="${esc(t?.secondName||'Focus')}"></div><div class="field"><label>Possible values — one per line</label><textarea id="secondValues">${esc((t?.values||[]).join('\n'))}</textarea></div><button class="btn full" onclick="saveTool('random','${id||''}')">SAVE TOOL</button>`)}
function saveTool(type,id){try{const c=component(nav.builder.exerciseId,nav.builder.componentId);c.tools=c.tools||[];const name=val('toolName'),min=Number(val('toolMin')),max=Number(val('toolMax'));if(!name||max<min)throw new Error('Check tool values');let obj={id:id||uid(),type,name,min,max};if(type==='timer')obj.units=document.getElementById('toolUnits').value;else{obj.numberName=val('numberName');obj.count=Math.max(1,Number(val('toolCount'))||1);obj.secondName=val('secondName');obj.values=(document.getElementById('secondValues').value||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean)}const i=c.tools.findIndex(x=>x.id===id);if(i>=0)c.tools[i]=obj;else c.tools.push(obj);save();closeSheet();render();toast('Training tool saved ✓')}catch(e){alert(e.message)}}
function beginTraining(gid,eid,cid,sid){nav.training={gid,eid,cid,sid};nav.recordingMode='rep';show('setupScreen')}
function pickStepForTrain(gid,eid,cid){const c=component(eid,cid);sheet(`<h2>Choose ${esc(c.name)} step</h2>${c.steps.map((s,i)=>`<div class="listrow ${c.currentStepId===s.id?'current':''}"><div class="num">${i+1}</div><div class="grow"><b>${esc(s.name)}</b></div><button class="btn small" onclick="closeSheet();beginTraining('${gid}','${eid}','${cid}','${s.id}')">TRAIN</button></div>`).join('')}`)}
function selectField(label,id,opts,custom=false){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(x=>`<option>${esc(x)}</option>`).join('')}${custom?'<option>Custom / Other</option>':''}</select></div>`}
function renderSetup(){if(!nav.training)return;const {gid,eid,cid,sid}=nav.training,g=goal(gid)||displayGoalForExercise(exercise(eid)),e=exercise(eid),c=component(eid,cid),s=step(eid,cid,sid),st=state.settings;document.getElementById('setupScreen').innerHTML=`<div class="topbar"><button class="btn small ghost" onclick="show('trainScreen')">‹ Back</button><div class="grow"><div class="eyebrow">SESSION SETUP</div><div class="title" style="font-size:21px">${esc(e.name)} — ${esc(c.name)}</div><div class="subtitle">${esc(s.name)}</div></div></div><div class="sessionContext"><span class="tiny muted">REFERENCING EXISTING CURRICULUM</span><strong>${esc(g?.name||'')} → ${esc(e.name)} → ${esc(c.name)}</strong></div>${selectField('Location','setupLocation',st.locations)}${selectField('Reinforcer','setupReinforcer',st.reinforcers)}${selectField('Reward Position','setupReward',st.rewardPositions,true)}${selectField('Handler State','setupHandler',st.handlerStates)}<div class="field"><label>Recording Mode</label><div class="seg"><button class="btn" id="modeRep" onclick="setMode('rep')">Rep by Rep</button><button class="btn secondary" id="modeOverview" onclick="setMode('overview')">Session Overview</button></div></div><button class="btn full" onclick="startSession()">START TRAINING</button>`}
function setMode(m){nav.recordingMode=m;document.getElementById('modeRep').className='btn '+(m==='rep'?'':'secondary');document.getElementById('modeOverview').className='btn '+(m==='overview'?'':'secondary')}
function startSession(){const {gid,eid,cid,sid}=nav.training,g=goal(gid)||displayGoalForExercise(exercise(eid)),e=exercise(eid),c=component(eid,cid),s=step(eid,cid,sid);nav.session={id:uid(),goalId:g?.id||'',exerciseId:e.id,componentId:c.id,stepId:s.id,goalName:g?.name||'',exerciseName:e.name,componentName:c.name,stepName:s.name,criterion:s.criterion||'',location:document.getElementById('setupLocation').value,reinforcer:document.getElementById('setupReinforcer').value,rewardPosition:document.getElementById('setupReward').value,handlerState:document.getElementById('setupHandler').value,mode:nav.recordingMode,reps:[],good:'',bad:'',weird:'',limiters:[],startedAt:new Date().toISOString()};show('liveScreen')}
const outcomes=[['beautiful','☕','Beautiful'],['solid','☕','Full / Solid'],['productive','☕','Productive'],['rough','☕','Rough'],['spilled','☕','Spilled']];
function liveTools(s){const c=component(s.exerciseId,s.componentId),tools=c?.tools||[];if(!tools.length)return '';return `<div class="card"><div class="kicker">TRAINING TOOLS</div>${tools.map(t=>t.type==='timer'?`<div class="listrow"><div class="grow"><b>⏱ ${esc(t.name)}</b><div class="tiny muted">${t.min}–${t.max} ${t.units}</div><div id="toolout-${t.id}" class="lime" style="font-size:22px;font-weight:900;margin-top:5px"></div></div><button class="btn small" onclick="generateTimer('${t.id}')">GENERATE</button></div>`:`<div><b>🎲 ${esc(t.name)}</b><div id="toolout-${t.id}" class="tiny" style="margin:8px 0"></div><button class="btn small" onclick="generateRandom('${t.id}')">GENERATE</button></div>`).join('')}</div>`}
function findTool(id){return (component(nav.session.exerciseId,nav.session.componentId)?.tools||[]).find(x=>x.id===id)}
function generateTimer(id){const t=findTool(id),n=Math.floor(Math.random()*(t.max-t.min+1))+t.min,sec=t.units==='minutes'?n*60:n;const el=document.getElementById('toolout-'+id);el.dataset.seconds=sec;el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;el.innerHTML+=` <button class="btn small secondary" onclick="startCountdown('${id}')">START</button>`}
const timers={};function startCountdown(id){clearInterval(timers[id]);const el=document.getElementById('toolout-'+id);let n=Number(el.dataset.seconds||0);timers[id]=setInterval(()=>{n--;el.dataset.seconds=n;el.firstChild.textContent=`${Math.floor(Math.max(0,n)/60)}:${String(Math.max(0,n)%60).padStart(2,'0')} `;if(n<=0){clearInterval(timers[id]);navigator.vibrate?.(200)}},1000)}
function generateRandom(id){const t=findTool(id),out=[];for(let i=0;i<t.count;i++){const n=Math.floor(Math.random()*(t.max-t.min+1))+t.min;out.push(`${n} ${t.numberName} → ${t.values[Math.floor(Math.random()*t.values.length)]}`)}document.getElementById('toolout-'+id).innerHTML=out.map(x=>`<div class="outcomeChip">${esc(x)}</div>`).join(' ')}
function renderLive(){const s=nav.session;if(!s)return;const st=step(s.exerciseId,s.componentId,s.stepId);document.getElementById('liveScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">TRAINING SESSION</div><div class="title" style="font-size:22px">${esc(s.exerciseName)} — ${esc(s.componentName)}</div><div class="subtitle">${esc(s.stepName)}</div></div><button class="btn small ghost" onclick="endSession()">End</button></div><div class="card">${st?.goal?`<div class="kicker">STEP GOAL</div><div class="bigCriterion">${esc(st.goal)}</div><div class="hr"></div>`:''}${st?.actions?`<div class="kicker">STEPS TO PERFORM</div><div class="bigCriterion" style="white-space:pre-wrap">${esc(st.actions)}</div><div class="hr"></div>`:''}<div class="kicker">TODAY'S CRITERION</div><div class="bigCriterion">${esc(s.criterion||'No criterion entered')}</div></div>${liveTools(s)}<div class="seg"><button class="btn ${s.mode==='rep'?'':'secondary'}" onclick="switchLiveMode('rep')">Rep by Rep</button><button class="btn ${s.mode==='overview'?'':'secondary'}" onclick="switchLiveMode('overview')">Session Overview</button></div>${s.mode==='rep'?repUI(s):overviewUI(s)}<button class="btn secondary full" style="margin-top:12px" onclick="endSession()">END SESSION</button>`}
function repUI(s){return `<div class="card"><div class="kicker">REP ${s.reps.length+1}</div><div class="coffeeGrid">${outcomes.map(o=>`<button class="coffee" onclick="addRep('${o[0]}')"><span>${o[1]}</span>${o[2]}</button>`).join('')}</div><div class="field"><label>Rep note (optional)</label><textarea id="repNote"></textarea></div></div>${s.reps.slice().reverse().map((r,i)=>`<div class="listrow"><b>${labelOutcome(r.outcome)}</b><span class="tiny muted">${esc(r.note)}</span></div>`).join('')}`}
function overviewUI(s){return `<div class="card"><div class="kicker">SESSION OVERVIEW</div><div class="coffeeGrid">${outcomes.map(o=>`<button class="coffee ${s.overviewOutcome===o[0]?'selected':''}" onclick="setOverview('${o[0]}')"><span>${o[1]}</span>${o[2]}</button>`).join('')}</div><div class="field"><label>Session note</label><textarea id="overviewNote">${esc(s.note||'')}</textarea></div></div>`}
function addRep(outcome){const note=document.getElementById('repNote')?.value||'';nav.session.reps.push({id:uid(),outcome,note,at:new Date().toISOString()});renderLive()}
function setOverview(o){nav.session.overviewOutcome=o;nav.session.sessionOutcome=o;renderLive()}
function switchLiveMode(m){nav.session.mode=m;renderLive()}
function labelOutcome(x){return outcomes.find(o=>o[0]===x)?.[2]||x}
function endSession(){if(nav.session.mode==='overview')nav.session.note=document.getElementById('overviewNote')?.value||'';show('summaryScreen')}
function sessionCoffee(s){return s.sessionOutcome||s.overviewOutcome||null}
function setSessionCoffee(o){syncSummaryFields();nav.session.sessionOutcome=o;renderSummary()}
function countsAgainstProgression(s){return !((s.limiters||[]).some(x=>['Environment','Handler','Training Plan'].includes(x)))}
function progressionRecommendation(s){const o=sessionCoffee(s);if(!countsAgainstProgression(s))return {action:'TRAINER DECIDES',text:'Environment, Handler, or Training Plan substantially limited this session. It should not automatically count against this progression.'};if(o==='beautiful')return {action:'ADVANCE',text:'Current question is clearly within capacity. Raise ONE criterion by a small amount.'};if(o==='solid')return {action:'ADVANCE OR REPEAT',text:'Largely successful. Trainer decides whether the imperfection needs another exposure.'};if(o==='productive')return {action:'REPEAT',text:'Useful mistakes. This is approximately the productive working level.'};if(o==='rough')return {action:'REPEAT OR STEP BACK',text:'The question may have exceeded current preparation.'};if(o==='spilled')return {action:'STEP BACK / REASSESS',text:'Difficulty or curriculum needs changing.'};return {action:'SELECT SESSION COFFEE',text:'Choose one overall Coffee result.'}}
function renderSummary(){const s=nav.session;if(!s)return;const rec=progressionRecommendation(s),c=component(s.exerciseId,s.componentId),st=step(s.exerciseId,s.componentId,s.stepId);document.getElementById('summaryScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">SESSION SUMMARY</div><div class="title">${esc(s.exerciseName)} — ${esc(s.componentName)}</div></div></div><div class="card"><div class="kicker">OVERALL SESSION COFFEE</div><div class="coffeeGrid">${outcomes.map(o=>`<button class="coffee ${sessionCoffee(s)===o[0]?'selected':''}" onclick="setSessionCoffee('${o[0]}')"><span>${o[1]}</span>${o[2]}</button>`).join('')}</div></div><div class="card"><div class="field"><label>✅ GOOD</label><textarea id="sumGood">${esc(s.good)}</textarea></div><div class="field"><label>⚠️ BAD</label><textarea id="sumBad">${esc(s.bad)}</textarea></div><div class="field"><label>❓ WEIRD</label><textarea id="sumWeird">${esc(s.weird)}</textarea></div><div class="field"><label>What limited progress?</label><div class="tagGrid">${['Dog','Handler','Training Plan','Environment','Weird / Unknown'].map(x=>`<button class="tag ${s.limiters.includes(x)?'selected':''}" onclick="toggleLimiter('${x}')">${x}</button>`).join('')}</div></div></div><div class="card"><div class="kicker">FIELDWORK RECOMMENDATION</div><h3 class="lime">${esc(rec.action)}</h3><p>${esc(rec.text)}</p><div class="tiny muted">Anti-fossilization: clearly successful → increase ONE variable slightly. Productive → stay there. Significant deterioration → step back.</div>${st?.rule?`<div class="hr"></div><div class="kicker">YOUR PROGRESSION RULE</div><div style="white-space:pre-wrap">${esc(st.rule)}</div>`:''}</div><div class="card"><div class="kicker">TRAINER DECISION</div><p class="muted">Recommendation only. Only ${esc(c.name)} changes.</p><div class="decisionGrid"><button class="btn secondary" onclick="saveDecision('Advance')">ADVANCE</button><button class="btn" onclick="saveDecision('Repeat')">REPEAT</button><button class="btn secondary" onclick="saveDecision('Step Back')">STEP BACK</button><button class="btn secondary" onclick="chooseDifferentStep()">CHOOSE STEP</button></div></div>`}
function syncSummaryFields(){if(!nav.session)return;nav.session.good=document.getElementById('sumGood')?.value||nav.session.good||'';nav.session.bad=document.getElementById('sumBad')?.value||nav.session.bad||'';nav.session.weird=document.getElementById('sumWeird')?.value||nav.session.weird||''}
function toggleLimiter(x){syncSummaryFields();const a=nav.session.limiters,i=a.indexOf(x);i>=0?a.splice(i,1):a.push(x);renderSummary()}
function saveDecision(decision,chosenStepId=null){syncSummaryFields();const s=nav.session;if(!sessionCoffee(s)){alert('Choose one overall Session Coffee result before saving.');return}const c=component(s.exerciseId,s.componentId),idx=c.steps.findIndex(x=>x.id===s.stepId);let next=s.stepId;if(chosenStepId)next=chosenStepId;else if(decision==='Advance'&&idx<c.steps.length-1)next=c.steps[idx+1].id;else if(decision==='Step Back'&&idx>0)next=c.steps[idx-1].id;c.currentStepId=next;s.decision=decision;s.resultingStepId=next;s.savedAt=new Date().toISOString();state.sessions.push({...s});save();nav.session=null;nav.training=null;show('homeScreen');toast(`Saved. ${c.name} history + coverage updated.`)}
function chooseDifferentStep(){syncSummaryFields();const s=nav.session,c=component(s.exerciseId,s.componentId);sheet(`<h2>Choose ${esc(c.name)} step</h2>${c.steps.map((x,i)=>`<div class="listrow ${c.currentStepId===x.id?'current':''}"><div class="num">${i+1}</div><div class="grow"><b>${esc(x.name)}</b></div><button class="btn small" onclick="closeSheet();saveDecision('Choose Different Step','${x.id}')">CHOOSE</button></div>`).join('')}`)}
function sheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeSheet(){document.getElementById('modal').classList.remove('show')}
function val(id){return document.getElementById(id)?.value.trim()||''}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`FIELDWORK-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function toast(msg){const d=document.createElement('div');d.textContent=msg;Object.assign(d.style,{position:'fixed',left:'50%',bottom:'92px',transform:'translateX(-50%)',background:'#c9f25b',color:'#10150f',padding:'10px 14px',borderRadius:'999px',fontWeight:'900',fontSize:'12px',zIndex:99});document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>show(b.dataset.screen));
document.getElementById('builderScreen').addEventListener('click',e=>{const g=e.target.closest('.js-open-goal');if(g){openGoal(g.dataset.goalId);return}const ex=e.target.closest('.js-open-exercise');if(ex){openExercise(ex.dataset.exerciseId);return}const c=e.target.closest('.js-open-component');if(c){openComponent(c.dataset.componentId);return}});
document.getElementById('photoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.dog.photo=r.result;save();renderHome()};r.readAsDataURL(f)});
document.getElementById('restoreInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);if(!raw.version||!Array.isArray(raw.goals))throw 0;const x=migrate(raw);const gc=x.goals.length,ec=x.exercises.length,cc=x.exercises.reduce((n,e)=>n+e.components.length,0),sc=x.exercises.reduce((n,e)=>n+e.components.reduce((m,c)=>m+c.steps.length,0),0);if(!confirm(`Restore this backup?\n\n${gc} goals · ${ec} exercises · ${cc} components · ${sc} steps\n\nCurrent data will first be preserved as an emergency recovery copy.`))return;localStorage.setItem(RECOVERY_KEY,JSON.stringify(state));state=x;save();render();show('homeScreen');toast('Backup restored and migrated ✓')}catch(_){alert('That does not look like a FIELDWORK backup.')}finally{e.target.value=''}};r.readAsText(f)});
render();
</script>
