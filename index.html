<body>
<div class="app" id="app">
  <main>
    <section class="screen active" id="homeScreen"></section>
    <section class="screen" id="trainScreen"></section>
    <section class="screen" id="planScreen"></section>
    <section class="screen" id="progressScreen"></section>
    <section class="screen" id="moreScreen"></section>
    <section class="screen" id="builderScreen"></section>
    <section class="screen" id="setupScreen"></section>
    <section class="screen" id="liveScreen"></section>
    <section class="screen" id="summaryScreen"></section>
  </main>
  <nav class="bottomnav" id="bottomNav">
    <button class="navbtn active" data-screen="homeScreen"><b>⌂</b>Home</button>
    <button class="navbtn" data-screen="trainScreen"><b>⚡</b>Train</button>
    <button class="navbtn" data-screen="planScreen"><b>▣</b>Plan</button>
    <button class="navbtn" data-screen="progressScreen"><b>▥</b>Progress</button>
    <button class="navbtn" data-screen="moreScreen"><b>•••</b>More</button>
  </nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<input type="file" accept="image/*" id="photoInput" class="hidden" />
<input type="file" accept="application/json,.json" id="restoreInput" class="hidden" />
<script>
const STORAGE_KEY='fieldwork_v1_state';
const RECOVERY_KEY='fieldwork_v1_pre_restore_recovery';
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const freshState=()=>({version:3,dog:null,goals:[],exercises:[],sessions:[],todayItems:[],weeklyPlan:{weekKey:'',entries:[],setup:{days:{},notes:''}},libraries:{places:[],articles:[],reinforcers:[],handlerStates:[],interferences:[],toolTemplates:[],variableTemplates:[]},settings:{locations:['Club Field','Backyard','Home'],reinforcers:[],rewardPositions:[],handlerStates:[],defaultHandler:'Kerrie'}});
const esc=(s='')=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function normalizeMeta(x={}){x.status=x.status||'Building';x.priority=x.priority||'Normal';x.frequency=x.frequency||{mode:'weekly',value:1};if(typeof x.frequency==='number')x.frequency={mode:'weekly',value:x.frequency};return x}
function migrate(raw){if(!raw||!raw.version)return freshState();if(raw.version>=2&&Array.isArray(raw.exercises)){raw.goals=raw.goals||[];raw.exercises=raw.exercises||[];raw.sessions=raw.sessions||[];raw.todayItems=raw.todayItems||[];raw.weeklyPlan=raw.weeklyPlan||{weekKey:'',entries:[],setup:{days:{},notes:''}};raw.weeklyPlan.setup=raw.weeklyPlan.setup||{days:{},notes:''};raw.weeklyPlan.setup.days=raw.weeklyPlan.setup.days||{};raw.settings={...freshState().settings,...(raw.settings||{})};raw.settings.rewardPositions=(raw.settings.rewardPositions||[]).filter(x=>x!=='Toe Position — Cameron R1');raw.libraries=raw.libraries||{};raw.libraries.places=Array.isArray(raw.libraries.places)?raw.libraries.places:[...(raw.settings.locations||[])];raw.libraries.articles=Array.isArray(raw.libraries.articles)?raw.libraries.articles:[];raw.libraries.reinforcers=Array.isArray(raw.libraries.reinforcers)?raw.libraries.reinforcers:[...(raw.settings.reinforcers||[])];raw.libraries.handlerStates=Array.isArray(raw.libraries.handlerStates)?raw.libraries.handlerStates:[...(raw.settings.handlerStates||[])];raw.libraries.interferences=Array.isArray(raw.libraries.interferences)?raw.libraries.interferences:[];raw.libraries.toolTemplates=Array.isArray(raw.libraries.toolTemplates)?raw.libraries.toolTemplates:[];raw.libraries.variableTemplates=Array.isArray(raw.libraries.variableTemplates)?raw.libraries.variableTemplates:[];raw.sessions.forEach(x=>{x.interferences=Array.isArray(x.interferences)?x.interferences:[];x.handler=x.handler||'Kerrie'});raw.goals.forEach(g=>{g.priority=g.priority||'Secondary';g.exerciseIds=g.exerciseIds||[]});raw.exercises.forEach(e=>{normalizeMeta(e);e.criteria=e.criteria||'';e.goalIds=e.goalIds||raw.goals.filter(g=>(g.exerciseIds||[]).includes(e.id)).map(g=>g.id);e.components=e.components||[];e.components.forEach(c=>{normalizeMeta(c);c.steps=c.steps||[];c.steps.forEach(s=>{s.goal=s.goal||'';s.actions=s.actions||'';s.description=s.description||'';s.todayJob=s.todayJob||'';s.criterion=s.criterion||'';s.rule=s.rule||''});c.tools=c.tools||[];c.trackableVariables=c.trackableVariables||[];c.sessionFields=c.sessionFields||{place:true,reinforcer:true,rewardPosition:false,handlerState:true}})});raw.version=3;return raw}
 const out=freshState();out.dog=raw.dog||null;out.sessions=raw.sessions||[];out.todayItems=raw.todayItems||[];out.settings={...out.settings,...(raw.settings||{})};out.settings.rewardPositions=(out.settings.rewardPositions||[]).filter(x=>x!=='Toe Position — Cameron R1');out.libraries={places:[...(out.settings.locations||[])],articles:[],reinforcers:[...(out.settings.reinforcers||[])],handlerStates:[...(out.settings.handlerStates||[])],interferences:[],toolTemplates:[],variableTemplates:[]};const seen=new Map();(raw.goals||[]).forEach((og,gi)=>{const g={id:og.id||uid(),name:og.name||`Goal ${gi+1}`,finishedPicture:og.finishedPicture||'',criteria:og.criteria||'',priority:og.priority||'Secondary',exerciseIds:[]};out.goals.push(g);(og.exercises||[]).forEach(oe=>{let e=seen.get(oe.id);if(!e){e={...oe,id:oe.id||uid(),goalIds:[],components:oe.components||[]};delete e.exercises;normalizeMeta(e);e.components.forEach(c=>{normalizeMeta(c);c.steps=c.steps||[];c.steps.forEach(s=>{s.goal=s.goal||'';s.actions=s.actions||'';s.description=s.description||'';s.todayJob=s.todayJob||'';s.criterion=s.criterion||'';s.rule=s.rule||''});c.tools=c.tools||[];c.trackableVariables=c.trackableVariables||[];c.sessionFields=c.sessionFields||{place:true,reinforcer:true,rewardPosition:false,handlerState:true}});out.exercises.push(e);seen.set(oe.id,e)}if(!e.goalIds.includes(g.id))e.goalIds.push(g.id);if(!g.exerciseIds.includes(e.id))g.exerciseIds.push(e.id)})});return out}
function load(){try{return migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)))}catch(e){return freshState()}}
let state=load();
let nav={screen:'homeScreen',builder:{level:'root',goalId:null,exerciseId:null,componentId:null},training:null,session:null,recordingMode:'rep',progress:{days:30,exerciseId:null,componentId:null,tab:'overview'},plan:{view:'home',weekOffset:0}};
function save(){state.version=3;const raw=JSON.stringify(state);localStorage.setItem(STORAGE_KEY,raw);if(localStorage.getItem(STORAGE_KEY)!==raw)throw new Error('FIELDWORK could not verify saved data');return true}
save();
function goal(id){return state.goals.find(x=>x.id===id)}
function exercise(a,b){const id=b||a;return state.exercises.find(x=>x.id===id)}
function component(a,b,c){const eid=c?b:a,cid=c||b;return exercise(eid)?.components.find(x=>x.id===cid)}
function step(a,b,c,d){const eid=d?b:a,cid=d?c:b,sid=d||c;return component(eid,cid)?.steps.find(x=>x.id===sid)}
function goalsForExercise(e){return state.goals.filter(g=>(e.goalIds||[]).includes(g.id))}
function displayGoalForExercise(e,preferred){return goal(preferred)||goalsForExercise(e).sort((a,b)=>goalWeight(b.priority)-goalWeight(a.priority))[0]||state.goals[0]}
function goalWeight(p){return ({Primary:4,Secondary:3,Development:2,Parked:0})[p]??1}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');nav.screen=id;document.getElementById('bottomNav').classList.toggle('hidden',['builderScreen','setupScreen','liveScreen','summaryScreen'].includes(id));document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));render();window.scrollTo(0,0)}
function activeWork(){const rows=[];state.exercises.forEach(e=>{if(e.status==='Parked'||e.status==='Complete')return;e.components.forEach(c=>{if(c.status==='Parked'||c.status==='Complete'||!c.currentStepId)return;const s=c.steps.find(z=>z.id===c.currentStepId);const g=displayGoalForExercise(e);if(s&&g)rows.push({g,e,c,s})})});return rows}
function weekStart(d=new Date()){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x}
function weekKey(){return weekStart().toISOString().slice(0,10)}
function targetSessions(e,c){return state.sessions.filter(s=>s.exerciseId===e.id&&(!c||s.componentId===c.id)&&s.savedAt)}
function statsFor(e,c){const arr=targetSessions(e,c).sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt));const last=arr[0]?new Date(arr[0].savedAt):null;const ws=weekStart();const thisWeek=arr.filter(s=>new Date(s.savedAt)>=ws).length;const f=(c||e).frequency||{mode:'weekly',value:1};let overdue=false;if(!['Not Started','Parked','Complete'].includes((c||e).status)){if(f.mode==='days'){overdue=!last||((Date.now()-last.getTime())/86400000)>=Number(f.value||7)}else{const need=Math.max(0,Number(f.value||1));const elapsed=Math.max(1,(Date.now()-ws.getTime())/86400000);const spacing=7/Math.max(1,need);overdue=thisWeek<need&&(!last||((Date.now()-last.getTime())/86400000)>=spacing||elapsed>=(7*(thisWeek+1)/Math.max(1,need)))}}return {last,thisWeek,overdue}}
function fmtDate(d){return d?d.toLocaleDateString(undefined,{month:'short',day:'numeric'}):'Never'}
function freqText(x){const f=x.frequency||{mode:'weekly',value:1};return f.mode==='days'?`Every ${f.value} day${Number(f.value)===1?'':'s'}`:`${f.value}× / week`}
function currentStepText(c){return c?.steps?.find(s=>s.id===c.currentStepId)?.name||'Not set'}
function render(){renderHome();renderTrain();renderPlan();renderProgress();renderMore();if(nav.screen==='builderScreen')renderBuilder();if(nav.screen==='setupScreen')renderSetup();if(nav.screen==='liveScreen')renderLive();if(nav.screen==='summaryScreen')renderSummary()}
function currentWorkFor(e,c){const st=c?.steps?.find(x=>x.id===c.currentStepId);if(!e||!c||!st)return null;return {g:displayGoalForExercise(e),e,c,s:st}}
function todayRows(){state.todayItems=state.todayItems||[];return state.todayItems.map(t=>{const e=exercise(t.exerciseId),c=e?component(e.id,t.componentId):null,w=currentWorkFor(e,c);return w?{...w,t}:null}).filter(Boolean)}
function addToToday(eid,cid,planId=null){state.todayItems=state.todayItems||[];if(!state.todayItems.some(x=>x.exerciseId===eid&&x.componentId===cid))state.todayItems.push({id:uid(),exerciseId:eid,componentId:cid,planId:planId||null,addedAt:new Date().toISOString()});save();render();toast('Added to Today ✓')}
function removeFromToday(id){state.todayItems=(state.todayItems||[]).filter(x=>x.id!==id);save();render()}
function trainToday(id){const t=(state.todayItems||[]).find(x=>x.id===id);if(!t)return;const e=exercise(t.exerciseId),c=component(t.exerciseId,t.componentId),st=c?.steps?.find(x=>x.id===c.currentStepId),g=displayGoalForExercise(e);if(!st){alert('Set a current progression step first.');return}beginTraining(g?.id||'',e.id,c.id,st.id)}
function weeklyDashboardRows(){ensurePlanWeek();return (state.weeklyPlan.entries||[]).filter(p=>!p.skipped).map(p=>{const e=exercise(p.exerciseId),c=p.componentId?component(p.exerciseId,p.componentId):null;if(!e||!c)return null;const st=statsFor(e,c);return {p,e,c,done:st.thisWeek,need:Number(p.count||0),remaining:Math.max(0,Number(p.count||0)-st.thisWeek)}}).filter(Boolean)}
function monthBalance(){const cutoff=Date.now()-30*86400000;const m=new Map();state.sessions.filter(x=>x.savedAt&&new Date(x.savedAt).getTime()>=cutoff).forEach(x=>m.set(x.exerciseId,(m.get(x.exerciseId)||0)+1));return [...m.entries()].map(([id,n])=>({e:exercise(id),n})).filter(x=>x.e).sort((a,b)=>b.n-a.n)}
function renderHome(){const el=document.getElementById('homeScreen');if(!state.dog){el.innerHTML=`<div class="topbar"><div><div class="eyebrow">FIELDWORK</div><div class="title">Build once. Train from it.</div></div></div><div class="card"><div class="icon">🐕</div><h2>Create your dog</h2><button class="btn full" onclick="openDog()">CREATE DOG</button></div>`;return}const today=todayRows(),week=weeklyDashboardRows(),done=week.reduce((n,r)=>n+Math.min(r.done,r.need),0),total=week.reduce((n,r)=>n+r.need,0),left=week.filter(r=>r.remaining>0),overdue=coverageRows().filter(r=>['Building','Maintenance'].includes((r.c||r.e).status)&&r.stats.overdue).length,notStarted=coverageRows().filter(r=>(r.c||r.e).status==='Not Started').length,balance=monthBalance(),max=Math.max(1,...balance.map(x=>x.n));el.innerHTML=`<div class="topbar"><div><div class="eyebrow">FIELDWORK</div><div class="title">${esc(state.dog.name)}</div><div class="subtitle">Your training command center.</div></div><button class="btn small secondary" onclick="show('planScreen')">PLAN</button></div><div class="sectionHead"><h2>Today's Plan</h2><span class="pill">${today.length} queued</span></div>${today.length?today.map(w=>`<div class="card"><div class="row between"><div class="grow"><div class="kicker">${esc(w.e.name).toUpperCase()} · ${esc(w.c.name)}</div><h3 style="margin:5px 0">${esc(w.s.name)}</h3>${w.s.todayJob?`<div class="notice">⚡ ${esc(w.s.todayJob)}</div>`:''}</div><button class="btn small" onclick="trainToday('${w.t.id}')">TRAIN</button></div><button class="linkish tiny" style="margin-top:10px" onclick="removeFromToday('${w.t.id}')">Remove from Today</button></div>`).join(''):`<div class="card empty">Nothing queued yet.<br><span class="tiny">Use + TODAY in This Week or Plan.</span></div>`}<div class="sectionHead"><h2>This Week</h2><button class="linkish" onclick="show('planScreen')">See full week ›</button></div><div class="card"><div class="row between"><div><b style="font-size:22px">${done} / ${total}</b><div class="tiny muted">weekly target sessions covered</div></div><span class="pill">${left.length} need work</span></div><div class="progress" style="width:100%;margin:12px 0 6px"><i style="width:${total?Math.min(100,done/total*100):0}%"></i></div>${left.slice(0,6).map(r=>`<div class="listrow"><div class="grow"><b>${esc(r.e.name)} · ${esc(r.c.name)}</b><div class="tiny muted">${r.done} / ${r.need} this week · ${esc(currentStepText(r.c))}</div></div><button class="btn small secondary" onclick="addToToday('${r.e.id}','${r.c.id}','${r.p.id}')">+ TODAY</button></div>`).join('')||'<div class="safe" style="margin-top:10px">Weekly targets covered ✓</div>'}</div><div class="sectionHead"><h2>Needs Attention</h2></div><div class="card"><div class="statline"><span>Neglected / overdue</span><b class="orange">${overdue}</b></div><div class="statline"><span>Not started</span><b>${notStarted}</b></div><button class="btn secondary full" style="margin-top:10px" onclick="show('planScreen')">OPEN PLAN</button></div><div class="sectionHead"><h2>Training Balance · 30 Days</h2></div><div class="card">${balance.length?balance.map(x=>`<div class="statline" style="align-items:center"><span style="min-width:95px">${esc(x.e.name)}</span><span class="grow" style="height:9px;background:#26322b;border-radius:99px;overflow:hidden;margin:0 10px"><i style="display:block;height:100%;width:${x.n/max*100}%;background:var(--olive)"></i></span><b>${x.n}</b></div>`).join(''):'<div class="tiny muted">No saved sessions in the last 30 days.</div>'}</div>`}
function workCard(w){return `<div class="card work"><div class="workIcon">${w.e.icon||'🐕'}</div><div class="grow"><div class="kicker">${esc(w.e.name).toUpperCase()}</div><h3>${esc(w.c.name)} → ${esc(w.s.name)}</h3><p>${esc(w.s.criterion||'No criterion entered')}</p></div><button class="btn small train" onclick="beginTraining('${w.g.id}','${w.e.id}','${w.c.id}','${w.s.id}')">TRAIN</button></div>`}
function renderTrain(){const el=document.getElementById('trainScreen'),today=todayRows();el.innerHTML=`<div class="topbar"><div><div class="eyebrow">TRAIN</div><div class="title">Today's Training</div><div class="subtitle">Pick the job. FIELDWORK remembers the rest.</div></div></div>${today.length?today.map(w=>`<div class="card"><div class="kicker">${esc(w.e.name).toUpperCase()} · ${esc(w.c.name)}</div><h3 style="margin:5px 0">${esc(w.s.name)}</h3>${w.s.todayJob?`<div class="notice">⚡ TODAY'S JOB<br><b>${esc(w.s.todayJob)}</b></div>`:''}<div class="seg" style="margin-top:10px"><button class="btn" onclick="trainToday('${w.t.id}')">TRAIN NOW</button><button class="btn secondary" onclick="removeFromToday('${w.t.id}')">REMOVE</button></div></div>`).join(''):`<div class="card empty">Nothing queued for Today.<br><br><button class="btn secondary" onclick="show('planScreen')">VIEW WEEK</button> <button class="btn" onclick="openAddSomething()">+ ADD SOMETHING</button></div>`}<button class="btn secondary full" onclick="openAddSomething()">+ ADD SOMETHING</button><div class="sectionHead"><h2>All Training</h2><span class="tiny muted">Browse by Exercise</span></div>${state.exercises.map(e=>`<details class="card"><summary style="cursor:pointer;font-weight:900">${esc(e.name)} <span class="tiny muted">· ${e.components.length} components</span></summary><div style="margin-top:10px">${e.components.map(c=>`<div class="listrow"><div class="grow"><b>${esc(c.name)}</b><div class="tiny muted">${esc(currentStepText(c))}</div></div>${c.currentStepId?`<button class="btn small secondary" onclick="addToToday('${e.id}','${c.id}')">+ TODAY</button>`:''}</div>`).join('')}</div></details>`).join('')}`}
function openAddSomething(){sheet(`<h2>Add something</h2><div class="field"><label>Exercise</label><input id="trainSearch" placeholder="Search exercises…" oninput="filterTrainExercises()"></div><div id="trainExerciseChoices">${state.exercises.filter(e=>e.components.some(c=>c.currentStepId)).map(e=>`<button class="btn secondary full train-ex-choice" data-name="${esc(e.name.toLowerCase())}" style="margin:7px 0" onclick="chooseTrainExercise('${e.id}')">${esc(e.name)}</button>`).join('')||'<div class="empty">No current work available.</div>'}</div>`)}
function filterTrainExercises(){const q=(document.getElementById('trainSearch')?.value||'').toLowerCase();document.querySelectorAll('.train-ex-choice').forEach(b=>b.classList.toggle('hidden',!b.dataset.name.includes(q)))}
function chooseTrainExercise(eid){const e=exercise(eid);sheet(`<h2>${esc(e.name)}</h2><p class="muted">Choose the component you want to work.</p>${e.components.filter(c=>c.currentStepId).map(c=>{const st=c.steps.find(x=>x.id===c.currentStepId);return `<div class="card"><b>${esc(c.name)}</b><div class="tiny muted">${esc(st?.name||'')}</div>${st?.todayJob?`<div class="notice" style="margin-top:8px">⚡ ${esc(st.todayJob)}</div>`:''}<div class="seg" style="margin-top:10px"><button class="btn secondary" onclick="addToToday('${e.id}','${c.id}');closeSheet()">+ TODAY</button><button class="btn" onclick="addToToday('${e.id}','${c.id}');closeSheet();const t=(state.todayItems||[]).find(x=>x.exerciseId==='${e.id}'&&x.componentId==='${c.id}');trainToday(t.id)">TRAIN NOW</button></div></div>`}).join('')||'<div class="empty">No components with a current step.</div>'}`)}
function coverageRows(){const rows=[];state.goals.slice().sort((a,b)=>goalWeight(b.priority)-goalWeight(a.priority)).forEach(g=>{(g.exerciseIds||[]).map(id=>exercise(id)).filter(Boolean).forEach(e=>{if(e.components.length)e.components.forEach(c=>rows.push({g,e,c,stats:statsFor(e,c)}));else rows.push({g,e,c:null,stats:statsFor(e,null)})})});return rows}
function renderCoverage(){const rows=coverageRows();return `<div class="card"><div class="kicker">TRAINING MAP / COVERAGE</div><div class="tiny muted">Shared exercises appear under every linked goal. Coverage is tracked at Component level when components exist.</div></div>${state.goals.slice().sort((a,b)=>goalWeight(b.priority)-goalWeight(a.priority)).map(g=>{const rs=rows.filter(r=>r.g.id===g.id);return `<div class="card"><div class="sectionHead" style="margin:0 0 8px"><h2>${esc(g.name)}</h2><span class="outcomeChip">${esc(g.priority)}</span></div>${rs.length?rs.map(r=>`<div class="listrow" style="align-items:flex-start"><div class="grow"><b>${esc(r.e.name)}${r.c?` → ${esc(r.c.name)}`:''}</b><div class="tiny muted">${esc((r.c||r.e).status)} · ${esc((r.c||r.e).priority)} · ${esc(freqText(r.c||r.e))}</div><div class="tiny" style="margin-top:5px">Current: <b>${r.c?esc(currentStepText(r.c)):'Exercise-level'}</b></div><div class="tiny muted">Last: ${fmtDate(r.stats.last)} · This week: ${r.stats.thisWeek}</div></div>${r.stats.overdue?`<span class="outcomeChip" style="border-color:#ff9a62;color:#ffb27f">OVERDUE</span>`:''}</div>`).join(''):`<div class="empty">No exercises linked.</div>`}</div>`}).join('')}`}

function openMoveComponent(componentId){const from=exercise(nav.builder.exerciseId),c=component(from.id,componentId),others=state.exercises.filter(e=>e.id!==from.id);if(!others.length){alert('Create the destination Exercise first.');return}sheet(`<h2>Move ${esc(c.name)}</h2><p class="muted">Move this entire Component — including its progression steps, current step, tools, and saved settings — to another Exercise. Nothing is retyped.</p><div class="field"><label>Move to Exercise</label><select id="moveDestination">${others.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="moveComponentNow('${componentId}')">MOVE</button></div>`)}
function moveComponentNow(componentId){const from=exercise(nav.builder.exerciseId),to=exercise(document.getElementById('moveDestination').value),idx=from.components.findIndex(c=>c.id===componentId);if(idx<0||!to)return;const moved=from.components.splice(idx,1)[0];to.components=to.components||[];to.components.push(moved);save();closeSheet();nav.builder.exerciseId=to.id;nav.builder.componentId=moved.id;nav.builder.level='component';render();toast(`${moved.name} moved to ${to.name} ✓`)}
function openPromoteComponent(componentId){const from=exercise(nav.builder.exerciseId),c=component(from.id,componentId);if(!from||!c)return;const linked=goalsForExercise(from);const preferred=goal(nav.builder.goalId)||linked[0]||state.goals[0];sheet(`<h2>Make ${esc(c.name)} its own Exercise</h2><p class="muted">This promotes the Component out of ${esc(from.name)}. FIELDWORK first creates and verifies the new Exercise, preserving the progression, current step, tools, finished picture, status, priority, and frequency. Only after verification will it remove the old Component.</p><div class="field"><label>New Exercise Name</label><input id="promoteName" value="${esc(c.name)}"></div><div class="field"><label>Link new Exercise to Goal(s)</label><div class="tagGrid">${state.goals.map(g=>`<label class="tag"><input type="checkbox" class="promoteGoal" value="${g.id}" ${g.id===preferred?.id?'checked':''}> ${esc(g.name)}</label>`).join('')}</div></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="promoteComponentNow('${componentId}')">MAKE EXERCISE</button></div>`)}
function promoteComponentNow(componentId){try{const from=exercise(nav.builder.exerciseId),idx=from?.components?.findIndex(c=>c.id===componentId);if(!from||idx<0)throw new Error('Original component was not found. Nothing changed.');const original=from.components[idx];const name=val('promoteName').trim()||original.name;const goalIds=[...document.querySelectorAll('.promoteGoal:checked')].map(x=>x.value);if(!goalIds.length)throw new Error('Choose at least one Goal for the new Exercise.');const snapshot=JSON.stringify(state);const preserved=JSON.parse(JSON.stringify(original));const innerComponent={...preserved,id:uid()};const newExercise={id:uid(),name,icon:'🐕',criteria:preserved.finishedPicture||'',notes:'',goalIds:[...goalIds],components:[innerComponent],status:original.status||'Not Started',priority:original.priority||'Normal',frequency:JSON.parse(JSON.stringify(original.frequency||{mode:'weekly',value:1}))};state.exercises.push(newExercise);state.goals.forEach(g=>{g.exerciseIds=g.exerciseIds||[];if(goalIds.includes(g.id)&&!g.exerciseIds.includes(newExercise.id))g.exerciseIds.push(newExercise.id)});save();const persisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));const pe=persisted.exercises.find(e=>e.id===newExercise.id),pc=pe?.components?.find(c=>c.id===innerComponent.id);if(!pe||!pc){state=JSON.parse(snapshot);save();throw new Error('FIELDWORK could not verify the new Exercise. The original Component is still untouched.');}const liveFrom=state.exercises.find(e=>e.id===from.id);const liveIdx=liveFrom?.components?.findIndex(c=>c.id===componentId)??-1;if(liveIdx<0){state=JSON.parse(snapshot);save();throw new Error('FIELDWORK could not find the original Component for the final move. Nothing was removed.');}liveFrom.components.splice(liveIdx,1);save();const finalPersisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));const finalExercise=finalPersisted.exercises.find(e=>e.id===newExercise.id);const finalGoalLinks=goalIds.every(gid=>finalPersisted.goals.find(g=>g.id===gid)?.exerciseIds?.includes(newExercise.id));const originalStillThere=finalPersisted.exercises.find(e=>e.id===from.id)?.components?.some(c=>c.id===componentId);if(!finalExercise||!finalGoalLinks||originalStillThere){state=JSON.parse(snapshot);save();throw new Error('Final move verification failed. FIELDWORK restored the original Component.');}state=finalPersisted;closeSheet();nav.builder={level:'exercise',goalId:goalIds[0],exerciseId:newExercise.id,componentId:null};render();alert(`${name} is now its own Exercise under the selected Goal. The old Component was removed only after the new Exercise and Goal link were verified.`)}catch(err){alert(err.message)}}

function metaFields(x){const f=x?.frequency||{mode:'weekly',value:1};return `<div class="field"><label>Training Status</label><select id="fStatus">${['Not Started','Building','Maintenance','Parked','Complete'].map(v=>`<option ${x?.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select id="fPriority"><option ${x?.priority!=='High'?'selected':''}>Normal</option><option ${x?.priority==='High'?'selected':''}>High</option></select></div><div class="field"><label>Desired Frequency</label><select id="fFreqMode" onchange="document.getElementById('freqLabel').textContent=this.value==='days'?'Days between sessions':'Times per week'"> <option value="weekly" ${f.mode!=='days'?'selected':''}>Times per week</option><option value="days" ${f.mode==='days'?'selected':''}>Custom interval</option></select></div><div class="field"><label id="freqLabel">${f.mode==='days'?'Days between sessions':'Times per week'}</label><input id="fFreqValue" type="number" min="1" value="${esc(f.value||1)}"></div>`}

function openExerciseForm(id){const e=id?exercise(id):null;const currentGoal=nav.builder.goalId;sheet(`<h2>${e?'Edit':'Add / Link'} exercise</h2>${!e&&state.exercises.length?`<div class="field"><label>Link an existing exercise instead</label><select id="existingExercise"><option value="">Create new exercise</option>${state.exercises.filter(x=>!(x.goalIds||[]).includes(currentGoal)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`:''}<div class="field"><label>Name</label><input id="fName" value="${esc(e?.name||'')}"></div><div class="field"><label>Icon</label><input id="fIcon" value="${esc(e?.icon||'🐕')}"></div><div class="field"><label>Linked Goal(s)</label><div class="tagGrid">${state.goals.map(g=>`<label class="tag"><input type="checkbox" class="goalLink" value="${g.id}" ${(e?.goalIds||[currentGoal]).includes(g.id)?'checked':''}> ${esc(g.name)}</label>`).join('')}</div></div><div class="field" style="padding:14px;border:2px solid var(--lime);border-radius:16px;background:rgba(213,255,63,.06)"><label style="font-size:18px">OVERALL EXERCISE / TRIAL CRITERIA</label><textarea id="fExerciseCriteria" style="min-height:320px" placeholder="Enter the overall criteria for this exercise (for example, the full IGP trial criteria for Heeling).">${esc(e?.criteria||'')}</textarea></div><div class="field" style="padding:14px;border:2px solid var(--line);border-radius:16px"><label style="font-size:18px">NOTES</label><textarea id="fExerciseNotes" style="min-height:360px" placeholder="Add overall notes for this exercise.">${esc(e?.notes||'')}</textarea></div>${metaFields(e)}<div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveExercise('${id||''}')">Save</button></div>`)}
function saveExercise(id){const existing=document.getElementById('existingExercise')?.value;if(!id&&existing){const e=exercise(existing),g=goal(nav.builder.goalId);if(!e.goalIds.includes(g.id))e.goalIds.push(g.id);if(!g.exerciseIds.includes(e.id))g.exerciseIds.push(e.id);save();closeSheet();renderBuilder();return}let e=id?exercise(id):{id:uid(),components:[],goalIds:[]};e.name=val('fName');e.icon=val('fIcon')||'🐕';e.criteria=val('fExerciseCriteria');e.notes=val('fExerciseNotes');e.goalIds=[...document.querySelectorAll('.goalLink:checked')].map(x=>x.value);readMeta(e);state.goals.forEach(g=>{g.exerciseIds=g.exerciseIds||[];const linked=e.goalIds.includes(g.id);g.exerciseIds=linked?[...new Set([...g.exerciseIds,e.id])]:g.exerciseIds.filter(x=>x!==e.id)});if(!id)state.exercises.push(e);save();closeSheet();nav.builder.exerciseId=e.id;nav.builder.level='exercise';render()}
function openComponentForm(id){const e=exercise(nav.builder.exerciseId),c=id?component(e.id,id):null,f=c?.sessionFields||{place:true,reinforcer:true,rewardPosition:false,handlerState:true};sheet(`<h2>${c?'Edit':'Add'} component</h2><div class="field"><label>Name</label><input id="fName" value="${esc(c?.name||'')}"></div><div class="field"><label>Finished picture</label><textarea id="fPic">${esc(c?.finishedPicture||'')}</textarea></div>${metaFields(c)}<div class="field"><label>SESSION SETUP — SHOW FOR THIS COMPONENT</label><div class="tagGrid">${[['place','Place'],['reinforcer','Reinforcer'],['rewardPosition','Reward Position'],['handlerState','Handler State']].map(([k,l])=>`<label class="tag"><input type="checkbox" id="sf_${k}" ${f[k]?'checked':''}> ${l}</label>`).join('')}</div></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveComponent('${id||''}')">Save</button></div>`)}
function saveComponent(id){const e=exercise(nav.builder.exerciseId);let c=id?component(e.id,id):{id:uid(),steps:[],tools:[],trackableVariables:[],currentStepId:null};c.name=val('fName');c.finishedPicture=val('fPic');readMeta(c);c.sessionFields={place:!!document.getElementById('sf_place')?.checked,reinforcer:!!document.getElementById('sf_reinforcer')?.checked,rewardPosition:!!document.getElementById('sf_rewardPosition')?.checked,handlerState:!!document.getElementById('sf_handlerState')?.checked};if(!id)e.components.push(c);save();closeSheet();nav.builder.componentId=c.id;nav.builder.level='component';render()}
function deleteComponent(id){
  const e=exercise(nav.builder.exerciseId),c=component(e?.id,id);
  if(!e||!c){alert('Component not found. Nothing changed.');return}
  const separate=state.exercises.find(x=>x.id!==e.id&&x.name.trim().toLowerCase()===c.name.trim().toLowerCase());
  const msg=separate
    ? `Delete ${c.name} ONLY as a Component from ${e.name}?\n\nThe separate ${separate.name} Exercise will NOT be deleted.\n\nThis removes this Component and its progression/tools from ${e.name}.`
    : `Delete ${c.name} from ${e.name}?\n\nThis permanently removes this Component and its progression/tools. No separate Exercise with the same name was found.`;
  if(!confirm(msg))return;
  const snapshot=JSON.stringify(state);
  e.components=e.components.filter(x=>x.id!==id);
  try{
    save();
    const persisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));
    const pe=persisted.exercises.find(x=>x.id===e.id);
    if(!pe||pe.components.some(x=>x.id===id))throw new Error('Delete could not be verified.');
    if(separate&&!persisted.exercises.some(x=>x.id===separate.id))throw new Error('Separate Exercise verification failed.');
    nav.builder={level:'exercise',goalId:nav.builder.goalId,exerciseId:e.id,componentId:null};
    render();toast(`${c.name} removed from ${e.name} ✓`);
  }catch(err){state=JSON.parse(snapshot);save();alert('FIELDWORK restored your data because the delete could not be verified. '+err.message)}
}

function openStepForm(id){const c=component(nav.builder.exerciseId,nav.builder.componentId),s=id?c.steps.find(x=>x.id===id):null;sheet(`<h2>${s?'Edit':'Add'} progression step</h2><div class="field"><label>Step name</label><input id="fName" value="${esc(s?.name||`Step ${c.steps.length+1}`)}"></div><div class="field" style="padding:14px;border:2px solid var(--lime);border-radius:16px;background:rgba(213,255,63,.08)"><label style="font-size:18px">🎯 STEP GOAL</label><textarea id="fGoal" style="min-height:220px">${esc(s?.goal||'')}</textarea></div><div class="field" style="padding:14px;border:2px solid var(--lime);border-radius:16px;background:rgba(213,255,63,.06)"><label style="font-size:18px">🧭 STEPS TO PERFORM THIS STEP</label><textarea id="fActions" style="min-height:320px" placeholder="Enter the actual training sequence / steps to perform this progression step.">${esc(s?.actions||'')}</textarea></div><div class="field"><label>Description</label><textarea id="fDesc" style="min-height:220px">${esc(s?.description||'')}</textarea></div><div class="field" style="padding:14px;border:2px solid var(--orange);border-radius:16px;background:rgba(242,154,84,.06)"><label style="font-size:18px">⚡ TODAY'S JOB</label><textarea id="fTodayJob" style="min-height:180px" placeholder="Short field-language cue: what are you actually doing today?">${esc(s?.todayJob||'')}</textarea></div><div class="field"><label>Criterion for success</label><textarea id="fCrit" style="min-height:220px">${esc(s?.criterion||'')}</textarea></div><div class="field"><label>Progression / outcome rule</label><textarea id="fRule" style="min-height:220px">${esc(s?.rule||'')}</textarea></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveStep('${id||''}')">Save</button></div>${s?`<div class="stack"><button class="btn secondary full" onclick="setCurrent('${s.id}')">SET CURRENT</button><button class="btn danger full" onclick="deleteStep('${s.id}')">DELETE STEP</button></div>`:''}`)}
function saveStep(id){try{const c=component(nav.builder.exerciseId,nav.builder.componentId);const obj={id:id||uid(),name:val('fName'),goal:val('fGoal'),actions:val('fActions'),description:val('fDesc'),todayJob:val('fTodayJob'),criterion:val('fCrit'),rule:val('fRule')};if(id)c.steps[c.steps.findIndex(x=>x.id===id)]=obj;else{c.steps.push(obj);if(!c.currentStepId)c.currentStepId=obj.id}save();const persisted=migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));const pc=persisted.exercises.find(e=>e.id===nav.builder.exerciseId)?.components.find(x=>x.id===nav.builder.componentId),ps=pc?.steps.find(x=>x.id===obj.id);if(!ps||ps.goal!==obj.goal||ps.actions!==obj.actions||ps.description!==obj.description||ps.todayJob!==obj.todayJob||ps.criterion!==obj.criterion||ps.rule!==obj.rule)throw new Error('Step fields did not persist completely');closeSheet();render();toast('Step saved and verified ✓')}catch(err){alert('FIELDWORK did not save this step. '+err.message)}}
function setCurrent(id){component(nav.builder.exerciseId,nav.builder.componentId).currentStepId=id;save();closeSheet();render()}
function deleteStep(id){if(!confirm('Delete this progression step?'))return;const c=component(nav.builder.exerciseId,nav.builder.componentId);c.steps=c.steps.filter(x=>x.id!==id);if(c.currentStepId===id)c.currentStepId=c.steps[0]?.id||null;save();closeSheet();render()}
function moveStep(id,d){const c=component(nav.builder.exerciseId,nav.builder.componentId),i=c.steps.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=c.steps.length)return;[c.steps[i],c.steps[j]]=[c.steps[j],c.steps[i]];save();renderBuilder()}
function libraryItems(key){state.libraries=state.libraries||{places:[],articles:[],reinforcers:[],handlerStates:[],interferences:[],toolTemplates:[],variableTemplates:[]};state.libraries[key]=state.libraries[key]||[];return state.libraries[key]}
function libraryLabel(key){return ({places:'Places',articles:'Articles',reinforcers:'Reinforcers',handlerStates:'Handler States'})[key]||key}
function renderLibraryList(key){const a=libraryItems(key);return a.length?a.map((x,i)=>`<div class="listrow"><div class="grow"><b>${esc(x)}</b></div><div class="moveBtns"><button class="btn small ghost" onclick="moveLibraryItem('${key}',${i},-1)">↑</button><button class="btn small ghost" onclick="moveLibraryItem('${key}',${i},1)">↓</button><button class="btn small secondary" onclick="openLibraryItemForm('${key}',${i})">EDIT</button><button class="btn small danger" onclick="deleteLibraryItem('${key}',${i})">DELETE</button></div></div>`).join(''):`<div class="empty">No ${libraryLabel(key).toLowerCase()} saved yet.</div>`}
function interferenceItems(){state.libraries=state.libraries||{};state.libraries.interferences=Array.isArray(state.libraries.interferences)?state.libraries.interferences:[];return state.libraries.interferences}
function interferenceName(x){return typeof x==='string'?x:(x?.name||'')}
function interferenceCategory(x){return typeof x==='string'?'Other':(x?.category||'Other')}
function renderInterferenceList(){const a=interferenceItems();return a.length?a.map((x,i)=>`<div class="listrow"><div class="grow"><b>${esc(interferenceName(x))}</b><div class="tiny muted">${esc(interferenceCategory(x))}</div></div><button class="btn small secondary" onclick="openInterferenceForm(${i})">EDIT</button><button class="btn small danger" onclick="deleteInterference(${i})">DELETE</button></div>`).join(''):'<div class="empty">No interferences saved yet.</div>'}
function openInterferenceManager(){sheet(`<h2>Interferences</h2><p class="muted">Reusable things that can interfere with a training session. You name them; the type keeps progression logic meaningful.</p>${renderInterferenceList()}<button class="btn full" onclick="openInterferenceForm()">+ ADD INTERFERENCE</button><button class="btn secondary full" style="margin-top:8px" onclick="closeSheet()">DONE</button>`)}
function openInterferenceForm(index=null){const a=interferenceItems(),x=index===null?null:a[index],name=interferenceName(x),cat=interferenceCategory(x);sheet(`<h2>${index===null?'Add':'Edit'} Interference</h2><div class="field"><label>Name</label><input id="interferenceName" value="${esc(name)}" placeholder="Your wording"></div><div class="field"><label>Type</label><select id="interferenceCategory">${['Dog','Handler','Environment','Training Plan','Other'].map(v=>`<option ${cat===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="sheetActions"><button class="btn secondary" onclick="openInterferenceManager()">Cancel</button><button class="btn" onclick="saveInterference(${index===null?'null':index})">SAVE</button></div>`)}
function saveInterference(index){const name=val('interferenceName'),category=document.getElementById('interferenceCategory')?.value||'Other';if(!name){alert('Enter a name.');return}const a=interferenceItems();if(a.some((x,i)=>i!==index&&interferenceName(x).trim().toLowerCase()===name.toLowerCase())){alert('That interference is already saved.');return}const item={id:(index===null?uid():(typeof a[index]==='object'&&a[index].id?a[index].id:uid())),name,category};if(index===null)a.push(item);else a[index]=item;save();openInterferenceManager();toast('Interference saved ✓')}

function openLibraryManager(key){sheet(`<h2>${libraryLabel(key)}</h2><p class="muted">Your reusable ${libraryLabel(key).toLowerCase()} library.</p>${renderLibraryList(key)}<button class="btn full" onclick="openLibraryItemForm('${key}')">+ ADD ${key==='places'?'PLACE':key==='articles'?'ARTICLE':key==='reinforcers'?'REINFORCER':'HANDLER STATE'}</button><button class="btn secondary full" style="margin-top:8px" onclick="closeSheet()">DONE</button>`)}
function openLibraryItemForm(key,index=null){const a=libraryItems(key),current=index===null?'':(a[index]||'');sheet(`<h2>${index===null?'Add':'Edit'} ${key==='places'?'Place':key==='articles'?'Article':key==='reinforcers'?'Reinforcer':'Handler State'}</h2><div class="field"><label>Name</label><input id="libraryItemName" value="${esc(current)}"></div><div class="sheetActions"><button class="btn secondary" onclick="openLibraryManager('${key}')">Cancel</button><button class="btn" onclick="saveLibraryItem('${key}',${index===null?'null':index})">SAVE</button></div>`)}
function saveLibraryItem(key,index){const name=val('libraryItemName');if(!name){alert('Enter a name.');return}const a=libraryItems(key);if(a.some((x,i)=>i!==index&&x.trim().toLowerCase()===name.toLowerCase())){alert('That item is already saved.');return}if(index===null)a.push(name);else a[index]=name;if(key==='places')state.settings.locations=[...a];if(key==='reinforcers')state.settings.reinforcers=[...a];if(key==='handlerStates')state.settings.handlerStates=[...a];save();openLibraryManager(key);toast(`${libraryLabel(key).replace(/s$/,'')} saved ✓`)}

function moveLibraryItem(key,index,dir){const a=libraryItems(key),j=index+dir;if(j<0||j>=a.length)return;[a[index],a[j]]=[a[j],a[index]];if(key==='places')state.settings.locations=[...a];if(key==='reinforcers')state.settings.reinforcers=[...a];if(key==='handlerStates')state.settings.handlerStates=[...a];save();openLibraryManager(key)}

function componentVariablesBuilder(c){c.trackableVariables=c.trackableVariables||[];return c.trackableVariables.length?c.trackableVariables.map(v=>`<div class="listrow"><div class="grow"><b>${esc(v.name)}</b><div class="tiny muted">${esc(variableTypeLabel(v))}${v.repeatable?' · Repeatable':''}</div></div><button class="btn small secondary" onclick="openVariableForm('${v.id}')">EDIT</button></div>`).join(''):`<div class="card empty">No trackable variables attached yet.</div>`}
function openVariableForm(id){const c=component(nav.builder.exerciseId,nav.builder.componentId);c.trackableVariables=c.trackableVariables||[];const v=id?c.trackableVariables.find(x=>x.id===id):null;sheet(`<h2>${v?'Edit':'Add'} Trackable Variable</h2><div class="field"><label>Variable Name</label><input id="varName" value="${esc(v?.name||'')}"></div><div class="field"><label>Type</label><select id="varType" onchange="refreshVariableOptions()"><option value="number" ${v?.type==='number'?'selected':''}>Number</option><option value="choice" ${v?.type==='choice'?'selected':''}>Choice</option><option value="library" ${v?.type==='library'?'selected':''}>Library Choice</option><option value="boolean" ${v?.type==='boolean'?'selected':''}>Yes / No</option></select></div><div id="varOptions"></div><div class="field"><label><input id="varRepeatable" type="checkbox" ${v?.repeatable?'checked':''} style="width:auto;margin-right:8px"> Repeatable during a session</label></div><div class="sheetActions"><button class="btn secondary" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveVariable('${id||''}')">SAVE</button></div>${v?`<button class="btn secondary full" style="margin-top:10px" onclick="saveCurrentAsTemplate('variables','${v.id}')">SAVE AS REUSABLE TEMPLATE</button><button class="btn danger full" style="margin-top:10px" onclick="deleteVariable('${v.id}')">DELETE VARIABLE</button>`:''}`);setTimeout(()=>refreshVariableOptions(v),0)}
function refreshVariableOptions(existing=null){const type=document.getElementById('varType')?.value,box=document.getElementById('varOptions');if(!box)return;if(type==='choice')box.innerHTML=`<div class="field"><label>Choices — one per line</label><textarea id="varChoices">${esc((existing?.choices||[]).join('\n'))}</textarea></div>`;else if(type==='library')box.innerHTML=`<div class="field"><label>Library</label><select id="varLibrary"><option value="articles" ${existing?.libraryKey!=='places'?'selected':''}>Articles</option><option value="places" ${existing?.libraryKey==='places'?'selected':''}>Places</option><option value="reinforcers" ${existing?.libraryKey==='reinforcers'?'selected':''}>Reinforcers</option><option value="handlerStates" ${existing?.libraryKey==='handlerStates'?'selected':''}>Handler States</option></select></div>`;else box.innerHTML=''}
function saveVariable(id){const c=component(nav.builder.exerciseId,nav.builder.componentId);c.trackableVariables=c.trackableVariables||[];const name=val('varName'),type=document.getElementById('varType').value;if(!name){alert('Enter a variable name.');return}const obj={id:id||uid(),name,type,repeatable:document.getElementById('varRepeatable').checked};if(type==='choice')obj.choices=(document.getElementById('varChoices')?.value||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(type==='library')obj.libraryKey=document.getElementById('varLibrary').value;const i=c.trackableVariables.findIndex(x=>x.id===id);if(i>=0)c.trackableVariables[i]=obj;else c.trackableVariables.push(obj);save();closeSheet();render();toast('Trackable variable saved ✓')}
function deleteVariable(id){const c=component(nav.builder.exerciseId,nav.builder.componentId);if(!confirm('Delete this trackable variable? Existing curriculum and training tools will not be changed.'))return;c.trackableVariables=(c.trackableVariables||[]).filter(x=>x.id!==id);save();closeSheet();render();toast('Trackable variable deleted ✓')}
function componentToolsBuilder(c){c.tools=c.tools||[];return c.tools.length?c.tools.map(t=>`<div class="listrow"><div class="grow"><b>${esc(t.name)}</b><div class="tiny muted">${t.type==='timer'?`Random Timer · ${t.min}–${t.max} ${t.units}`:`Random ${esc(t.numberName)}${t.secondName?' + '+esc(t.secondName):''}`}</div></div><button class="btn small secondary" onclick="openToolForm('${t.type}','${t.id}')">EDIT</button></div>`).join(''):`<div class="card empty">No tools attached yet.</div>`}

function templateItems(kind){state.libraries=state.libraries||{};const key=kind==='tools'?'toolTemplates':'variableTemplates';state.libraries[key]=Array.isArray(state.libraries[key])?state.libraries[key]:[];return state.libraries[key]}
function cloneForComponent(obj){const x=JSON.parse(JSON.stringify(obj));x.id=uid();delete x.templateId;return x}
function chooseToolSource(){const a=templateItems('tools');sheet(`<h2>Add Training Tool</h2><p class="muted">Tools stay Component-specific. Start from a reusable template or create one just for this Component.</p>${a.length?`<button class="btn full" onclick="chooseExistingTemplate('tools')">CHOOSE EXISTING TEMPLATE</button>`:''}<button class="btn full secondary" style="margin-top:10px" onclick="chooseToolType()">CREATE NEW</button>`)}
function chooseVariableSource(){const a=templateItems('variables');sheet(`<h2>Add Trackable Variable</h2><p class="muted">Variables stay Component-specific. Start from a reusable template or create one just for this Component.</p>${a.length?`<button class="btn full" onclick="chooseExistingTemplate('variables')">CHOOSE EXISTING TEMPLATE</button>`:''}<button class="btn full secondary" style="margin-top:10px" onclick="openVariableForm()">CREATE NEW</button>`)}
function templateSummary(kind,x){if(kind==='tools')return x.type==='timer'?`${x.min}–${x.max} ${x.units||'seconds'}`:`${x.numberName||'Number'} ${x.min}–${x.max}${x.secondName?' + '+x.secondName:''}`;return `${variableTypeLabel(x)}${x.repeatable?' · Repeatable':''}`}
function chooseExistingTemplate(kind){const a=templateItems(kind);sheet(`<h2>Choose ${kind==='tools'?'Training Tool':'Trackable Variable'} Template</h2><p class="muted">This adds a Component-specific copy. You can edit this Component without changing the reusable template.</p>${a.map(x=>`<button class="btn full secondary" style="margin-top:8px;text-align:left" onclick="attachTemplate('${kind}','${x.id}')"><b>${esc(x.name)}</b><div class="tiny muted">${esc(templateSummary(kind,x))}</div></button>`).join('')}<button class="btn ghost full" style="margin-top:10px" onclick="${kind==='tools'?'chooseToolSource()':'chooseVariableSource()'}">BACK</button>`)}
function attachTemplate(kind,id){const t=templateItems(kind).find(x=>x.id===id);if(!t)return;const c=component(nav.builder.exerciseId,nav.builder.componentId);if(kind==='tools'){c.tools=c.tools||[];c.tools.push(cloneForComponent(t))}else{c.trackableVariables=c.trackableVariables||[];c.trackableVariables.push(cloneForComponent(t))}save();closeSheet();render();toast(`${kind==='tools'?'Training tool':'Trackable variable'} attached ✓`)}
function saveCurrentAsTemplate(kind,id){const c=component(nav.builder.exerciseId,nav.builder.componentId),src=kind==='tools'?(c.tools||[]).find(x=>x.id===id):(c.trackableVariables||[]).find(x=>x.id===id);if(!src)return;const a=templateItems(kind);if(a.some(x=>x.name.trim().toLowerCase()===src.name.trim().toLowerCase())){alert('A reusable template with that name already exists.');return}const t=JSON.parse(JSON.stringify(src));t.id=uid();a.push(t);save();toast('Saved as reusable template ✓')}
function openTemplateManager(kind){const a=templateItems(kind);sheet(`<h2>${kind==='tools'?'Training Tool':'Trackable Variable'} Templates</h2><p class="muted">Reusable starting points. Components still keep their own attached copies and settings.</p>${a.length?a.map(x=>`<div class="listrow"><div class="grow"><b>${esc(x.name)}</b><div class="tiny muted">${esc(templateSummary(kind,x))}</div></div><button class="btn small danger" onclick="deleteTemplate('${kind}','${x.id}')">DELETE</button></div>`).join(''):'<div class="empty">No reusable templates saved yet.</div>'}<button class="btn secondary full" style="margin-top:8px" onclick="closeSheet()">DONE</button>`)}
function deleteTemplate(kind,id){const a=templateItems(kind),i=a.findIndex(x=>x.id===id);if(i<0)return;if(!confirm('Delete this reusable template? Components already using it will not change.'))return;a.splice(i,1);save();openTemplateManager(kind)}

function chooseToolType(){sheet(`<h2>Add training tool</h2><button class="btn full" onclick="openToolForm('timer')">⏱ RANDOM TIMER</button><button class="btn full secondary" style="margin-top:10px" onclick="openToolForm('random')">🎲 RANDOM NUMBER + CUSTOM VARIABLE</button>`)}
function openToolForm(type,id){const c=component(nav.builder.exerciseId,nav.builder.componentId),t=id?(c.tools||[]).find(x=>x.id===id):null;if(type==='timer')sheet(`<h2>Random Timer</h2><div class="field"><label>Tool Name</label><input id="toolName" value="${esc(t?.name||'')}"></div><div class="field"><label>Minimum</label><input id="toolMin" type="number" value="${t?.min??60}"></div><div class="field"><label>Maximum</label><input id="toolMax" type="number" value="${t?.max??180}"></div><div class="field"><label>Units</label><select id="toolUnits"><option ${t?.units!=='minutes'?'selected':''}>seconds</option><option ${t?.units==='minutes'?'selected':''}>minutes</option></select></div><button class="btn full" onclick="saveTool('timer','${id||''}')">SAVE TOOL</button>${t?`<button class="btn secondary full" style="margin-top:10px" onclick="saveCurrentAsTemplate('tools','${t.id}')">SAVE AS REUSABLE TEMPLATE</button>`:''}`);else sheet(`<h2>Random Number + Custom Variable</h2><div class="field"><label>Tool Name</label><input id="toolName" value="${esc(t?.name||'')}"></div><div class="field"><label>Number variable name</label><input id="numberName" value="${esc(t?.numberName||'Steps')}"></div><div class="field"><label>Minimum</label><input id="toolMin" type="number" value="${t?.min??1}"></div><div class="field"><label>Maximum</label><input id="toolMax" type="number" value="${t?.max??10}"></div><div class="field"><label>How many results</label><input id="toolCount" type="number" value="${t?.count??3}"></div><div class="field"><label>Second variable name (optional)</label><input id="secondName" value="${esc(t?.secondName||'')}" placeholder="Leave blank to randomize only the number"></div><div class="field"><label>Possible values — one per line (optional)</label><textarea id="secondValues">${esc((t?.values||[]).join('\n'))}</textarea></div><button class="btn full" onclick="saveTool('random','${id||''}')">SAVE TOOL</button>${t?`<button class="btn secondary full" style="margin-top:10px" onclick="saveCurrentAsTemplate('tools','${t.id}')">SAVE AS REUSABLE TEMPLATE</button>`:''}`)}
function saveTool(type,id){try{const c=component(nav.builder.exerciseId,nav.builder.componentId);c.tools=c.tools||[];const name=val('toolName'),min=Number(val('toolMin')),max=Number(val('toolMax'));if(!name||max<min)throw new Error('Check tool values');let obj={id:id||uid(),type,name,min,max};if(type==='timer')obj.units=document.getElementById('toolUnits').value;else{obj.numberName=val('numberName');obj.count=Math.max(1,Number(val('toolCount'))||1);obj.secondName=val('secondName');obj.values=(document.getElementById('secondValues').value||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean)}const i=c.tools.findIndex(x=>x.id===id);if(i>=0)c.tools[i]=obj;else c.tools.push(obj);save();closeSheet();render();toast('Training tool saved ✓')}catch(e){alert(e.message)}}
function beginTraining(gid,eid,cid,sid){nav.training={gid,eid,cid,sid};nav.recordingMode='rep';show('setupScreen')}
function pickStepForTrain(gid,eid,cid){const c=component(eid,cid);sheet(`<h2>Choose ${esc(c.name)} step</h2>${c.steps.map((s,i)=>`<div class="listrow ${c.currentStepId===s.id?'current':''}"><div class="num">${i+1}</div><div class="grow"><b>${esc(s.name)}</b></div><button class="btn small" onclick="closeSheet();beginTraining('${gid}','${eid}','${cid}','${s.id}')">TRAIN</button></div>`).join('')}`)}
function selectField(label,id,opts,custom=false){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(x=>`<option>${esc(x)}</option>`).join('')}${custom?'<option>Custom / Other</option>':''}</select></div>`}
function setupLibraryField(label,id,key){const a=libraryItems(key);return a.length?selectField(label,id,a):`<div class="card"><div class="kicker">${label.toUpperCase()}</div><div class="muted tiny" style="margin:6px 0 10px">No ${libraryLabel(key).toLowerCase()} saved.</div><button class="btn secondary full" onclick="openLibraryManager('${key}')">+ ADD ${label.toUpperCase()}</button></div>`}
function defaultSessionTime(){const d=new Date(),m=Math.round(d.getMinutes()/5)*5;if(m===60){d.setHours(d.getHours()+1);d.setMinutes(0)}else d.setMinutes(m);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function localDateKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function renderSetup(){if(!nav.training)return;const {gid,eid,cid,sid}=nav.training,g=goal(gid)||displayGoalForExercise(exercise(eid)),e=exercise(eid),c=component(eid,cid),s=step(eid,cid,sid),f=c.sessionFields||{place:true,reinforcer:true,rewardPosition:false,handlerState:true};document.getElementById('setupScreen').innerHTML=`<div class="topbar"><button class="btn small ghost" onclick="show('trainScreen')">‹ Back</button><div class="grow"><div class="eyebrow">SESSION SETUP</div><div class="title" style="font-size:21px">${esc(e.name)} — ${esc(c.name)}</div><div class="subtitle">${esc(s.name)}</div></div></div><div class="sessionContext"><span class="tiny muted">TODAY'S JOB</span><strong>${esc(s.todayJob||s.actions||'No Today’s Job entered')}</strong><button class="btn secondary full" style="margin-top:10px" onclick="openStepDetails('${e.id}','${c.id}','${s.id}','setup')">STEP DETAILS</button></div>${f.place?setupLibraryField('Place','setupLocation','places'):''}${f.reinforcer?setupLibraryField('Reinforcer','setupReinforcer','reinforcers'):''}${f.rewardPosition?(state.settings.rewardPositions.length?selectField('Reward Position','setupReward',state.settings.rewardPositions):`<div class="card"><div class="kicker">REWARD POSITION</div><div class="muted tiny" style="margin:6px 0 10px">No reward positions saved.</div><button class="btn secondary full" onclick="addRewardFromSetup()">+ ADD REWARD POSITION</button></div>`):''}${f.handlerState?setupLibraryField('Handler State','setupHandler','handlerStates'):''}<div class="field"><label>SESSION TIME</label><input id="setupSessionTime" type="time" step="300" value="${defaultSessionTime()}"><div class="tiny muted" style="margin-top:5px">Defaults to now. Change it in 5-minute increments if you trained earlier or later.</div></div><div class="field"><label>SETUP NOTES (OPTIONAL)</label><textarea id="setupNotes" style="min-height:220px;width:100%;box-sizing:border-box" placeholder="Anything about setup, conditions, or what you plan to do..."></textarea></div><button class="btn full" onclick="startSession()">START TRAINING</button>`}
function setMode(m){nav.recordingMode=m;document.getElementById('modeRep').className='btn '+(m==='rep'?'':'secondary');document.getElementById('modeOverview').className='btn '+(m==='overview'?'':'secondary')}
function startSession(){const {gid,eid,cid,sid}=nav.training,g=goal(gid)||displayGoalForExercise(exercise(eid)),e=exercise(eid),c=component(eid,cid),st=step(eid,cid,sid),f=c.sessionFields||{};nav.session={id:uid(),goalId:g?.id||'',exerciseId:e.id,componentId:c.id,stepId:st.id,goalName:g?.name||'',exerciseName:e.name,componentName:c.name,stepName:st.name,criterion:st.criterion||'',handler:'Kerrie',location:f.place?(document.getElementById('setupLocation')?.value||''):'',reinforcer:f.reinforcer?(document.getElementById('setupReinforcer')?.value||''):'',rewardPosition:f.rewardPosition?(document.getElementById('setupReward')?.value||''):'',handlerState:f.handlerState?(document.getElementById('setupHandler')?.value||''):'',reps:[],setupNote:document.getElementById('setupNotes')?.value||'',note:'',sessionDate:localDateKey(),sessionTime:document.getElementById('setupSessionTime')?.value||defaultSessionTime(),limiters:[],interferences:[],startedAt:new Date().toISOString()};show('liveScreen')}
const outcomes=[['beautiful','☕','Beautiful'],['good','☕','Good'],['meh','☕','Meh'],['spilled','☕','Spilled']];
function liveTools(s){const c=component(s.exerciseId,s.componentId),tools=c?.tools||[];if(!tools.length)return '';return `<div class="card"><div class="kicker">TRAINING TOOLS</div>${tools.map(t=>t.type==='timer'?`<div class="listrow"><div class="grow"><b>⏱ ${esc(t.name)}</b><div class="tiny muted">${t.min}–${t.max} ${t.units}</div><div id="toolout-${t.id}" class="lime" style="font-size:22px;font-weight:900;margin-top:5px"></div></div><button class="btn small" onclick="generateTimer('${t.id}')">GENERATE</button></div>`:`<div><b>🎲 ${esc(t.name)}</b><div id="toolout-${t.id}" class="tiny" style="margin:8px 0"></div><button class="btn small" onclick="generateRandom('${t.id}')">GENERATE</button></div>`).join('')}</div>`}
function findTool(id){return (component(nav.session.exerciseId,nav.session.componentId)?.tools||[]).find(x=>x.id===id)}
function generateTimer(id){const t=findTool(id),n=Math.floor(Math.random()*(t.max-t.min+1))+t.min,sec=t.units==='minutes'?n*60:n;const el=document.getElementById('toolout-'+id);el.dataset.seconds=sec;el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;el.innerHTML+=` <button class="btn small secondary" onclick="startCountdown('${id}')">START</button>`}
const timers={};function startCountdown(id){clearInterval(timers[id]);const el=document.getElementById('toolout-'+id);let n=Number(el.dataset.seconds||0);timers[id]=setInterval(()=>{n--;el.dataset.seconds=n;el.firstChild.textContent=`${Math.floor(Math.max(0,n)/60)}:${String(Math.max(0,n)%60).padStart(2,'0')} `;if(n<=0){clearInterval(timers[id]);navigator.vibrate?.(200)}},1000)}
function generateRandom(id){const t=findTool(id),out=[];for(let i=0;i<t.count;i++){const n=Math.floor(Math.random()*(t.max-t.min+1))+t.min;const hasSecond=t.secondName&&(t.values||[]).length;out.push(hasSecond?`${n} ${t.numberName} → ${t.values[Math.floor(Math.random()*t.values.length)]}`:`${n} ${t.numberName}`)}document.getElementById('toolout-'+id).innerHTML=out.map(x=>`<div class="outcomeChip">${esc(x)}</div>`).join(' ')}
function preserveLiveNote(){if(nav.session){const el=document.getElementById('liveNotes');if(el)nav.session.note=el.value}}
function variableInput(v){const id=`var_${v.id}`;if(v.type==='number')return `<div class="field"><label>${esc(v.name)}</label><input id="${id}" type="number" inputmode="decimal"></div>`;if(v.type==='boolean')return `<div class="field"><label><input id="${id}" type="checkbox" style="width:auto;margin-right:8px"> ${esc(v.name)}</label></div>`;const opts=v.type==='library'?libraryItems(v.libraryKey||'articles'):(v.choices||[]);return `<div class="field"><label>${esc(v.name)}</label><select id="${id}"><option value="">Choose…</option>${opts.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`}
function recordVariablesUI(s){const vars=component(s.exerciseId,s.componentId)?.trackableVariables||[];if(!vars.length)return '';return `<div class="card"><div class="kicker">ADD A RECORD (OPTIONAL)</div><div class="tiny muted" style="margin-bottom:10px">Save one, many, or none. These fields come from this Component.</div>${vars.map(variableInput).join('')}<button class="btn full" onclick="addTrainingRecord()">+ SAVE RECORD</button></div>${s.reps.length?`<div class="card"><div class="kicker">RECORDED (${s.reps.length})</div>${s.reps.map((r,i)=>`<div class="listrow"><div class="grow"><b>${i+1}</b> <span class="tiny">${Object.entries(r.values||{}).map(([k,v])=>`${esc(k)}: ${esc(String(v))}`).join(' · ')}</span></div><button class="btn small danger" onclick="deleteTrainingRecord(${i})">DELETE</button></div>`).join('')}</div>`:''}`}
function addTrainingRecord(){preserveLiveNote();const s=nav.session,vars=component(s.exerciseId,s.componentId)?.trackableVariables||[],values={};vars.forEach(v=>{const el=document.getElementById(`var_${v.id}`);if(!el)return;const value=v.type==='boolean'?el.checked:el.value;if(value!==''&&value!==false)values[v.name]=v.type==='number'?Number(value):value});s.reps.push({id:uid(),values,at:new Date().toISOString()});renderLive();toast('Record saved ✓')}
function deleteTrainingRecord(i){preserveLiveNote();nav.session.reps.splice(i,1);renderLive()}
function voiceNote(id){const el=document.getElementById(id);if(!el)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){el.focus();alert('Direct voice capture is not available in this browser. Tap the microphone on the iPhone keyboard to dictate into this Notes box.');return}const r=new SR();r.continuous=false;r.interimResults=false;r.lang='en-US';r.onresult=e=>{const words=[...e.results].map(x=>x[0].transcript).join(' ');el.value+=(el.value.trim()?' ':'')+words;if(nav.session&&id==='liveNotes')nav.session.note=el.value};r.onerror=()=>{el.focus();toast('Use the iPhone keyboard microphone for dictation.');};r.start();toast('Listening… 🎙')}
function stepNumber(eid,cid,sid){const c=component(eid,cid),i=c?.steps?.findIndex(x=>x.id===sid)??-1;return i>=0?i+1:''}
function stepJob(st){return st?.todayJob||st?.actions||'No Today’s Job entered'}
function openStepDetails(eid,cid,sid,returnTo='live'){if(nav.session&&returnTo==='live')preserveLiveNote();if(nav.session&&returnTo==='summary')syncSummaryFields();const st=step(eid,cid,sid),c=component(eid,cid),n=stepNumber(eid,cid,sid);if(!st)return;const block=(label,value)=>value?`<div class="card"><div class="kicker">${label}</div><div style="white-space:pre-wrap;line-height:1.5;margin-top:8px">${esc(value)}</div></div>`:'';sheet(`<div class="kicker">${esc(c?.name||'')} · STEP ${n}</div><h2>${esc(st.name)}</h2>${block('STEP GOAL',st.goal)}${block("TODAY'S JOB",st.todayJob)}${block('STEPS TO PERFORM THIS STEP',st.actions)}${block('DESCRIPTION',st.description)}${block('CRITERION FOR SUCCESS',st.criterion)}${block('PROGRESSION / OUTCOME RULE',st.rule)}<button class="btn full" onclick="closeSheet()">BACK TO ${returnTo==='summary'?'END SESSION':returnTo==='setup'?'SESSION SETUP':'TRAINING'}</button>`)}
function stepSnapshot(label,s,eid,cid,returnTo){if(!s)return '';const n=stepNumber(eid,cid,s.id);return `<div class="sessionContext"><span class="tiny muted">${label}</span><strong>Step ${n} — ${esc(s.name)}</strong><div class="tiny" style="margin-top:7px"><b>TODAY'S JOB:</b> ${esc(stepJob(s))}</div><button class="linkish tiny" style="margin-top:9px" onclick="openStepDetails('${eid}','${cid}','${s.id}','${returnTo}')">STEP DETAILS ›</button></div>`}
function renderLive(){const s=nav.session;if(!s)return;const st=step(s.exerciseId,s.componentId,s.stepId),n=stepNumber(s.exerciseId,s.componentId,s.stepId);document.getElementById('liveScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">TRAINING</div><div class="title" style="font-size:22px">${esc(s.exerciseName)} — ${esc(s.componentName)}</div><div class="subtitle">Step ${n} — ${esc(s.stepName)}</div></div><button class="btn small ghost" onclick="endSession()">End</button></div><div class="card" style="border:2px solid #d88aa0"><div class="kicker">CURRENT STEP · STEP ${n}</div><h3 style="margin:6px 0 10px">${esc(st?.name||s.stepName)}</h3><div class="kicker">TODAY'S JOB</div><div class="bigCriterion">${esc(stepJob(st))}</div><button class="btn secondary full" onclick="openStepDetails('${s.exerciseId}','${s.componentId}','${s.stepId}','live')">STEP DETAILS</button></div>${liveTools(s)}${recordVariablesUI(s)}<div class="card"><div class="kicker">SESSION NOTES</div><textarea id="liveNotes" style="min-height:330px;width:100%;box-sizing:border-box" placeholder="Dictate or type observations, changes, ideas for next time…">${esc(s.note||'')}</textarea></div><button class="btn full" style="margin-top:12px" onclick="endSession()">END SESSION</button>`}
function endSession(){preserveLiveNote();show('summaryScreen')}
function sessionCoffee(s){return s.sessionOutcome||s.overviewOutcome||null}
function setSessionCoffee(o){syncSummaryFields();nav.session.sessionOutcome=o;renderSummary()}
function countsAgainstProgression(s){const legacy=(s.limiters||[]).some(x=>['Environment','Handler','Training Plan'].includes(x));const blocked=(s.interferences||[]).some(id=>{const x=interferenceItems().find(z=>(typeof z==='object'?z.id:interferenceName(z))===id);return x&&['Environment','Handler','Training Plan'].includes(interferenceCategory(x))});return !(legacy||blocked)}
function progressionRecommendation(s){const o=sessionCoffee(s);if(!countsAgainstProgression(s)){return {offset:0,action:'STAY HERE',direction:'STAY ON CURRENT STEP',text:'An interference was marked that should not automatically count against the progression. FIELDWORK recommends staying on the current step; you can override it.'}}if(o==='beautiful')return {offset:1,action:'ADVANCE 1 STEP',direction:'GO FORWARD 1 STEP',text:'You rated this session Beautiful. FIELDWORK recommends moving forward one step.'};if(o==='good')return {offset:1,action:'ADVANCE 1 STEP',direction:'GO FORWARD 1 STEP',text:'You rated this session Good. FIELDWORK recommends moving forward one step.'};if(o==='meh')return {offset:-1,action:'GO BACK 1 STEP',direction:'GO BACK 1 STEP',text:'You rated this session Meh. FIELDWORK recommends going back one step.'};if(o==='spilled')return {offset:-2,action:'GO BACK 2 STEPS',direction:'GO BACK 2 STEPS',text:'You rated this session Spilled. FIELDWORK recommends going back two steps.'};return {offset:0,action:'CHOOSE COFFEE',direction:'NO RECOMMENDATION YET',text:'Choose one overall Coffee result and FIELDWORK will make one clear recommendation.'}}
function proposedStep(s){const rec=progressionRecommendation(s),c=component(s.exerciseId,s.componentId),idx=c.steps.findIndex(x=>x.id===s.stepId),ni=Math.max(0,Math.min(c.steps.length-1,idx+rec.offset));return c.steps[ni]||c.steps[idx]}
function renderSummary(){const s=nav.session;if(!s)return;const rec=progressionRecommendation(s),cur=step(s.exerciseId,s.componentId,s.stepId),ps=proposedStep(s),ints=interferenceItems(),curN=stepNumber(s.exerciseId,s.componentId,s.stepId),psN=ps?stepNumber(s.exerciseId,s.componentId,ps.id):curN;document.getElementById('summaryScreen').innerHTML=`<div class="topbar"><div><div class="eyebrow">END SESSION</div><div class="title">${esc(s.exerciseName)} — ${esc(s.componentName)}</div><div class="subtitle">Session time · ${esc(s.sessionTime||'')}</div></div></div>${stepSnapshot('YOU TRAINED',cur,s.exerciseId,s.componentId,'summary')}<div class="card"><div class="kicker">SESSION NOTES</div><textarea id="sumNotes" style="min-height:330px;width:100%;box-sizing:border-box" placeholder="Anything you want to remember…">${esc(s.note||'')}</textarea></div><div class="card" style="border:2px solid #d88aa0;background:#fff3f6"><div class="kicker">☕ COFFEE EVALUATION</div><div class="coffeeGrid">${outcomes.map(o=>`<button class="coffee ${sessionCoffee(s)===o[0]?'selected':''}" onclick="setSessionCoffee('${o[0]}')"><span>${o[1]}</span>${o[2]}</button>`).join('')}</div></div><div class="card"><div class="kicker">INTERFERENCES</div><p class="tiny muted">Select any saved interference that affected this session.</p>${ints.length?`<div class="tagGrid">${ints.map(x=>{const id=typeof x==='object'?x.id:interferenceName(x);return `<button class="tag ${(s.interferences||[]).includes(id)?'selected':''}" onclick="toggleInterference('${id}')">${esc(interferenceName(x))}</button>`}).join('')}</div>`:`<div class="empty" style="padding:14px">No interferences saved.</div>`}<button class="btn secondary full" style="margin-top:10px" onclick="openInterferenceManager()">MANAGE INTERFERENCES</button></div><div class="card" style="border:2px solid #d88aa0"><div class="kicker">FIELDWORK RECOMMENDS</div><h3>${esc(rec.action)}</h3><p>${esc(rec.text)}</p>${stepSnapshot('YOU TRAINED',cur,s.exerciseId,s.componentId,'summary')}<div class="center kicker" style="font-size:14px;margin:12px 0">${esc(rec.direction)}</div>${stepSnapshot('RECOMMENDED NEXT STEP',ps,s.exerciseId,s.componentId,'summary')}</div><div class="card"><div class="kicker">YOU CHOOSE</div><button class="btn full" onclick="acceptProposal()">ACCEPT RECOMMENDATION · STEP ${psN}</button><div class="decisionGrid" style="margin-top:10px"><button class="btn secondary" onclick="saveDecision('Repeat','${cur?.id||s.stepId}')">STAY ON STEP ${curN}</button><button class="btn secondary" onclick="chooseRelativeStep(-1)">GO BACK ONE STEP</button><button class="btn secondary" onclick="chooseDifferentStep()">CHOOSE DIFFERENT STEP</button></div></div>`}
function syncSummaryFields(){if(!nav.session)return;const n=document.getElementById('sumNotes');if(n)nav.session.note=n.value}
function acceptProposal(){syncSummaryFields();const s=nav.session,ps=proposedStep(s);if(!ps){saveDecision('Repeat');return}saveDecision('FIELDWORK Proposal',ps.id)}
function toggleInterference(id){syncSummaryFields();const a=nav.session.interferences||(nav.session.interferences=[]),i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);renderSummary()}
function chooseRelativeStep(offset){syncSummaryFields();const s=nav.session,c=component(s.exerciseId,s.componentId),idx=c.steps.findIndex(x=>x.id===s.stepId),ni=Math.max(0,Math.min(c.steps.length-1,idx+offset)),target=c.steps[ni];if(target)saveDecision(offset<0?'Step Back':'Advance',target.id)}
function saveDecision(decision,chosenStepId=null){syncSummaryFields();const s=nav.session;if(!sessionCoffee(s)){alert('Choose one overall Session Coffee result before saving.');return}const c=component(s.exerciseId,s.componentId),idx=c.steps.findIndex(x=>x.id===s.stepId);let next=s.stepId;if(chosenStepId)next=chosenStepId;else if(decision==='Advance'&&idx<c.steps.length-1)next=c.steps[idx+1].id;else if(decision==='Step Back'&&idx>0)next=c.steps[idx-1].id;c.currentStepId=next;s.decision=decision;s.resultingStepId=next;s.savedAt=new Date().toISOString();state.sessions.push({...s});state.todayItems=(state.todayItems||[]).filter(x=>!(x.exerciseId===s.exerciseId&&x.componentId===s.componentId));save();nav.session=null;nav.training=null;show('homeScreen');toast(`Saved. ${c.name} history + coverage updated.`)}
function chooseDifferentStep(){syncSummaryFields();const s=nav.session,c=component(s.exerciseId,s.componentId);sheet(`<h2>Choose ${esc(c.name)} step</h2>${c.steps.map((x,i)=>`<div class="listrow ${c.currentStepId===x.id?'current':''}" style="align-items:flex-start"><div class="num">${i+1}</div><div class="grow"><b>${esc(x.name)}</b><div class="tiny muted" style="margin-top:5px"><b>Today’s Job:</b> ${esc(stepJob(x))}</div><button class="linkish tiny" style="margin-top:7px" onclick="openStepDetails('${s.exerciseId}','${s.componentId}','${x.id}','summary')">DETAILS ›</button></div><button class="btn small" onclick="closeSheet();saveDecision('Choose Different Step','${x.id}')">CHOOSE</button></div>`).join('')}`)}
function sheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeSheet(){document.getElementById('modal').classList.remove('show')}
function val(id){return document.getElementById(id)?.value.trim()||''}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`FIELDWORK-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function toast(msg){const d=document.createElement('div');d.textContent=msg;Object.assign(d.style,{position:'fixed',left:'50%',bottom:'92px',transform:'translateX(-50%)',background:'#234d38',color:'#fffaf0',padding:'10px 14px',borderRadius:'999px',fontWeight:'900',fontSize:'12px',zIndex:99});document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>show(b.dataset.screen));
document.getElementById('builderScreen').addEventListener('click',e=>{const g=e.target.closest('.js-open-goal');if(g){openGoal(g.dataset.goalId);return}const ex=e.target.closest('.js-open-exercise');if(ex){openExercise(ex.dataset.exerciseId);return}const c=e.target.closest('.js-open-component');if(c){openComponent(c.dataset.componentId);return}});
document.getElementById('photoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.dog.photo=r.result;save();renderHome()};r.readAsDataURL(f)});
document.getElementById('restoreInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);if(!raw.version||!Array.isArray(raw.goals))throw 0;const x=migrate(raw);const gc=x.goals.length,ec=x.exercises.length,cc=x.exercises.reduce((n,e)=>n+e.components.length,0),sc=x.exercises.reduce((n,e)=>n+e.components.reduce((m,c)=>m+c.steps.length,0),0);if(!confirm(`Restore this backup?\n\n${gc} goals · ${ec} exercises · ${cc} components · ${sc} steps\n\nCurrent data will first be preserved as an emergency recovery copy.`))return;localStorage.setItem(RECOVERY_KEY,JSON.stringify(state));state=x;save();render();show('homeScreen');toast('Backup restored and migrated ✓')}catch(_){alert('That does not look like a FIELDWORK backup.')}finally{e.target.value=''}};r.readAsText(f)});
render();
</script>
